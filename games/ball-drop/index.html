<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"
    />
    <title>Ball Drop</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1a56e0;
        color: #fff;
        font-family: Inter, system-ui, sans-serif;
        touch-action: none;
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      /* Bottom controls */
      #controls {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 10;
        background: linear-gradient(180deg, #1646c8, #0f34a0);
        border-top: 0;
        padding: 10px 14px 28px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .bet-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .bet-display {
        flex: 1;
        background: rgba(255, 255, 255, 0.14);
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-radius: 10px;
        height: 42px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        font-weight: 900;
        color: #fff;
        letter-spacing: 0.02em;
      }
      .bet-btn {
        width: 52px;
        height: 42px;
        border: 2px solid rgba(255, 255, 255, 0.35);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.2);
        color: #fff;
        font-size: 22px;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.1s;
      }
      .bet-btn:active {
        background: rgba(255, 255, 255, 0.16);
      }
      #spinBtn {
        height: 52px;
        width: 100%;
        border: 3px solid rgba(0, 0, 0, 0.55);
        border-radius: 12px;
        background: linear-gradient(180deg, #f8c825 0%, #e8920a 100%);
        color: #3d1f00;
        font-size: 20px;
        font-weight: 950;
        letter-spacing: 0.08em;
        cursor: pointer;
        box-shadow:
          0 4px 0 rgba(0, 0, 0, 0.4),
          inset 0 1px 0 rgba(255, 255, 255, 0.35);
        transition:
          transform 0.08s,
          box-shadow 0.08s;
      }
      #spinBtn:active,
      #spinBtn.pressed {
        transform: translateY(2px);
        box-shadow: 0 2px 0 rgba(0, 0, 0, 0.4);
      }
      #spinBtn:disabled {
        opacity: 0.4;
        cursor: default;
        transform: none;
      }

      #bal {
        position: fixed;
        top: var(--ptop);
        left: 12px;
        z-index: 11;
        height: 32px;
        padding: 0 12px 0 8px;
        border-radius: 16px;
        background: rgba(0, 0, 0, 0.45);
        color: #fff;
        font-size: 15px;
        font-weight: 900;
        display: flex;
        align-items: center;
        gap: 6px;
        pointer-events: none;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
      }
      #bal .coin, .coinI {
        display: inline-block;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #fff3a8, #ffc61a 55%, #d98a00);
        border: 2px solid #b36b00;
        box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.15);
      }
      .coinI {
        width: 14px;
        height: 14px;
        border-width: 1.5px;
        vertical-align: -2px;
        margin-left: 3px;
      }
      #ballRow {
        display: flex;
        gap: 8px;
      }
      .bv {
        flex: 1;
        height: 36px;
        border-radius: 10px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        font-size: 16px;
        font-weight: 900;
        cursor: pointer;
        transition: transform 0.08s, background 0.12s;
      }
      .bv.on {
        background: #fff;
        color: #0f34a0;
        border-color: #fff;
        transform: translateY(-1px);
      }
      .bv:disabled {
        opacity: 0.3;
      }
      .bv[data-v="2"].on { background: #2fd0ff; color: #02304a; border-color: #2fd0ff; }
      .bv[data-v="5"].on { background: #b05cff; color: #fff; border-color: #b05cff; }
      .bv[data-v="9"].on { background: #ff2d8a; color: #fff; border-color: #ff2d8a; }

      /* Profit flash top-left */
      #feedFlash {
        position: fixed;
        top: 52px;
        left: 10px;
        z-index: 10;
        font-size: 15px;
        font-weight: 900;
        pointer-events: none;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
        opacity: 0;
        transform: translateY(0px);
        transition:
          opacity 0.2s,
          transform 0.2s;
      }
      :root {
        --ptop: max(12px, calc(env(safe-area-inset-top, 0px) - 4px));
      }
      #muteBtn {
        position: fixed;
        top: var(--ptop);
        right: 52px;
        z-index: 11;
        width: 32px;
        height: 32px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
      #muteBtn svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: #fff;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #muteBtn.off svg {
        opacity: 0.45;
      }

      #streakBadge {
        position: fixed;
        top: 50px;
        left: 50%;
        z-index: 11;
        transform: translateX(-50%) scale(0.7);
        background: linear-gradient(135deg, #ff6b35, #f7931e);
        border-radius: 20px;
        padding: 6px 16px;
        font-size: 14px;
        font-weight: 950;
        letter-spacing: 0.03em;
        color: #fff;
        box-shadow: 0 4px 14px rgba(247, 147, 30, 0.4);
        opacity: 0;
        transition:
          opacity 0.15s,
          transform 0.15s;
        pointer-events: none;
      }
      #streakBadge.show {
        opacity: 1;
        transform: translateX(-50%) scale(1);
      }

      /* Boost badge */
      #boostBadge {
        position: fixed;
        top: 92px;
        left: 50%;
        z-index: 12;
        transform: translateX(-50%) scale(0.7);
        background: linear-gradient(135deg, #a855f7, #6366f1);
        border-radius: 20px;
        padding: 7px 18px;
        font-size: 14px;
        font-weight: 950;
        letter-spacing: 0.03em;
        color: #fff;
        box-shadow: 0 4px 18px rgba(139, 92, 246, 0.55);
        opacity: 0;
        transition:
          opacity 0.18s,
          transform 0.18s;
        pointer-events: none;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      #boostBadge.show {
        opacity: 1;
        transform: translateX(-50%) scale(1);
      }

      /* Challenge banner */
      #challengeBanner {
        position: fixed;
        top: 134px;
        left: 50%;
        z-index: 11;
        transform: translateX(-50%) translateY(-10px);
        width: min(300px, 86%);
        background: #151c2c;
        border: 1px solid rgba(168, 85, 247, 0.4);
        border-radius: 14px;
        padding: 10px 14px;
        opacity: 0;
        transition:
          opacity 0.2s,
          transform 0.2s;
        pointer-events: none;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      }
      #challengeBanner.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0px);
      }
      #challengeBanner .ctitle {
        font-size: 12px;
        font-weight: 800;
        color: #c4b5fd;
        letter-spacing: 0.02em;
        margin-bottom: 4px;
      }
      #challengeBanner .cbarTrack {
        height: 8px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
        margin-bottom: 4px;
      }
      #challengeBanner .cbarFill {
        height: 100%;
        background: linear-gradient(90deg, #a855f7, #6366f1);
        border-radius: 4px;
        width: 0%;
        transition: width 0.1s linear;
      }
      #challengeBanner .cmeta {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: #8a9bb8;
        font-weight: 700;
      }
      #challengeBanner.success {
        border-color: rgba(74, 222, 128, 0.5);
      }
      #challengeBanner.fail {
        border-color: rgba(248, 113, 113, 0.4);
      }

      /* Big win celebration */
      #bigWinFx {
        position: fixed;
        inset: 0;
        z-index: 25;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.15s;
      }
      #bigWinFx.show {
        opacity: 1;
      }
      #bigWinFx .bwtext {
        font-size: 54px;
        font-weight: 950;
        letter-spacing: -0.02em;
        background: linear-gradient(135deg, #fff7d6, #ffd84d, #ff9d2e);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 0 30px rgba(255, 200, 60, 0.5);
        transform: scale(0.6);
        transition: transform 0.35s cubic-bezier(0.2, 1.6, 0.4, 1);
      }
      #bigWinFx.show .bwtext {
        transform: scale(1);
      }
      .confetti {
        position: fixed;
        top: -10px;
        width: 8px;
        height: 14px;
        z-index: 24;
        pointer-events: none;
        border-radius: 2px;
      }

      /* Overlay */
      #overlay {
        position: fixed;
        inset: 0;
        z-index: 30;
        background: rgba(5, 8, 18, 0.93);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .ocard {
        text-align: center;
        padding: 32px 28px;
        background: #0e1420;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        width: min(340px, 90%);
      }
      .otitle {
        font-size: 38px;
        font-weight: 950;
        letter-spacing: -0.03em;
        background: linear-gradient(135deg, #ffe566, #f59e0b);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .osub {
        margin: 12px 0 26px;
        color: #8a9bb8;
        font-size: 14px;
        line-height: 1.7;
      }
      .oplay {
        height: 52px;
        width: 160px;
        border: 3px solid rgba(0, 0, 0, 0.55);
        border-radius: 12px;
        background: linear-gradient(180deg, #f8c825 0%, #e8920a 100%);
        color: #3d1f00;
        font-size: 20px;
        font-weight: 950;
        letter-spacing: 0.08em;
        cursor: pointer;
        box-shadow:
          0 4px 0 rgba(0, 0, 0, 0.4),
          inset 0 1px 0 rgba(255, 255, 255, 0.35);
      }

      /* Buy gems overlay */
      #buyOverlay {
        position: fixed;
        inset: 0;
        z-index: 40;
        background: rgba(5, 8, 18, 0.95);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .bcard {
        padding: 28px 24px;
        background: #0e1420;
        border: 1px solid rgba(59, 130, 246, 0.25);
        border-radius: 20px;
        width: min(340px, 92%);
      }
      .btitle {
        font-size: 24px;
        font-weight: 950;
        color: #60a5fa;
        margin-bottom: 4px;
      }
      .brate {
        font-size: 13px;
        color: #8a9bb8;
        margin-bottom: 20px;
      }
      .bpacks {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 20px;
      }
      .bpack {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px;
        border: 2px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        cursor: pointer;
        transition:
          border-color 0.12s,
          background 0.12s;
      }
      .bpack:active,
      .bpack.selected {
        border-color: #3b82f6;
        background: rgba(59, 130, 246, 0.12);
      }
      .bpack-left {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .bpack-gem {
        font-size: 22px;
      }
      .bpack-gems {
        font-size: 18px;
        font-weight: 900;
        color: #fff;
      }
      .bpack-label {
        font-size: 12px;
        color: #8a9bb8;
        margin-top: 1px;
      }
      .bpack-cost {
        font-size: 15px;
        font-weight: 800;
        color: #60a5fa;
      }
      .bpack-cost span {
        font-size: 11px;
        font-weight: 600;
        color: #8a9bb8;
      }
      .bbuy {
        height: 52px;
        width: 100%;
        border: 3px solid rgba(0, 0, 0, 0.55);
        border-radius: 12px;
        background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%);
        color: #fff;
        font-size: 18px;
        font-weight: 950;
        letter-spacing: 0.06em;
        cursor: pointer;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.4);
      }
      .bbuy:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .bcancel {
        display: block;
        margin-top: 12px;
        width: 100%;
        background: none;
        border: none;
        color: #8a9bb8;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        padding: 6px 0;
      }
      .bmana {
        font-size: 13px;
        color: #8a9bb8;
        text-align: center;
        margin-bottom: 16px;
      }
      .bmana strong {
        color: #60a5fa;
      }
      .berr {
        font-size: 13px;
        color: #f87171;
        text-align: center;
        margin-top: 8px;
        min-height: 18px;
      }

      /* ── Fun layer styling ── */
      #streakBadge {
        top: calc(var(--ptop) + 46px);
        background: linear-gradient(180deg, #ffb347, #ff6a2b);
        border: 3px solid #fff;
        border-radius: 999px;
        padding: 5px 16px 6px;
        font-size: 13px;
        text-shadow: 0 2px 0 rgba(120, 40, 0, 0.55);
        box-shadow:
          0 4px 0 rgba(120, 40, 0, 0.45),
          0 8px 18px rgba(255, 106, 43, 0.45);
      }
      #streakBadge b {
        font-size: 18px;
        margin-left: 2px;
      }
      #streakBadge.heat2 {
        background: linear-gradient(180deg, #ff7a5c, #e8233f);
        box-shadow:
          0 4px 0 rgba(110, 0, 20, 0.5),
          0 0 22px rgba(255, 60, 90, 0.7);
      }
      #streakBadge.heat3 {
        background: linear-gradient(180deg, #d27bff, #7a2bff);
        box-shadow:
          0 4px 0 rgba(40, 0, 110, 0.55),
          0 0 28px rgba(170, 90, 255, 0.85);
        animation: heatPulse 0.5s ease-in-out infinite alternate;
      }
      @keyframes heatPulse {
        to {
          transform: translateX(-50%) scale(1.08);
        }
      }
      #toast {
        position: fixed;
        top: calc(var(--ptop) + 92px);
        left: 50%;
        z-index: 12;
        transform: translateX(-50%) translateY(-8px) scale(0.85);
        padding: 7px 18px 8px;
        border-radius: 999px;
        border: 3px solid #fff;
        font-size: 14px;
        font-weight: 950;
        letter-spacing: 0.03em;
        color: #fff;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.18s,
          transform 0.22s cubic-bezier(0.2, 1.6, 0.4, 1);
      }
      #toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0) scale(1);
      }
      #toast.gold {
        background: linear-gradient(180deg, #ffe066, #f5a300);
        color: #5a3200;
        box-shadow:
          0 4px 0 rgba(120, 70, 0, 0.5),
          0 0 24px rgba(255, 210, 60, 0.7);
      }
      #toast.fire {
        background: linear-gradient(180deg, #ff9a4d, #e8233f);
        text-shadow: 0 2px 0 rgba(110, 0, 20, 0.55);
        box-shadow:
          0 4px 0 rgba(110, 0, 20, 0.5),
          0 0 26px rgba(255, 90, 60, 0.75);
      }
      #frenzy {
        position: relative;
        height: 26px;
        border-radius: 13px;
        background: rgba(0, 0, 0, 0.28);
        border: 2px solid rgba(255, 255, 255, 0.35);
        overflow: hidden;
        cursor: pointer;
      }
      #frenzyFill {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 0%;
        background: linear-gradient(90deg, #ffd84d, #ff8a2b 60%, #ff3b6b);
        transition: width 0.25s ease-out;
      }
      #frenzyTxt {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: 950;
        letter-spacing: 0.06em;
        color: #fff;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
      }
      #frenzy.ready {
        border-color: #fff;
        animation: frenzyGlow 0.55s ease-in-out infinite alternate;
      }
      @keyframes frenzyGlow {
        from {
          box-shadow: 0 0 6px rgba(255, 170, 60, 0.6);
          transform: scale(1);
        }
        to {
          box-shadow: 0 0 22px rgba(255, 90, 60, 0.95);
          transform: scale(1.025);
        }
      }

      #bustFlash {
        position: fixed;
        inset: 0;
        z-index: 24;
        pointer-events: none;
        opacity: 0;
        background: radial-gradient(
          ellipse at 50% 60%,
          rgba(255, 30, 70, 0) 30%,
          rgba(255, 30, 70, 0.55) 100%
        );
      }
      #bustFlash.go {
        animation: bustFx 0.8s ease-out;
      }
      @keyframes bustFx {
        0% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }
      #toast.bust {
        background: linear-gradient(180deg, #4a1a6e, #1d0b33);
        border-color: #ff3b5c;
        text-shadow: 0 2px 0 rgba(0, 0, 0, 0.6);
        box-shadow:
          0 4px 0 rgba(0, 0, 0, 0.5),
          0 0 26px rgba(255, 59, 92, 0.8);
      }
      body[data-tier="1"] #controls {
        background: linear-gradient(180deg, #3a1f9a, #22106a);
      }
      body[data-tier="2"] #controls {
        background: linear-gradient(180deg, #6a1230, #36081a);
      }
      body[data-tier="3"] #controls {
        background: linear-gradient(180deg, #4a0a1c, #1a040b);
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="bal"><i class="coin"></i><span id="balEl">1,000</span></div>
    <div id="bigWinFx"><span class="bwtext" id="bigWinText"></span></div>

    <span id="feedFlash"></span>
    <button id="muteBtn" aria-label="Toggle sound"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#fff" stroke="none"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></button>
    <div id="bustFlash"></div>
    <div id="toast"></div>
    <div id="streakBadge"></div>
    <div id="boostBadge"></div>
    <div id="challengeBanner">
      <div class="ctitle" id="challengeTitle">
        ⚡ Drop 100 balls in 30s for 2x Boost!
      </div>
      <div class="cbarTrack">
        <div class="cbarFill" id="challengeFill"></div>
      </div>
      <div class="cmeta">
        <span id="challengeCount">0 / 100</span
        ><span id="challengeTime">30s</span>
      </div>
    </div>

    <div id="controls">
      <div id="frenzy"><div id="frenzyFill"></div><span id="frenzyTxt">FRENZY 0%</span></div>
      <div class="bet-row">
        <button class="bet-btn" id="betMinus">−</button>
        <div class="bet-display"><span id="betEl">10</span><i class="coinI"></i></div>
        <button class="bet-btn" id="betPlus">+</button>
      </div>
      <div id="ballRow">
        <button class="bv on" data-v="1">x1</button>
        <button class="bv" data-v="2">x2</button>
        <button class="bv" data-v="5">x5</button>
        <button class="bv" data-v="9">x9</button>
      </div>
      <button id="spinBtn">DROP</button>
    </div>

    <div id="overlay">
      <div class="ocard">
        <div class="otitle">Ball Drop</div>
        <div class="osub">
          Drop balls through the pegs.<br />Land on a multiplier to win
          coins.<br /><br />Heavier balls (x2, x5, x9) cost and pay more.<br />Play coins are just for fun.
        </div>
        <button class="oplay" id="playBtn">PLAY</button>
      </div>
    </div>

    <div id="buyOverlay" style="display: none">
      <div class="bcard">
        <div class="btitle">💎 Buy Gems</div>
        <div class="brate">1 Mana = 10 Gems</div>
        <div class="bmana">
          Your Mana: <strong id="manaDisplayEl">…</strong>
        </div>
        <div class="bpacks" id="packsEl"></div>
        <button class="bbuy" id="confirmBuyBtn" disabled>Select a pack</button>
        <button class="bcancel" id="cancelBuyBtn">Cancel</button>
        <div class="berr" id="buyErrEl"></div>
      </div>
    </div>

    <script>
      (function () {
        "use strict";

        var cv = document.getElementById("c");
        var cx = cv.getContext("2d");
        var W = 0,
          H = 0,
          DPR = 1;

        var betEl = document.getElementById("betEl");
        var spinBtn = document.getElementById("spinBtn");
        var overlay = document.getElementById("overlay");
        var playBtn = document.getElementById("playBtn");
        var buyOverlay = document.getElementById("buyOverlay");
        var manaDisplayEl = document.getElementById("manaDisplayEl");

              for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
              var p = c.decodeAudioData(u8.buffer, function (b) {
                plinkBuf = b;
              });
              if (p && p.catch) p.catch(function () {});
            } catch (e) {}
          }
          // Play the real plinko sample. rate = pitch, gain = loudness,
          // soft = 0..1 darkens the sound (used for background balls).
          function sample(rate, gain, soft, delay) {
            if (muted || !plinkBuf) return false;
            var c = ensure();
            if (!c) return false;
            var src = c.createBufferSource();
            src.buffer = plinkBuf;
            src.playbackRate.value = rate;
            var g = c.createGain();
            g.gain.value = gain;
            var node = src;
            if (soft > 0) {
              var f = c.createBiquadFilter();
              f.type = "lowpass";
              f.frequency.value = 6500 - soft * 4200;
              src.connect(f);
              node = f;
            }
            node.connect(g);
            g.connect(dest(c));
            src.start(c.currentTime + (delay || 0));
            return true;
          }
          var PENTA = [
            523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.51,
            1567.98,
          ];

          return {
            unlock: unlock,
            setMuted: function (m) {
              muted = m;
            },
            isMuted: function () {
              return muted;
            },
            drop: function () {
              // cheerful "bloop" launch over a low whoomp
              tone(120, 0.16, { type: "sine", vol: 0.12, slideTo: 60 });
              tone(300, 0.11, { type: "sine", vol: 0.14, slideTo: 760 });
              tone(900, 0.05, { type: "triangle", vol: 0.05, delay: 0.06 });
            },
            peg: function (strength, frac, v) {
              // v = per-ball voice: { gain, det, soft }. The lead ball is full
              // and bright; extra balls are quieter, slightly darker and
              // detuned so a crowd of balls sounds like a texture, not spam.
              v = v || { gain: 1, det: 0, soft: 0 };
              var rate = 0.93 + (frac || 0) * 0.16 + v.det + (Math.random() - 0.5) * 0.06;
              var gain = Math.min(1, 0.4 + strength * 0.7) * v.gain;
              if (!sample(rate, gain, v.soft)) {
                var i = Math.round((frac || 0) * (PENTA.length - 3) + Math.random() * 2);
                i = Math.max(0, Math.min(PENTA.length - 1, i));
                plink(PENTA[i], Math.min(0.2, 0.09 + strength * 0.11) * v.gain, 0.16);
              }
            },
            fallStart: function () {},
            fallStop: function () {},
            land: function (mult) {
              // soft thud as the ball drops into the slot
              if (!sample(0.55, 0.9, 0.3)) tone(170, 0.13, { type: "sine", vol: 0.17, slideTo: 70 });
              tone(150, 0.12, { type: "sine", vol: 0.12, slideTo: 60 });
            },
            win: function (level) {
              // ka-ching, a step higher for every win in a streak
              var k = Math.pow(1.0595, Math.min(12, Math.max(0, (level || 1) - 1)));
              plink(1318.5 * k, 0.16, 0.2);
              plink(1760 * k, 0.16, 0.3, 0.075);
              if ((level || 1) >= 4) plink(2349 * k, 0.12, 0.3, 0.15);
              noise(0.25, { vol: 0.05, freq: 7000, q: 0.7, filter: "highpass", delay: 0.07 });
            },
            bigWin: function () {
              // fanfare: rising arpeggio, sparkle, and a low boom
              tone(130, 0.35, { type: "sine", vol: 0.2, slideTo: 55 });
              var arp = [523.25, 659.25, 783.99, 1046.5, 1318.5, 1567.98];
              arp.forEach(function (f, i) {
                plink(f, 0.17, 0.28, 0.06 + i * 0.075);
              });
              plink(2093, 0.14, 0.6, 0.06 + arp.length * 0.075);
              noise(0.7, { vol: 0.07, freq: 6500, q: 0.6, filter: "highpass", delay: 0.2 });
            },
            heart: function () {
              tone(62, 0.11, { type: "sine", vol: 0.2, slideTo: 48 });
              tone(58, 0.13, { type: "sine", vol: 0.16, slideTo: 44, delay: 0.17 });
            },
            bust: function () {
              tone(260, 0.7, { type: "sawtooth", vol: 0.09, slideTo: 38 });
              tone(90, 0.8, { type: "sine", vol: 0.24, slideTo: 32 });
              noise(0.5, { vol: 0.12, freq: 260, q: 0.7 });
              tone(196, 0.5, { type: "square", vol: 0.04, slideTo: 130, delay: 0.1 });
            },
            tierUp: function () {
              // ominous rising minor chord + boom
              [220, 261.6, 329.6, 440].forEach(function (f, i) {
                tone(f, 0.9, { type: "sawtooth", vol: 0.05, slideTo: f * 1.5, delay: i * 0.08 });
              });
              tone(80, 0.7, { type: "sine", vol: 0.24, slideTo: 40, delay: 0.3 });
              noise(0.8, { vol: 0.06, freq: 1800, q: 0.6, delay: 0.1 });
            },
            push: function () {
              plink(660, 0.1, 0.18);
              plink(660, 0.07, 0.18, 0.09);
            },
            ooh: function () {
              tone(520, 0.32, { type: "sine", vol: 0.08, slideTo: 330 });
              tone(780, 0.3, { type: "sine", vol: 0.04, slideTo: 495, delay: 0.02 });
            },
            goldPeg: function () {
              // quick harp glissando
              [784, 988, 1175, 1568, 1976, 2349].forEach(function (f, i) {
                plink(f, 0.12, 0.3, i * 0.045);
              });
            },
            golden: function () {
              // shimmering "magic" rise
              [523, 659, 784, 988, 1175, 1568, 1976].forEach(function (f, i) {
                plink(f, 0.1, 0.4, i * 0.07);

              noise(0.8, { vol: 0.04, freq: 7500, q: 0.6, filter: "highpass" });
            },
            frenzyReady: function () {

            },
            frenzy: function () {

              for (var i = 0; i < 14; i++)
                noise(0.07, { vol: 0.09 + i * 0.006, freq: 320 + i * 25, q: 1.2, delay: i * 0.045 });
              tone(90, 0.5, { type: "sine", vol: 0.22, slideTo: 45, delay: 0.62 });
              noise(0.9, { vol: 0.09, freq: 6000, q: 0.5, filter: "highpass", delay: 0.62 });
              [523, 659, 784, 1047].forEach(function (f, i) {
                plink(f, 0.15, 0.35, 0.64 + i * 0.06);
              });
            },
            lose: function () {
              // gentle "aww" rather than a buzz
              tone(330, 0.2, { type: "sine", vol: 0.1, slideTo: 200 });
              tone(247, 0.26, { type: "sine", vol: 0.08, slideTo: 150, delay: 0.12 });
            },
            click: function () {

            },

        })();

        // ─── Multipliers ──────────────────────────────────────────────────
        // 16 rows → binomial distribution strongly peaks at center.
        // Measured with a headless copy of this exact physics (40k drops, 12 rows,
        // 11 slots): landing odds are about  edge 0.09%, 0.74%, 3.4%, 11.5%,
        // 21.9%, centre 24.9%. The standard table returns ~86% per gem staked. Golden pegs (+~2.5%), golden balls (+~2.2%) and the Frenzy
        // free balls (+~3%) bring the all-in return to roughly 95%, so the house
        // keeps ~5% and about two thirds of drops lose. No steering, no hidden
        // boosts: what you see is what the physics does.
        var MULTS = [10, 10, 6, 2, -0.25, -0.25, -0.25, 2, 6, 10, 10];
        // Risk tables. The more gems you hold, the harsher the table: more negative
        // boxes (a "-1x" box takes your stake plus one more stake) and a lower
        // average return (88 -> 85 -> 72 -> 64 per 100 staked). Every multiplier
        // is on screen and pays exactly what it says; the table only changes
        // between drops, never under a falling ball.
        var MULT_TABLES = [
          MULTS,
          [10, 10, 5, 4, -0.5, -1.5, -0.5, 4, 5, 10, 10],
          [10, 10, 5, 3, -0.5, -1, -0.5, 3, 5, 10, 10],
          [10, 10, 10, -0.5, -0.1, -0.25, -0.1, -0.5, 10, 10, 10],
        ];
        // Top prize is 10x on every table. Base return per 100 gems staked,
        // from the measured landing odds: 86, 83, 72, 63. Negative boxes grow
        // from 3 (of 11) to 5, and 91% of drops land in one on the top table.
        var TIER_NAMES = [
          "STANDARD TABLE",
          "HIGH ROLLER TABLE",
          "WHALE TABLE",
          "ALL OR NOTHING",
        ];

        var TIER_UP_AT = [0, 1500, 3000, 6000];
        var tier = 0;
        var tierWait = false;
        var SLOT_COUNT = MULTS.length;
        var ROWS = 12;

        function colorForMult(m) {
          if (m < 0) return "#2a1747";
          if (m >= 10) return "#ff3b6b";
          if (m >= 5) return "#ff6a2b";
          if (m >= 2) return "#ffa31a";
          if (m >= 1) return "#3ddc84";
          if (m > 0) return "#2fc7ff";
          return "#6b7aa8";
        }
        function slotBg(i) {
          var mid = Math.floor(SLOT_COUNT / 2);
          var d = Math.abs(i - mid);
          if (d >= 5) return "#ff3b6b";
          if (d >= 4) return "#ff6a2b";
          if (d >= 3) return "#ffa31a";
          if (d >= 2) return "#a35cff";
          if (d >= 1) return "#2fc7ff";
          return "#3ddc84";
        }

        var BALL_COLS = ["#ff3b5c", "#ffa31a", "#3ddc6a", "#b05cff", "#ffd21a", "#2fd0ff", "#ff6ad5"];
        var ballSeq = 0;
        var board = {
          left: 0,
          right: 0,
          launchY: 0,
          top: 0,
          bottom: 0,
          pegR: 0,
          slotGap: 0,
          spacing: 0,
        };
        var pegs = [];
        var slots = [];

        function measure() {
          var el = document.getElementById("controls");
          ctrlH = el ? el.offsetHeight : 110;
        }

        function layout() {
          measure();
          var pad = Math.max(14, W * 0.05);
          var usableW = W - pad * 2;
          board.spacing = usableW / ROWS;
          var pyramidBaseW = ROWS * board.spacing;
          board.left = (W - pyramidBaseW) / 2;
          board.right = board.left + pyramidBaseW;
          var slotH = Math.max(32, Math.min(42, H * 0.052));
          // Leave a small visible launch lane below the native top pills.
          board.launchY = Math.max(96, Math.min(108, H * 0.105));
          var launchLaneH = Math.max(28, Math.min(34, H * 0.032));
          board.top = board.launchY + launchLaneH;
          board.slotGap = Math.max(30, Math.min(44, H * 0.045));
          board.bottom = H - ctrlH - slotH - 24 - board.slotGap;
          board.pegR = Math.max(3.5, Math.min(6.5, board.spacing * 0.13));

          pegs = [];
          var rowGap = (board.bottom - board.top) / (ROWS - 1);
          for (var r = 0; r < ROWS; r++) {
            var count = r + 2;
            var span = (count - 1) * board.spacing;
            var sx = W / 2 - span / 2;
            var y = board.top + r * rowGap;
            for (var c = 0; c < count; c++) {
              pegs.push({
                x: sx + c * board.spacing,
                y: y,
                r: board.pegR,
                squeeze: 0,
                sqVel: 0,
                flash: 0,
                row: r,
              });
            }
          }

          slots = [];
          var sw = (board.right - board.left) / SLOT_COUNT;
          for (var i = 0; i < SLOT_COUNT; i++) {
            slots.push({
              x: board.left + i * sw,
              y: board.bottom + 8 + board.slotGap,
              w: sw,
              h: slotH,
              mult: MULT_TABLES[tier][i],
              color: colorForMult(MULT_TABLES[tier][i]),
              flash: 0,
              by: 0,
              bv: 0,
            });
          }
          pickGoldenPeg();
        }

        function resize() {
          DPR = Math.min(window.devicePixelRatio || 1, 2);
          W = window.innerWidth;
          H = window.innerHeight;
          cv.width = Math.round(W * DPR);
          cv.height = Math.round(H * DPR);
          cv.style.width = W + "px";
          cv.style.height = H + "px";
          cx.setTransform(DPR, 0, 0, DPR, 0, 0);
          layout();
        }

        // ─── Physics ──────────────────────────────────────────────────────
        var balls = [];
        var sparks = [];
        var floaters = [];
        var BALL_R_RATIO = 0.27,
          GRAVITY = 0.45,
          SUBSTEPS = 6,
          RESTITUTION = 0.38,
          FRICTION = 0.88;
        var PEG_SPRING_K = 0.18,
          PEG_SPRING_DAMP = 0.62;

        // ─── Screen shake & celebration FX ─────────────────────────────────
        var shakeMag = 0;
        function addShake(mag) {
          shakeMag = Math.min(18, shakeMag + mag);
        }

        function spawnConfetti(n) {
          var colors = [
            "#ffd84d",
            "#ff6b6b",
            "#4ade80",
            "#60a5fa",
            "#f472b6",
            "#fff",
          ];
          for (var i = 0; i < n; i++) {
            (function () {
              var el = document.createElement("div");
              el.className = "confetti";
              var x = Math.random() * W;
              var hue = colors[Math.floor(Math.random() * colors.length)];
              el.style.left = x + "px";
              el.style.background = hue;
              el.style.transform =
                "rotate(" + Math.floor(Math.random() * 360) + "deg)";
              document.body.appendChild(el);
              var dur = 900 + Math.random() * 700;
              var drift = (Math.random() - 0.5) * 120;
              var rot = (Math.random() - 0.5) * 720;
              var anim = el.animate(
                [
                  {
                    transform: el.style.transform + " translate(0,0)",
                    opacity: 1,

                  {
                    transform:
                      "translate(" +
                      drift +
                      "px," +
                      (H + 40) +

                      rot +
                      "deg)",
                    opacity: 0.9,
                  },

                { duration: dur, easing: "cubic-bezier(.3,.6,.7,1)" },

                el.remove();
              };
            })();
          }
        }

        var bigWinTimer = null;
        function showBigWin(mult, profit) {
          bigWinText.textContent = "x" + mult + "  +" + Math.round(profit);
          bigWinFx.classList.add("show");
          spawnConfetti(mult >= 10 ? 60 : 28);
          clearTimeout(bigWinTimer);
          bigWinTimer = setTimeout(function () {
            bigWinFx.classList.remove("show");
          }, 1100);
        }

        // Early-drop hook: only ~1 in 4 sessions are "blessed" with a shot at an
        // early big win at all (rolled once per game in startGame). In a blessed
        // session, each of the first EARLY_DROP_WINDOW drops still only has a
        // chance to get a gentle steer toward an edge (16x) slot, so it still feels
        // like normal luck rather than a guaranteed early payout. Keeps the board
        // feeling physical (still bounces off every peg) while making an early big
        // win meaningfully more likely than the ~0.05%/slot natural odds, without
        // it being a sure thing.
        var EARLY_DROP_WINDOW = 8;
        var SESSION_BLESSED_CHANCE = 0;
        var EARLY_DROP_BIAS_CHANCE = 0.25;
        var EDGE_BIAS_STRENGTH = 0.035;
        var sessionBlessed = false;

        // ─── Payout boost (milestones + challenge reward) ───────────────────
        function isBoostActive() {
          return Date.now() < boostUntil;
        }
        function activateBoost(ms) {
          boostUntil = Math.max(boostUntil, Date.now() + ms);
          updateBoostBadge();
        }
        function updateBoostBadge() {
          var remain = boostUntil - Date.now();
          if (remain <= 0) {
            boostBadge.classList.remove("show");
            return;
          }
          boostBadge.textContent =
            "⚡ " + BOOST_MULT + "x BOOST · " + Math.ceil(remain / 1000) + "s";
          boostBadge.classList.add("show");

        function checkMilestone() {
          var step = Math.floor(drops / MILESTONE_INTERVAL);
          if (step > 0 && step !== lastMilestone) {
            lastMilestone = step;
            activateBoost(MILESTONE_BOOST_MS);
            SFX.bigWin();
            haptic("success");
            addFeed("⚡ MILESTONE BOOST!", true);
          }
        }

        // ─── Mini challenge: drop CHALLENGE_TARGET balls within CHALLENGE_WINDOW_MS ──
        // Offered at 150, 500, 1500 drops, then every CHALLENGE_REPEAT_INTERVAL after.
        function maybeOfferChallenge() {
          if (challengeActive) return;
          if (drops >= nextChallengeAt) {
            nextChallengeIdx++;
            nextChallengeAt =
              nextChallengeIdx < CHALLENGE_OFFER_SCHEDULE.length
                ? CHALLENGE_OFFER_SCHEDULE[nextChallengeIdx]
                : nextChallengeAt + CHALLENGE_REPEAT_INTERVAL;

        function startChallenge() {

          challengeStartMs = Date.now();

          haptic("selection");

        function tickChallenge() {
          clearTimeout(challengeTimer);
          if (!challengeActive) return;

          var done = drops - challengeStartDrops;

            Math.min(100, (done / CHALLENGE_TARGET) * 100) + "%";
          challengeCount.textContent =
            Math.min(done, CHALLENGE_TARGET) + " / " + CHALLENGE_TARGET;
          challengeTime.textContent = Math.ceil(remain / 1000) + "s";
          if (done >= CHALLENGE_TARGET) {
            finishChallenge(true);
            return;
          }
          if (remain <= 0) {
            finishChallenge(false);
            return;
          }
          challengeTimer = setTimeout(tickChallenge, 150);
        }
        function finishChallenge(success) {
          challengeActive = false;
          clearTimeout(challengeTimer);
          if (success) {
            challengeBanner.classList.add("success");
            activateBoost(CHALLENGE_REWARD_MS);
            SFX.bigWin();
            haptic("success");
            addFeed("🏆 CHALLENGE WON!", true);
          } else {
            challengeBanner.classList.add("fail");
          }
          setTimeout(function () {
            challengeBanner.classList.remove("show");
          }, 1400);
        }

        // ─── Fun layer: golden peg, golden ball, hot streak, frenzy ──────────
        var GOLDEN_EVERY = 40; // every 40th paid drop is a golden ball (pays x2)
        var GOLDEN_PEG_BONUS = 0.12; // of stake, for touching the glowing peg
        var FRENZY_DROPS = 150; // paid drops to fill the meter
        var FRENZY_BALLS = 5; // free balls per frenzy
        var frenzyMeter = 0;
        var goldenPeg;
        function pickGoldenPeg() {
          var cand = [];
          for (var i = 0; i < pegs.length; i++)
            if (pegs[i].row >= 3 && pegs[i].row <= 8) cand.push(pegs[i]);
          var prev = goldenPeg;
          do {
            goldenPeg = cand.length ? cand[Math.floor(Math.random() * cand.length)] : null;
          } while (cand.length > 1 && goldenPeg === prev);
        }
        var bustEl = document.getElementById("bustFlash");

        var toastEl = document.getElementById("toast");

          toastTimer = setTimeout(function () {
            toastEl.className = "";
          }, 1500);
        }
        var frenzyEl = document.getElementById("frenzy");
        var frenzyFill = document.getElementById("frenzyFill");
        var frenzyTxt = document.getElementById("frenzyTxt");
        function updateFrenzyUI() {
          var f = Math.min(1, frenzyMeter / FRENZY_DROPS);
          frenzyFill.style.width = f * 100 + "%";
          var ready = f >= 1;
          frenzyEl.classList.toggle("ready", ready);
          frenzyTxt.textContent = ready
            ? "🔥 TAP FOR FRENZY: " + FRENZY_BALLS + " FREE BALLS x " + frenzyStake() + " 💎"
            : "FRENZY " + Math.floor(f * 100) + "%";
        }
        function startFrenzy() {
          if (!running || ended || frenzyMeter < FRENZY_DROPS) return;
          var stake = frenzyStake();
          frenzyMeter = 0;
          frenzyBetSum = 0;
          frenzyBetCnt = 0;
          updateFrenzyUI();
          toast("🔥 FRENZY! " + FRENZY_BALLS + " FREE BALLS x " + stake + " 💎", "fire");
          SFX.frenzy();
          haptic("success");
          addShake(6);
          for (var i = 0; i < FRENZY_BALLS; i++)
            (function (k) {

              }, 160 + k * 150);
            })(i);
        }
        frenzyEl.addEventListener("click", startFrenzy);

        function tierTarget() {
          var t = tier;
          while (t < MULT_TABLES.length - 1 && bank >= TIER_UP_AT[t + 1]) t++;
          while (t > 0 && bank < TIER_UP_AT[t] * 0.7) t--;
          return t;
        }
        function applyTier(t) {
          var up = t > tier;
          tier = t;
          tierWait = false;
          document.body.setAttribute("data-tier", String(t));
          for (var i = 0; i < slots.length; i++) {
            slots[i].mult = MULT_TABLES[t][i];
            slots[i].color = colorForMult(MULT_TABLES[t][i]);
            slots[i].flash = 1;
            slots[i].bv += 5 + Math.abs(i - 5) * 0.6;
          }
          if (up) {
            toast("🔥 " + TIER_NAMES[t] + ": BIG WINS, BIG BUSTS", "fire");
            SFX.tierUp();
            haptic("heavy");
            addShake(8);
          } else {
            toast("TABLE COOLED: " + TIER_NAMES[t], "gold");
            SFX.frenzyReady();
          }
        }
        // true = a table change is blocking this drop
        function syncTier() {
          var t = tierTarget();
          if (t === tier) return false;

          }
          if (!tierWait) {

        var frenzyBetSum = 0,
          frenzyBetCnt = 0;
        // Free frenzy balls stake your AVERAGE bet from the drops that filled the

        function frenzyStake() {
          var avg = frenzyBetCnt ? frenzyBetSum / frenzyBetCnt : bet;
          return Math.max(5, Math.floor(avg / 5) * 5);
        }

        function spawnBall(o) {
          var spread = o.spread || 0.4;
          var bx = W / 2 + (Math.random() - 0.5) * board.spacing * spread;
          var br = Math.max(6, Math.min(12, board.spacing * BALL_R_RATIO));
          var bvv = o.v || 1;
          balls.push({
            v: bvv,
            vr: br * BV_SIZE[bvv],
            x: bx,
            y: board.launchY,
            vx: (Math.random() - 0.5) * 0.4,
            vy: 0,
            r: br,
            stake: o.stake,
            free: !!o.free,
            golden: !!o.golden,
            settled: false,
            bias: 0,
            boosted: false,
            bonus: 0,
            col: BV_COL[bvv] || BALL_COLS[ballSeq++ % BALL_COLS.length],
            voice: {
              gain: 0.28 + Math.random() * 0.3,
              det: (Math.random() - 0.5) * 0.16,
              soft: 0.35 + Math.random() * 0.45,
            },
          });
          SFX.drop();
          SFX.fallStart();
        }

        var DROP_COOLDOWN_MS = 180;
        var lastDropMs = 0;
        function dropBall() {
          if (!running || ended || bank < cost()) return;
          var now = Date.now();
          if (now - lastDropMs < DROP_COOLDOWN_MS) return;
          if (syncTier()) return;
          lastDropMs = now;
          var stakeNow = cost();
          bank -= stakeNow;
          drops++;
          frenzyBetSum += stakeNow;
          frenzyBetCnt++;
          updateHud();
          var golden = drops % GOLDEN_EVERY === 0;
          spawnBall({ stake: stakeNow, golden: golden, v: ballV });
          fixBet();
          if (golden) {
            toast("⭐ GOLDEN BALL: PAYS x2 (UP TO 10x)", "gold");
            SFX.golden();
            haptic("success");
          } else haptic("light");
          if (frenzyMeter < FRENZY_DROPS) {
            frenzyMeter++;
            updateFrenzyUI();
            if (frenzyMeter >= FRENZY_DROPS) {
              SFX.frenzyReady();
              haptic("success");
            }
          }
          spinBtn.disabled = true;
          setTimeout(function () {
            if (running && !ended && bank >= cost()) spinBtn.disabled = false;
          }, DROP_COOLDOWN_MS);
        }

        // Collisions can fire many times per rendered frame (SUBSTEPS); collapse
        // them into at most one sound+haptic per frame so audio doesn't clip/spam.
        var pendingHits = [];
        function queuePegHit(strength, y, ball) {
          pendingHits.push({
            s: strength,
            f: (y - board.top) / Math.max(1, board.bottom - board.top),
            b: ball,
          });
        }
        var LEAD_VOICE = { gain: 1, det: 0, soft: 0 };
        function flushPegHit() {
          if (!pendingHits.length) return;
          var active = 0,
            lead = null;
          for (var i = 0; i < balls.length; i++)
            if (!balls[i].settled) {
              active++;
              if (!lead) lead = balls[i];
            }
          var crowd = Math.min(1, 1.6 / Math.sqrt(Math.max(1, active)));
          var played = 0;
          // lead ball first, then the loudest others, at most 3 sounds a frame
          pendingHits.sort(function (a, b) {
            return (b.b === lead) - (a.b === lead) || b.s - a.s;
          });
          for (var k = 0; k < pendingHits.length && played < 3; k++) {
            var h = pendingHits[k],
              isLead = h.b === lead;
            if (!isLead) {
              // background balls only chime some of the time, and quietly
              if (Math.random() > 0.55 || h.s < 0.12) continue;
            }
            var v = isLead
              ? LEAD_VOICE
              : {
                  gain: ((h.b && h.b.voice && h.b.voice.gain) || 0.4) * crowd,
                  det: (h.b && h.b.voice && h.b.voice.det) || 0,
                  soft: (h.b && h.b.voice && h.b.voice.soft) || 0.5,
                };
            SFX.peg(h.s, h.f, v);
            if (isLead && h.s > 0.55 && played === 0) haptic("selection");
            played++;
          }
          pendingHits.length = 0;
        }

        function stepPhysics(dtFull) {
          var dt = dtFull / SUBSTEPS;
          for (var s = 0; s < SUBSTEPS; s++) {
            for (var i = balls.length - 1; i >= 0; i--) {
              var b = balls[i];
              if (b.settled) continue;
              b.vy += GRAVITY * dt;
              b.vx *= Math.pow(FRICTION, dt);
              if (b.bias) b.vx += b.bias * EDGE_BIAS_STRENGTH * dt;
              b.x += b.vx * dt;
              b.y += b.vy * dt;
              var wallL = board.left - board.pegR * 2,
                wallR = board.right + board.pegR * 2;
              if (b.x - b.r < wallL) {
                b.x = wallL + b.r;
                b.vx = Math.abs(b.vx) * RESTITUTION;
              }
              if (b.x + b.r > wallR) {
                b.x = wallR - b.r;
                b.vx = -Math.abs(b.vx) * RESTITUTION;
              }
              for (var p = 0; p < pegs.length; p++) {
                var pg = pegs[p];
                var dx = b.x - pg.x,
                  dy = b.y - pg.y;
                var minD = b.r + pg.r * (1 + pg.squeeze * 0.5);
                var d2 = dx * dx + dy * dy;
                if (d2 < minD * minD && d2 > 0.0001) {
                  var d = Math.sqrt(d2),
                    nx = dx / d,
                    ny = dy / d;
                  var overlap = minD - d;
                  b.x += nx * overlap;
                  b.y += ny * overlap;
                  var dot = b.vx * nx + b.vy * ny;
                  if (dot < 0) {
                    var imp = -(1 + RESTITUTION) * dot;
                    b.vx += imp * nx;
                    b.vy += imp * ny;
                    b.vx += (Math.random() - 0.5) * 1.1;
                    var hs = Math.min(1, Math.abs(dot) * 0.15);
                    pg.squeeze = Math.max(pg.squeeze, hs * 0.9);
                    pg.flash = 1;
                    spawnSparks(pg.x, pg.y, nx, ny, hs);
                    queuePegHit(hs, pg.y, b);
                    if (pg === goldenPeg) goldenHit(b, pg);
                  }
                }
              }
              if (b.y > board.bottom + board.slotGap + 10) settle(b, i);
            }
          }
          for (var p = 0; p < pegs.length; p++) {
            var pg = pegs[p];
            if (pg.squeeze > 0.001 || Math.abs(pg.sqVel) > 0.001) {
              pg.sqVel += -PEG_SPRING_K * pg.squeeze;
              pg.sqVel *= PEG_SPRING_DAMP;
              pg.squeeze += pg.sqVel;
              if (pg.squeeze < 0) pg.squeeze = 0;
            }
            pg.flash = Math.max(0, pg.flash - 0.12);
          }
          for (var k = sparks.length - 1; k >= 0; k--) {
            var sp = sparks[k];
            sp.x += sp.vx;
            sp.y += sp.vy;
            sp.vy += 0.18;
            sp.life--;
            if (sp.life <= 0) sparks.splice(k, 1);
          }
          for (var f = floaters.length - 1; f >= 0; f--) {
            var fl = floaters[f];
            fl.y += fl.vy;
            fl.vy *= 0.94;
            fl.life--;
            if (fl.life <= 0) floaters.splice(f, 1);
          }
        }

        function spawnSparks(x, y, nx, ny, strength) {
          var count = Math.round(4 + strength * 8);
          for (var i = 0; i < count; i++) {
            var angle =
              Math.atan2(ny, nx) + Math.PI + (Math.random() - 0.5) * 1.4;
            var speed = (1 + Math.random() * 3) * strength * 2.5;
            sparks.push({
              x: x,
              y: y,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed,
              life: Math.round(8 + Math.random() * 10),
              maxLife: 18,
              col: Math.random() > 0.5 ? "#fff" : "#fde68a",
            });
          }
        }

        function goldenHit(b, pg) {
          var bonus = Math.max(1, Math.round(b.stake * GOLDEN_PEG_BONUS));
          bank += bonus;
          totalProfit += bonus;
          b.bonus += bonus;
          floaters.push({
            x: pg.x,
            y: pg.y - 10,
            vy: -1.6,
            life: 60,
            text: "+" + bonus + " ★",
            good: true,
            gold: true,
          });
          for (var i = 0; i < 14; i++) {
            var a = (i / 14) * Math.PI * 2;
            sparks.push({
              x: pg.x,
              y: pg.y,
              vx: Math.cos(a) * (1.2 + Math.random() * 1.6),
              vy: Math.sin(a) * (1.2 + Math.random() * 1.6),
              life: 28,
              maxLife: 28,
              col: i % 2 ? "#ffd84d" : "#fff6a8",
            });
          }
          SFX.goldPeg();
          haptic("medium");
          updateHud();
          pickGoldenPeg();
        }

        function settle(ball, idx) {
          ball.settled = true;
          var sw = (board.right - board.left) / SLOT_COUNT;
          var si = Math.max(
            0,
            Math.min(SLOT_COUNT - 1, Math.floor((ball.x - board.left) / sw)),
          );
          var slot = slots[si];
          var basePayout = ball.stake * slot.mult;
          var payout =
            ball.golden && basePayout > 0
              ? Math.min(basePayout * 2, ball.stake * 10)
              : basePayout;
          var cost = ball.free ? 0 : ball.stake;
          var effMult = ball.stake ? payout / ball.stake : slot.mult;
          // a negative box can't take more than the player has
          if (bank + payout < 0) payout = -bank;
          var profit = payout - cost;
          bank += payout;
          totalProfit += profit;
          if (!ball.free) {
            if (payout >= cost) {
              wins++;
              combo = Math.min(30, combo + 1);
              maxCombo = Math.max(maxCombo, combo);
              if (combo >= 3) showStreak(combo);
            } else {
              combo = 1;
              hideStreak();
            }
          }
          score = Math.max(
            0,
            Math.min(99999, Math.floor(Math.max(0, totalProfit))),
          );
          slot.flash = 1;
          var kick = 3.2 + Math.max(0, Math.min(5, effMult * 0.3));
          slot.bv += kick;
          if (slots[si - 1]) slots[si - 1].bv += kick * 0.35;
          if (slots[si + 1]) slots[si + 1].bv += kick * 0.35;
          var shown = Math.round(ball.free ? payout : profit);
          floaters.push({
            x: ball.x,
            y: board.bottom + board.slotGap - 10,
            vy: -2.2,
            life: 70,
            text: (shown >= 0 ? "+" : "") + shown + (ball.free ? " FREE" : ""),
            good: shown >= 0,
          });
          addFeed((shown >= 0 ? "+" : "") + shown, shown >= 0);

          SFX.land(effMult);
          var nearMiss = !ball.free && (si === 2 || si === SLOT_COUNT - 3);
          if (effMult >= 4) {
            SFX.bigWin();
            haptic("success");
            addShake(effMult >= 10 ? 18 : 9);
            showBigWin(effMult, profit);
          } else if (payout > cost) {
            SFX.win(combo);
            haptic("medium");
            addShake(3);
          } else if (payout === cost) {
            SFX.push();
            haptic("light");
          } else if (payout < 0) {
            SFX.bust();
            haptic("warning");
            addShake(14);
            bustFlash();
            toast("💀 BUST " + Math.round(slot.mult * 100) / 100 + "x", "bust");
          } else {
            SFX.lose();
            haptic("light");
          }
          if (nearMiss && effMult < 10) {
            floaters.push({
              x: ball.x,
              y: board.bottom + board.slotGap - 34,
              vy: -1.4,
              life: 80,
              text: "SO CLOSE TO 10x!",
              good: true,
              gold: true,
            });
            SFX.ooh();
          }

          balls.splice(idx, 1);
          if (balls.length === 0) {
            SFX.fallStop();
            syncTier();
          }
          updateHud();
          post("stats");
          saveCoins();
          if (balls.length === 0) {
            if (bank < 5) endGame();
            else fixBet();
          }
        }

        // ─── Feed flash ───────────────────────────────────────────────────
        var feedFlashEl = document.getElementById("feedFlash");

        // ─── HUD ──────────────────────────────────────────────────────────

        // ─── WebView bridge ───────────────────────────────────────────────
        function postRN(obj) {
          try {
            if (window.ReactNativeWebView)
              window.ReactNativeWebView.postMessage(JSON.stringify(obj));
          } catch (e) {}
        }

        function post(type) {
          try {
            if (!window.ReactNativeWebView) return;
            var elapsed = running ? Date.now() - startMs : 0;
            if (type === "gameOver") {
              postRN({
                type: "gameOver",
                score: score,
                coins: Math.max(0, Math.floor(bank)),
                combo: maxCombo,
                duration_ms: elapsed,
              });
            } else {
              postRN({
                type: "stats",
                score: score,
                coins: Math.max(0, Math.floor(bank)),
                timer: 0,
                fuel: 100,
                targets: drops,
                kills: wins,
                health: 100,
              });
            }
          } catch (e) {}
        }

        window.addEventListener("message", function (e) {

            var data = JSON.parse(
              typeof e.data === "string" ? e.data : JSON.stringify(e.data),
            );
            if (data.type === "layout" && isFinite(data.top)) {
              document.documentElement.style.setProperty("--ptop", data.top + "px");
            }
          } catch (ex) {}
        });

        // ─── Game flow ─────────────────────────────────────────────────────
        function startGame() {

          drops = 0;

        // ─── Bet controls ─────────────────────────────────────────────────
        // Minimum bet scales with bankroll: roughly 10% of your coins, rounded
        // down to its leading digit (10,000 -> 1,000; 50,000 -> 5,000).
        function minBet() {
          if (bank < 100) return 5;
          var t = bank * 0.1;
          var p = Math.pow(10, Math.floor(Math.log10(t)));
          return Math.max(5, Math.floor(t / p) * p);
        }
        function cost() {
          return bet * ballV;
        }
        function betSteps() {
          var mb = minBet();
          var a = [mb];
          for (var p = 1; p <= 1e9; p *= 10) {
            var m = [1, 2.5, 5];
            for (var k = 0; k < 3; k++) {
              var v = p * m[k];
              if (v % 1 === 0 && v > a[a.length - 1] && v <= bank) a.push(v);
            }
          }
          return a;
        }
        var lastMin = 5;
        function syncBallRow() {
          var btns = document.querySelectorAll(".bv");
          for (var i = 0; i < btns.length; i++) {
            var v = +btns[i].getAttribute("data-v");
            btns[i].classList.toggle("on", v === ballV);
            btns[i].disabled = bet * v > bank;
          }
          betEl.textContent = fmt(bet);
          spinBtn.textContent = "DROP" + (ballV > 1 ? " x" + ballV : "") + "  \u00b7  " + fmt(cost());
        }
        // Keep bet legal: at least the scaled minimum, and affordable.
        function fixBet() {
          var mb = minBet();
          if (bet < mb) bet = mb;
          while (ballV > 1 && bet * ballV > bank) {
            ballV = BALL_VALUES[Math.max(0, BALL_VALUES.indexOf(ballV) - 1)];
          }
          if (bet > bank) bet = Math.max(5, Math.floor(bank));
          if (mb > lastMin && running) {
            toast("MINIMUM BET RAISED TO " + fmt(mb), "gold");
          }
          lastMin = mb;
          syncBallRow();
          spinBtn.disabled = !running || ended || bank < cost();
        }
        function stepBet(dir) {
          var st = betSteps();
          var i = 0;
          for (var k = 0; k < st.length; k++) if (st[k] <= bet) i = k;
          bet = st[Math.max(0, Math.min(st.length - 1, i + dir))];
          fixBet();
        }
        function setBet(v) {
          bet = Math.floor(v);
          fixBet();
        }
        document.getElementById("betMinus").addEventListener("click", function () {
          stepBet(-1);
          SFX.click();
          haptic("selection");
        });
        document.getElementById("betPlus").addEventListener("click", function () {
          stepBet(1);
          SFX.click();
          haptic("selection");
        });
        Array.prototype.forEach.call(document.querySelectorAll(".bv"), function (b) {
          b.addEventListener("click", function () {
            var v = +b.getAttribute("data-v");
            if (bet * v > bank) return;
            ballV = v;
            fixBet();
            SFX.click();
            haptic("selection");
          });
        });
        spinBtn.addEventListener("pointerdown", function () {
          spinBtn.classList.add("pressed");
        });
        spinBtn.addEventListener("pointerup", function () {
          setTimeout(function () {
            spinBtn.classList.remove("pressed");
          }, 80);
        });
        spinBtn.addEventListener("pointercancel", function () {
          spinBtn.classList.remove("pressed");
        });
        spinBtn.addEventListener("pointerleave", function () {
          spinBtn.classList.remove("pressed");
        });
        spinBtn.addEventListener("click", dropBall);

        // ─── Drawing ──────────────────────────────────────────────────────
        function drawBg() {
          var g = cx.createLinearGradient(0, 0, 0, H);
          var BGS = [
            ["#3b8bff", "#1f5fe6", "#1642c2"],
            ["#6a3de8", "#4524b8", "#25126e"],
            ["#9a1d3e", "#5e0f2c", "#26081a"],
            ["#7a0a22", "#3d0614", "#12030a"],
          ][tier];
          g.addColorStop(0, BGS[0]);
          g.addColorStop(0.55, BGS[1]);
          g.addColorStop(1, BGS[2]);
          cx.fillStyle = g;
          cx.fillRect(-24, -24, W + 48, H + 48);
          var rg = cx.createRadialGradient(W / 2, board.top + 40, 10, W / 2, board.top + 40, W * 0.9);
          rg.addColorStop(0, "rgba(255,255,255,0.22)");
          rg.addColorStop(1, "rgba(255,255,255,0)");
          cx.fillStyle = rg;
          cx.fillRect(-24, -24, W + 48, H + 48);
        }

        function drawPegs() {
          for (var i = 0; i < pegs.length; i++) {
            var p = pegs[i],
              r = p.r * (1 + p.squeeze * 2.5);
            if (p === goldenPeg) {
              var pulse = 0.5 + 0.5 * Math.sin(Date.now() / 170);
              cx.save();
              cx.shadowColor = "#ffd84d";
              cx.shadowBlur = 10 + pulse * 10;
              cx.beginPath();
              cx.arc(p.x, p.y, r * (1.5 + pulse * 0.25), 0, Math.PI * 2);
              cx.fillStyle = "#ffcf2e";
              cx.fill();
              cx.restore();
              cx.beginPath();
              cx.arc(p.x - r * 0.4, p.y - r * 0.45, r * 0.5, 0, Math.PI * 2);
              cx.fillStyle = "rgba(255,255,255,0.85)";
              cx.fill();
              continue;
            }
            cx.beginPath();
            cx.arc(p.x, p.y + 1.6, r, 0, Math.PI * 2);
            cx.fillStyle = "rgba(8,30,130,0.4)";
            cx.fill();
            cx.beginPath();
            cx.arc(p.x, p.y, r, 0, Math.PI * 2);
            cx.fillStyle = p.flash > 0.05 ? "#fff6a8" : "#ffffff";
            cx.fill();
            cx.beginPath();
            cx.arc(p.x - r * 0.3, p.y - r * 0.32, r * 0.32, 0, Math.PI * 2);
            cx.fillStyle = "rgba(120,170,255,0.55)";
            cx.fill();
          }
        }

        function nearestFallingSlotIndex() {
          var best = -1,
            bestY = -1;
          var sw = (board.right - board.left) / SLOT_COUNT;
          for (var i = 0; i < balls.length; i++) {
            var b = balls[i];
            if (b.settled) continue;
            if (b.y > bestY) {
              bestY = b.y;
              best = Math.max(
                0,
                Math.min(SLOT_COUNT - 1, Math.floor((b.x - board.left) / sw)),
              );
            }
          }
          return {
            idx: best,
            prox:
              bestY < 0
                ? 0
                : Math.max(
                    0,
                    Math.min(
                      1,
                      (bestY - board.top) / (board.bottom + board.slotGap - board.top),
                    ),
                  ),
          };
        }

        function drawSlots() {
          var gap = 3;
          cx.textAlign = "center";
          cx.textBaseline = "middle";
          var falling = nearestFallingSlotIndex();
          var boosted = isBoostActive();
          for (var i = 0; i < slots.length; i++) {
            var s = slots[i];
            s.bv += -0.22 * s.by;
            s.bv *= 0.86;
            s.by += s.bv;
            var x = s.x + gap,
              y = s.y + s.by,
              w = s.w - gap * 2,
              h = s.h,
              r = 9;
            if (s.flash > 0.01) s.flash = Math.max(0, s.flash - 0.07);
            var lit = i === falling.idx ? falling.prox : 0;
            if (lit > 0.01) {
              cx.save();
              cx.globalAlpha = lit * 0.55;
              cx.shadowColor = s.color;
              cx.shadowBlur = 14 * lit;
              cx.fillStyle = s.color;
              rrect(x - 2, y - 2, w + 4, h + 4, r + 2);
              cx.fill();
              cx.restore();
            }
            if (boosted) {
              cx.save();
              cx.globalAlpha = 0.5 + Math.sin(Date.now() / 180 + i) * 0.15;
              cx.shadowColor = "#a855f7";
              cx.shadowBlur = 10;
              cx.strokeStyle = "#c084fc";
              cx.lineWidth = 2;
              rrect(x - 1, y - 1, w + 2, h + 2, r + 1);
              cx.stroke();
              cx.restore();
            }
            // glossy candy block: dark base lip, bright face, shine
            var lip = 4;
            cx.fillStyle = shadeColor(s.color, -85);
            rrect(x, y + lip, w, h, r);
            cx.fill();
            var fg = cx.createLinearGradient(0, y, 0, y + h);
            fg.addColorStop(0, shadeColor(s.color, 55));
            fg.addColorStop(0.5, s.color);
            fg.addColorStop(1, shadeColor(s.color, -25));
            cx.fillStyle = fg;
            rrect(x, y, w, h, r);
            cx.fill();
            if (s.mult < 0) {
              cx.strokeStyle = "#ff3b5c";
              cx.lineWidth = 2.5;
              rrect(x + 1, y + 1, w - 2, h - 2, r);
              cx.stroke();
            }
            cx.save();
            cx.globalAlpha = 0.38;
            cx.fillStyle = "#fff";
            rrect(x + 3, y + 2.5, w - 6, h * 0.3, r - 3);
            cx.fill();
            cx.restore();
            if (s.flash > 0.05) {
              cx.save();
              cx.globalAlpha = s.flash * 0.55;
              cx.fillStyle = "#fff";
              rrect(x, y, w, h, r);
              cx.fill();
              cx.restore();
            }
            var fs = Math.max(10, Math.min(15, w * 0.38));
            cx.font = "900 " + fs + "px Inter,Arial";
            var label = boosted ? s.mult * BOOST_MULT + "x" : s.mult + "x";
            cx.lineJoin = "round";
            cx.lineWidth = 3;
            cx.strokeStyle = shadeColor(s.color, -95);
            cx.strokeText(label, s.x + s.w / 2, y + h * 0.52);
            cx.fillStyle = "#ffffff";
            cx.fillText(label, s.x + s.w / 2, y + h * 0.52);
          }
        }

        function shadeColor(hex, amt) {
          var n = parseInt(hex.slice(1), 16);
          var r = Math.max(0, Math.min(255, (n >> 16) + amt));
          var g = Math.max(0, Math.min(255, ((n >> 8) & 0xff) + amt));
          var b = Math.max(0, Math.min(255, (n & 0xff) + amt));
          return "#" + ((r << 16) | (g << 8) | b).toString(16).padStart(6, "0");
        }

        function drawBalls() {
          for (var i = 0; i < balls.length; i++) {
            var b = balls[i];
            if (b.settled) continue;
            if (b.boosted) {
              cx.save();
              cx.shadowColor = "#a855f7";
              cx.shadowBlur = 10;
              cx.beginPath();
              cx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
              cx.fillStyle = "#c084fc";
              cx.fill();
              cx.strokeStyle = "rgba(0,0,0,0.8)";
              cx.lineWidth = b.r * 0.18;
              cx.stroke();
              cx.restore();
            } else {
              var col = b.golden ? "#ffc61a" : b.col || "#ff3b5c";
              if (b.golden) {
                cx.save();
                cx.shadowColor = "#ffd84d";
                cx.shadowBlur = 18;
                cx.beginPath();
                cx.arc(b.x, b.y, b.r * 1.15, 0, Math.PI * 2);
                cx.fillStyle = "rgba(255,216,77,0.55)";
                cx.fill();
                cx.restore();
                if (Math.random() < 0.5)
                  sparks.push({
                    x: b.x + (Math.random() - 0.5) * b.r,
                    y: b.y + (Math.random() - 0.5) * b.r,
                    vx: (Math.random() - 0.5) * 0.8,
                    vy: -0.4 - Math.random() * 0.6,
                    life: 22,
                    maxLife: 22,
                    col: "#fff6a8",
                  });
              }
              var R = b.vr || b.r;
              cx.beginPath();
              cx.arc(b.x, b.y + R * 0.22, R, 0, Math.PI * 2);
              cx.fillStyle = "rgba(8,30,130,0.35)";
              cx.fill();
              var bg = cx.createRadialGradient(
                b.x - R * 0.35, b.y - R * 0.4, R * 0.1,
                b.x, b.y, R,
              );
              bg.addColorStop(0, shadeColor(col, 90));
              bg.addColorStop(0.45, col);
              bg.addColorStop(1, shadeColor(col, -55));
              cx.beginPath();
              cx.arc(b.x, b.y, R, 0, Math.PI * 2);
              cx.fillStyle = bg;
              cx.fill();
              cx.beginPath();
              cx.arc(b.x - R * 0.35, b.y - R * 0.4, R * 0.26, 0, Math.PI * 2);
              cx.fillStyle = "rgba(255,255,255,0.8)";
              cx.fill();
              if (b.v > 1 && !b.free) {
                cx.fillStyle = "#fff";
                cx.strokeStyle = "rgba(0,0,0,0.55)";
                cx.lineWidth = 2.5;
                cx.font = "900 " + Math.round(R * 1.05) + "px system-ui,sans-serif";
                cx.textAlign = "center";
                cx.textBaseline = "middle";
                cx.strokeText(b.v, b.x, b.y + R * 0.06);
                cx.fillText(b.v, b.x, b.y + R * 0.06);
              }
              if (b.free) {
                cx.beginPath();
                cx.arc(b.x, b.y, b.r + 1.5, 0, Math.PI * 2);
                cx.strokeStyle = "rgba(255,255,255,0.9)";
                cx.lineWidth = 2;
                cx.stroke();
              }
            }
          }
        }

        function drawSparks() {
          for (var i = 0; i < sparks.length; i++) {
            var sp = sparks[i],
              a = sp.life / sp.maxLife;
            cx.globalAlpha = a;
            cx.beginPath();
            cx.arc(sp.x, sp.y, 1.5 * a, 0, Math.PI * 2);
            cx.fillStyle = sp.col;
            cx.fill();
          }
          cx.globalAlpha = 1;
        }

        function drawFloaters() {
          cx.textAlign = "center";
          cx.textBaseline = "middle";
          for (var i = 0; i < floaters.length; i++) {
            var fl = floaters[i],
              a = Math.min(1, fl.life / 20);
            cx.globalAlpha = a;
            cx.font = "900 20px Inter,Arial";
            cx.fillStyle = fl.gold ? "#ffe066" : fl.good ? "#7dffa1" : "#ffb3b3";
            cx.strokeStyle = "rgba(0,0,0,0.6)";
            cx.lineWidth = 3;
            cx.strokeText(fl.text, fl.x, fl.y);
            cx.fillText(fl.text, fl.x, fl.y);
          }
          cx.globalAlpha = 1;
        }

        function rrect(x, y, w, h, r) {
          cx.beginPath();
          cx.moveTo(x + r, y);
          cx.lineTo(x + w - r, y);
          cx.quadraticCurveTo(x + w, y, x + w, y + r);
          cx.lineTo(x + w, y + h - r);
          cx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
          cx.lineTo(x + r, y + h);
          cx.quadraticCurveTo(x, y + h, x, y + h - r);
          cx.lineTo(x, y + r);
          cx.quadraticCurveTo(x, y, x + r, y);
          cx.closePath();
        }

        var lastTs = 0,
          lastBeat = 0;
        function loop(ts) {
          requestAnimationFrame(loop);
          var rawDt = Math.min(50, ts - lastTs || 16.67);
          lastTs = ts;
          var dt = rawDt / 16.67;
          if (running && !ended) stepPhysics(dt);
          flushPegHit();
          if (tier >= 1 && running && !ended && balls.length && ts - lastBeat > (tier >= 3 ? 480 : tier >= 2 ? 620 : 820)) {
            lastBeat = ts;
            SFX.heart();
          }
          if (running && !ended) updateBoostBadge();
          var sx = 0,
            sy = 0;
          if (shakeMag > 0.05) {
            sx = (Math.random() - 0.5) * shakeMag;
            sy = (Math.random() - 0.5) * shakeMag;
            shakeMag *= 0.86;
          } else shakeMag = 0;
          cx.save();
          cx.translate(sx, sy);
          drawBg();
          drawPegs();
          drawSlots();
          drawSparks();
          drawBalls();
          drawFloaters();
          cx.restore();
          if (running && !ended && bank >= cost()) spinBtn.disabled = false;
        }

        window.addEventListener(
          "resize",
          function () {
            resize();
          },
          false,
        );
        resize();
        bank = loadCoins();
        overlay.style.display = "none";
        startGame();
        requestAnimationFrame(loop);
      })();
    </script>
  </body>
</html>
