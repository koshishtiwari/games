<body>
<main id="game">
  <header class="topbar">
    <button id="webWallet" class="web-wallet" aria-label="Gem balance. Open gem shop.">💎 <span id="gemBalance">150</span></button>
    <div class="brand">FLIP</div>
    <button id="sound" class="round-button" aria-label="Turn sound off" title="Sound">♪</button>
  </header>
  <section id="goal" class="goal" aria-label="Bank and table target">
    <div class="target">
      <div class="sr-only" id="stageName">OPENING TABLE</div>
      <div class="bank-heading"><div class="bank-caption">BANK</div><div id="stages" class="stages" aria-label="Table progress"></div></div>
      <div class="score-row"><strong id="score">0</strong><span>/ <b id="target">2,000</b></span></div>
      <div id="meter" class="meter" role="progressbar" aria-label="Bank balance" aria-valuemin="0" aria-valuemax="2000" aria-valuenow="0"><div id="fill"></div></div>
    </div>
    <div id="movesPanel" class="moves"><strong id="moves">12</strong><span>MOVES</span></div>
  </section>
  <section id="boardWrap" class="board-wrap" aria-label="Chip board">
    <div id="board">
      <canvas id="field" aria-hidden="true"></canvas>
      <canvas id="auras" aria-hidden="true"></canvas>
      <div id="hitTargets" role="group" aria-label="Loose poker chips"></div>
      <canvas id="effects" aria-hidden="true"></canvas>
      <canvas id="focus" aria-hidden="true"></canvas>
      <aside id="focusCaption" class="focus-caption" hidden aria-live="polite" aria-atomic="true">
        <canvas id="focusChip" width="224" height="240" aria-hidden="true"></canvas>
        <div><strong id="focusTitle"></strong><p id="focusText"></p></div>
      </aside>
      <div id="callout" aria-hidden="true"></div>
    </div>
  </section>
  <footer class="dock">
    <div id="actionIcon" class="action-icon" aria-hidden="true">✦</div>
    <div class="action-copy"><strong id="actionTitle">READY</strong><span id="actionDetail"></span></div>
    <div id="runScore" class="sr-only"><span>BEST</span><strong id="best">0</strong></div>
    <button id="join" class="table-button">PLAY · 10 💎</button>
  </footer>
