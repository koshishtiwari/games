<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#15171c" />
<title>Bluff</title>
<style>
:root{--bg:#15171c;--panel:#22252c;--yellow:#fcc419;--yellow-d:#b88a06;--red:#ff4d4f;--green:#51cf66;--muted:#9097a3;--cw:58px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
#app{position:absolute;inset:0;overflow:hidden;background:var(--bg)}
#shake{position:absolute;inset:0;perspective:1100px}
#shake.shake{animation:shk .42s}
@keyframes shk{0%,100%{transform:translate(0,0)}15%{transform:translate(calc(var(--sh)*-1px),calc(var(--sh)*.6px))}
 35%{transform:translate(calc(var(--sh)*1px),calc(var(--sh)*-.8px))}55%{transform:translate(calc(var(--sh)*-.6px),calc(var(--sh)*.4px))}75%{transform:translate(calc(var(--sh)*.4px),calc(var(--sh)*-.3px))}}
#stage{position:absolute;inset:0;transform-origin:50% 45%}
#world{position:absolute;inset:0;transform-origin:0 0;will-change:transform}
#glow{position:absolute;left:50%;top:var(--mid);width:560px;height:560px;margin:-280px 0 0 -280px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,255,255,.075) 0,rgba(255,255,255,.03) 35%,transparent 68%)}

/* seats: tile + name strip + card fan, like the reference */
.seat{position:absolute;width:76px;display:flex;flex-direction:column;align-items:center}
/* table layout, nudged up: the old 20/38/48 left a big empty gap above the hand. Top row stays clear of the native header. */
:root{--row1:max(100px,13%);--row2:40%;--mid:33.5%}
.seat[data-i="1"]{left:6%;top:var(--row2)}
.seat[data-i="2"]{left:6%;top:var(--row1)}
.seat[data-i="3"]{right:6%;top:var(--row1)}
.seat[data-i="4"]{right:6%;top:var(--row2)}
.av{position:relative;width:70px;height:70px;border-radius:18px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:40px;
  background:linear-gradient(var(--c1),var(--c2));border:3px solid transparent;transition:border-color .2s,transform .2s}
.av .f{margin-top:-8px;animation:bob 3.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.av .nm{position:absolute;left:0;right:0;bottom:0;background:rgba(20,22,26,.66);font-size:11px;font-weight:800;text-align:center;padding:1px 0 2px;letter-spacing:.02em}
.seat.active .av,.me.active .av{border-color:var(--green);transform:scale(1.05)}
.seat.thinking .av{animation:think 1s infinite}
@keyframes think{50%{border-color:var(--yellow);transform:scale(1.04)}}
.seat.flash .av{border-color:var(--red)}
.av.hop{animation:hop .4s}.av.nope{animation:nope .5s}
@keyframes hop{40%{transform:translateY(-10px) scale(1.06)}}
@keyframes nope{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.fan{position:relative;height:50px;width:66px;margin-top:-2px}
.fan .card{--cw:30px;position:absolute}
.cnt{position:absolute;z-index:30;right:-4px;bottom:-4px;min-width:24px;height:24px;border-radius:12px;background:var(--yellow);color:#241a00;font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 6px;box-shadow:0 2px 5px rgba(0,0,0,.5)}
.cnt.tick{animation:cntp .3s}@keyframes cntp{50%{transform:scale(1.3)}}
.bub{position:absolute;bottom:calc(100% + 2px);left:50%;transform:translate(-50%,6px);opacity:0;pointer-events:none;background:#2d3139;color:#fff;font-size:12px;font-weight:800;line-height:1.2;
  padding:6px 10px;border-radius:10px;width:max-content;max-width:140px;text-align:center;transition:opacity .15s,transform .2s;z-index:20;box-shadow:0 0 0 1.5px rgba(255,255,255,.18),0 6px 14px rgba(0,0,0,.5)}
.bub.show{opacity:1;transform:translate(-50%,0)}
.bub.emo{background:none;box-shadow:none;font-size:36px;padding:0}
.seat[data-i="1"] .bub,.seat[data-i="2"] .bub{left:0;transform:translate(0,6px)}.seat[data-i="1"] .bub.show,.seat[data-i="2"] .bub.show{transform:none}
.seat[data-i="3"] .bub,.seat[data-i="4"] .bub{left:auto;right:0;transform:translate(0,6px)}.seat[data-i="3"] .bub.show,.seat[data-i="4"] .bub.show{transform:none}
.mood{position:absolute;right:-6px;top:-10px;font-size:26px;opacity:0;pointer-events:none;z-index:5}
.mood.show{animation:moodp 1.5s both}
@keyframes moodp{0%{opacity:0;transform:scale(.3)}15%{opacity:1;transform:scale(1.25)}28%{transform:scale(1)}85%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}

/* claim chip + pile */
#pile{position:absolute;left:50%;top:var(--mid);width:130px;height:110px;margin:-55px 0 0 -65px}
#pileStack{position:absolute;inset:0}
#pileStack.press{animation:press .22s}@keyframes press{40%{transform:scale(.97)}}
#pileStack .card{--cw:56px;position:absolute;left:37px;top:20px}
#deck{position:absolute;left:50%;top:var(--mid);width:130px;height:110px;margin:-55px 0 0 -65px;pointer-events:none;display:none}
#deck .card{--cw:56px;position:absolute;left:37px}
#pile.drop #pileStack{transform:scale(1.07)}#pile.drop #pileChip{color:var(--yellow)}
#pileStack{transition:transform .15s}
#pileChip{position:absolute;left:50%;bottom:-22px;transform:translateX(-50%) scale(var(--cz,1));transform-origin:50% 0;font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap}
#claimTxt{position:absolute;left:50%;bottom:calc(100% + 10px);transform:translateX(-50%) translateY(6px) scale(var(--cz,1));transform-origin:50% 100%;white-space:nowrap;background:#2d3139;padding:6px 12px;border-radius:11px;
  font-size:14px;font-weight:900;opacity:0;transition:opacity .15s,transform .25s;box-shadow:0 0 0 1.5px rgba(255,255,255,.2),0 6px 14px rgba(0,0,0,.5);z-index:6}
#claimTxt.show{opacity:1;transform:translateX(-50%) scale(var(--cz,1))}
#claimTxt small{font-size:11px;color:var(--muted);font-weight:800;margin-right:5px}
#rv{position:absolute;left:50%;top:var(--mid);transform:translate(-50%,-50%);display:flex;gap:7px;z-index:8;pointer-events:none}
#rvLbl{position:absolute;left:50%;top:calc(var(--mid) - 134px);transform:translateX(-50%);font-size:12px;font-weight:900;letter-spacing:.1em;background:var(--yellow);color:#241a00;padding:4px 11px;border-radius:9px;z-index:9;display:none;white-space:nowrap}
#rv .fc{--cw:54px;animation:rvin .3s both}
@keyframes rvin{from{transform:translateY(20px) scale(.6);opacity:0}}
.fc{position:relative;width:var(--cw);height:calc(var(--cw)*1.4);perspective:700px}
.fc .in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,1.3,.5,1)}
.fc.up .in{transform:rotateY(180deg)}
.fc .fr,.fc .bk{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.fc .fr{transform:rotateY(180deg)}
.fc .card{position:absolute;left:0;top:0}
.fc .fr .card{transition:box-shadow .5s ease-out}
.fc.ok .fr .card{box-shadow:0 0 22px 2px rgba(81,207,102,.75),0 0 60px 10px rgba(81,207,102,.38),0 4px 10px rgba(0,0,0,.4)}
.fc.bad .fr .card{box-shadow:0 0 22px 2px rgba(255,77,79,.8),0 0 60px 10px rgba(255,77,79,.42),0 4px 10px rgba(0,0,0,.4)}

/* cards: big readable rank, small suit under it, one huge suit bleeding off the corner (or a chess piece for J/Q/K) */
.card{position:relative;flex:none;width:var(--cw);height:calc(var(--cw)*1.4);border-radius:calc(var(--cw)*.13);color:#17181c;background:#fff;overflow:hidden;
  box-shadow:0 1px 0 rgba(0,0,0,.3),0 4px 10px rgba(0,0,0,.4),inset 0 0 0 1px rgba(0,0,0,.1)}
.card.red{color:#e0283c}
.card.royal{background:#fff6dc}
.card .rk{position:absolute;left:calc(var(--cw)*.1);top:calc(var(--cw)*.03);font-size:calc(var(--cw)*.5);font-weight:900;letter-spacing:-.06em;line-height:1}
.card .rk.ten{font-size:calc(var(--cw)*.4);letter-spacing:-.1em;left:calc(var(--cw)*.07)}
.card .st{position:absolute;left:calc(var(--cw)*.12);top:calc(var(--cw)*.56);width:calc(var(--cw)*.25);height:calc(var(--cw)*.25);fill:currentColor}
.card .big{position:absolute;right:calc(var(--cw)*.09);bottom:calc(var(--cw)*.09);width:calc(var(--cw)*.6);height:calc(var(--cw)*.6);fill:currentColor}
.card .big.roy{display:flex;align-items:center;justify-content:center;font-size:calc(var(--cw)*.5);line-height:1;fill:none}
.card.back{background:#fbfaf6}
.card.back::before{content:"";position:absolute;inset:calc(var(--cw)*.07);border-radius:calc(var(--cw)*.07);background:
  repeating-linear-gradient(45deg,rgba(255,255,255,.55) 0 1px,transparent 1px 5px),repeating-linear-gradient(-45deg,rgba(255,255,255,.55) 0 1px,transparent 1px 5px),#cf3a45}

/* HUD */
#hud{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 7px);z-index:20;pointer-events:none;transition:opacity .4s}
.hb{position:absolute;top:0;width:34px;height:34px;border-radius:17px;background:rgba(0,0,0,.55);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;pointer-events:auto;font-size:15px;font-weight:900}
.hb svg{width:20px;height:20px}
.hb:active{transform:scale(.92)}
#sndBtn{left:94px}#helpBtn{left:136px}
/* inside the Pipal app, sound and How to play live in the native settings menu */
body.shell #sndBtn,body.shell #helpBtn{display:none}
#rxBlur{position:absolute;inset:0;z-index:34;display:none;background:rgba(8,10,14,.28);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#rxBlur.open{display:block;animation:rxin .18s ease-out}@keyframes rxin{from{opacity:0}}
#me .av{cursor:pointer}
#emojis{position:absolute;left:10px;bottom:120px;transform-origin:50% 100%;width:58px;padding:8px 0;border-radius:29px;background:#2a2d34;display:none;flex-direction:column;align-items:center;gap:6px;z-index:35;box-shadow:0 8px 28px rgba(0,0,0,.6)}
#emojis.open{display:flex;animation:rxpop .2s cubic-bezier(.2,1.3,.4,1)}@keyframes rxpop{from{opacity:0;transform:translateY(12px) scale(.85)}}
#emojis button{width:46px;height:46px;font-size:30px;border-radius:23px;line-height:1}
#emojis button:active{background:#3a3f48}
body.cine #hud{opacity:0;pointer-events:none}

/* bottom */
#bottom{position:absolute;left:0;right:0;bottom:0;z-index:15;transition:transform .6s cubic-bezier(.6,0,.2,1)}
body.cine #bottom{transform:translateY(125%);visibility:hidden;transition:transform .6s cubic-bezier(.6,0,.2,1),visibility 0s .6s}
#coach{position:absolute;left:10px;right:10px;top:-34px;text-align:center;font-size:13px;font-weight:800;pointer-events:none}
#coach span{display:inline-block;background:rgba(20,22,26,.85);padding:5px 12px;border-radius:12px;color:#e8ebf0}
#coach span:empty{display:none}
body.tut #coach{display:none}
#handWrap{position:relative;height:88px;margin:0 6px;z-index:2}
#myStack{position:absolute;left:50%;top:4px;width:130px;height:78px;margin-left:-65px;display:none;pointer-events:none;z-index:3}
#myStack .card{--cw:44px;position:absolute}
#hand .card .cb{position:absolute;left:0;top:0;width:100%;height:100%;border-radius:inherit;box-shadow:none}
#hand{position:absolute;left:0;right:0;bottom:-22px;height:110px}
#hand .card{--cw:58px;position:absolute;bottom:0;transform-origin:50% 160%;transform:translateY(var(--y,0px)) rotate(var(--a,0deg));
  transition:transform .18s cubic-bezier(.3,1.4,.5,1),box-shadow .18s,left .3s ease;cursor:grab;touch-action:none}
#hand .card.drag{transition:none;z-index:300!important;cursor:grabbing;box-shadow:0 0 24px 4px rgba(252,196,25,.85),0 0 60px 12px rgba(252,196,25,.4),0 20px 30px rgba(0,0,0,.55)}
#hand .card.sel{transform:translateY(calc(var(--y,0px) - 28px)) rotate(calc(var(--a,0deg)*.4))}
#hand .halo{position:absolute;bottom:0;width:58px;height:81.2px;border-radius:8px;z-index:0;pointer-events:none;transform-origin:50% 160%;
  transform:translateY(calc(var(--y,0px) - 28px)) rotate(calc(var(--a,0deg)*.4));box-shadow:0 0 16px 5px rgba(252,196,25,.9),0 0 42px 14px rgba(252,196,25,.4);
  transition:left .3s ease;animation:haloin .22s ease-out}
@keyframes haloin{from{opacity:0}}
#hand .card.match::before{content:"";position:absolute;left:50%;top:-8px;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--yellow)}
#hand .card.fresh{animation:dealin .55s cubic-bezier(.2,.9,.3,1) var(--d,0s) both}
#hand .card.dealt{animation:dealt .45s cubic-bezier(.2,.9,.3,1) var(--d,0s) both}
@keyframes dealin{from{transform:translate(0,-50vh) rotate(-160deg) scale(.4);opacity:0}50%{opacity:1}to{transform:translateY(var(--y,0px)) rotate(var(--a,0deg))}}
@keyframes dealt{from{transform:translateY(60px) rotate(0) scale(.6);opacity:0}to{transform:translateY(var(--y,0px)) rotate(var(--a,0deg))}}
#panel{position:relative;z-index:1;background:var(--panel);border-radius:26px 26px 0 0;padding:32px 14px calc(14px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:14px;box-shadow:0 -8px 24px rgba(0,0,0,.4)}
#me{position:relative;flex:none;width:68px;--c1:#9ad0ff;--c2:#4a86e0}
#me .av{width:64px;height:64px;font-size:36px;border-color:var(--yellow-d)}
#me.active .av{border-color:var(--yellow)}
#meBub{bottom:calc(100% + 34px)}
/* the GIF button mirrors the avatar tile on the other side of the panel */
#gifBtn{flex:none;position:relative;width:64px;height:64px;border-radius:18px;border:3px solid var(--yellow-d);background:linear-gradient(#ffd75e,#f08a1c);color:#241a00;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1px;font-weight:900;letter-spacing:.04em;box-shadow:0 3px 0 rgba(0,0,0,.35);transition:transform .1s}
#gifBtn svg{width:26px;height:26px;margin-top:-2px}
#gifBtn span{font-size:11px;line-height:1;margin-top:-3px}
#gifBtn:active{transform:translateY(3px) scale(.97)}
body.tut #gifBtn{display:none}
#act{position:relative;flex:1;height:60px;border-radius:30px;font-weight:900;font-size:16px;letter-spacing:.03em;overflow:hidden;transition:background .15s,transform .1s}
#act:active:not(:disabled){transform:translateY(3px)}
#act.play{background:var(--yellow);color:#241a00;box-shadow:0 4px 0 var(--yellow-d)}
#act:disabled.play{background:#30343b;color:#858c97;box-shadow:none;font-size:14px;font-weight:700}
#act.liar{background:var(--red);color:#fff;font-size:28px;box-shadow:0 4px 0 #a3262a;animation:liarp .55s infinite}
#act.wait{background:#2a2d34;color:var(--muted);font-size:14px;font-weight:700}
#act.play.bluff:not(:disabled){background:#ff8a3d;color:#2a1200;box-shadow:0 4px 0 #b3500f}
#claimPill{position:absolute;left:50%;top:-46px;transform:translateX(-50%);display:none;align-items:center;gap:7px;padding:8px 15px;border-radius:17px;background:#22252c;
  box-shadow:inset 0 0 0 2px var(--yellow),0 4px 0 rgba(0,0,0,.35);font-size:14px;font-weight:900;letter-spacing:.03em;white-space:nowrap;z-index:6}
#claimPill:active{transform:translateX(-50%) translateY(2px)}
#claimPill.bluff{box-shadow:inset 0 0 0 2px #ff8a3d,0 4px 0 rgba(0,0,0,.35);color:#ffb27a}
body.myturn #claimPill{display:flex}body.cine #claimPill{display:none}body.myturn #coach{display:none}
#rankSheet{position:absolute;left:12px;right:12px;bottom:calc(100% + 56px);display:none;grid-template-columns:repeat(7,1fr);gap:6px;padding:10px;border-radius:20px;background:#22252c;box-shadow:0 12px 30px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.1);z-index:30}
#rankSheet.open{display:grid;animation:sheetin .16s ease-out}
@keyframes sheetin{from{opacity:0;transform:translateY(10px)}}
#rankSheet .cap{grid-column:1/8;font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.1em;margin:0 2px 2px}
#rankSheet button{position:relative;height:44px;border-radius:12px;background:#2f333b;font-size:17px;font-weight:900}
#rankSheet button:active{transform:scale(.94)}
#rankSheet button.on{background:var(--yellow);color:#241a00}
#rankSheet button.has::after{content:"";position:absolute;left:50%;bottom:5px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:currentColor;opacity:.55}
@keyframes liarp{50%{transform:scale(1.03)}}
#bar{position:absolute;left:0;bottom:0;height:6px;background:rgba(255,255,255,.85);width:100%}
#act span{position:relative}

/* cinematics */
#bars i{position:absolute;left:-3px;right:-3px;height:0;background:#000;z-index:40;transition:height .7s cubic-bezier(.6,0,.2,1)}
#bars i:first-child{top:-3px}#bars i:last-child{bottom:-3px}
body.cine #bars i{height:calc(11% + 3px)}
#fx{position:absolute;inset:0;z-index:80;pointer-events:none}
#flash{position:absolute;inset:0;z-index:50;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 50% 45%,transparent 35%,var(--fc,#f33) 130%)}
#flash.fire{animation:flashA .7s ease-out}
@keyframes flashA{0%{opacity:.85}100%{opacity:0}}
#slam{position:absolute;left:0;right:0;top:11%;z-index:55;pointer-events:none;display:flex;justify-content:center;opacity:0}
#slam span{display:block;text-align:center;white-space:nowrap;font-weight:900;font-size:40px;line-height:1.1;letter-spacing:.03em;color:var(--sf,#fff);background:var(--sc,#ff4d4f);
  padding:8px 28px 11px;border-radius:18px;transform:rotate(-4deg);box-shadow:0 6px 0 var(--sd,#a3262a),0 16px 30px rgba(0,0,0,.5)}
#slam small{display:block;font-size:14px;font-weight:800;letter-spacing:.02em;opacity:.85;margin-top:2px}
#slam.fire{animation:slamin 1.05s cubic-bezier(.2,1.4,.4,1) both}
@keyframes slamin{0%{opacity:0;transform:scale(2.4)}16%{opacity:1;transform:scale(.93)}26%{transform:scale(1.05)}34%{transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:scale(1.08) translateY(-14px)}}
#lt{position:absolute;left:0;bottom:18%;z-index:46;padding:10px 22px 10px 16px;background:linear-gradient(90deg,rgba(0,0,0,.88),rgba(0,0,0,.6) 85%,transparent);
  transform:translateX(-110%);transition:transform .45s cubic-bezier(.2,.9,.3,1);border-left:5px solid var(--lc,var(--yellow));max-width:92%}
#lt.show{transform:none}
#lt b{display:block;font-size:28px}#lt span{font-size:14px;color:#d5dae2}
#hint{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 62px);transform:translate(-50%,10px);z-index:46;display:flex;align-items:center;gap:9px;max-width:94%;white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .3s cubic-bezier(.3,1.6,.5,1);text-shadow:0 2px 14px rgba(0,0,0,.95),0 0 4px rgba(0,0,0,.7)}
#hint.show{opacity:1;transform:translate(-50%,0)}
#hIc{font-size:24px;line-height:1}#hTx{font-size:20px;font-weight:900;line-height:1.15}
#spot{position:absolute;z-index:44;border-radius:16px;pointer-events:none;opacity:0;box-shadow:0 0 0 3px var(--yellow),0 0 20px 3px rgba(252,196,25,.4);transition:all .35s cubic-bezier(.3,1.2,.5,1)}
body.tut #hand .card.match::before{display:none}
#spot.on{opacity:1}
#finger{position:absolute;z-index:45;font-size:38px;pointer-events:none;opacity:0;transition:left .35s,top .35s,opacity .2s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.6))}
#finger.on{opacity:1;animation:fing .8s infinite}@keyframes fing{50%{margin-top:-12px}}
/* Skip sits where the reactions button does (the HUD is hidden during the tutorial), as plain text */
#skip{position:absolute;z-index:48;display:none;right:58px;top:calc(env(safe-area-inset-top) + 7px);height:34px;padding:0 10px;font-size:15px;font-weight:800;color:rgba(255,255,255,.75);letter-spacing:.01em}
#skip:active{opacity:.6}
body.tut #skip{display:block}
body.tut #hud{display:none}

/* GIF reactions (Klipy) */
#emojis .gifb{width:46px;height:30px;margin-top:2px;border-radius:10px;font-size:12px;font-weight:900;letter-spacing:.04em;background:var(--yellow);color:#241a00}
#gifSheet{position:absolute;left:0;right:0;bottom:0;height:62%;z-index:60;display:none;flex-direction:column;background:#17191e;border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.6);padding:10px 10px calc(env(safe-area-inset-bottom) + 8px)}
#gifSheet.open{display:flex;animation:sheetin .18s ease-out}
#gifSheet .gh{display:flex;gap:8px;align-items:center;margin-bottom:8px}

#gifMsg{grid-column:1/4;text-align:center;color:#7d8492;font-weight:700;padding:30px 0}
#gifSheet .kl{text-align:center;font-size:10px;font-weight:800;letter-spacing:.08em;color:#6a7180;margin-top:6px}
.gifpop{position:absolute;z-index:58;width:112px;border-radius:14px;overflow:hidden;pointer-events:none;box-shadow:0 8px 26px rgba(0,0,0,.65);background:#222}

.gifpop .kb{position:absolute;right:4px;bottom:3px;font-size:8px;font-weight:900;color:#fff;opacity:.85;text-shadow:0 1px 3px #000}

var SND_ON='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="#fff"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/></svg>',
    SND_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="#fff"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>';
function sndIcon(){$('#sndBtn').innerHTML=Snd.isOn()?SND_ON:SND_OFF;}
$('#sndBtn').addEventListener('click',function(){Snd.unlock();Snd.set(!Snd.isOn());sndIcon();});
document.addEventListener('pointerdown',function(){Snd.unlock();},{passive:true});
window.addEventListener('resize',function(){layoutTable();if(S.players.length&&S.players[0].hand)renderHand();});
document.addEventListener('visibilitychange',function(){if(document.hidden)Snd.pause();else if(!paused){Snd.resume();FX.kick();}});
if(P){
  document.body.classList.add('shell');   /* inside the Pipal app: sound + How to play are in the native settings menu */
  P.on('pause',function(){paused=true;Snd.pause();});
  P.on('resume',function(){paused=false;Snd.resume();FX.kick();});
  P.on('settings',function(m){if(m&&typeof m.sound==='boolean'){Snd.set(m.sound);sndIcon();}});
  P.on('howToPlay',function(){rxSet(false);Snd.unlock();startTutorial();});
  P.on('resetGame',function(){save('wins',0);save('plays',0);save('seen',0);S.gid++;cancelAll(true);showMenu();});
}

/* Centre the four seats + pile in the free space between the header and the hand (CSS vars drive the seat/pile tops). */
function layoutTable(){
  try{
    var H=world.clientHeight,b=$('#bottom'),sEl=document.querySelector('.seat[data-i="2"]');if(!H||!b)return;
    var T=Math.max(100,($('#hud')&&$('#hud').getBoundingClientRect().bottom||0)+10),B=b.offsetTop-54;
    var sh=(sEl&&sEl.offsetHeight)||125,free=B-T;
    var gap=Math.max(110,Math.min(210,free*.3)),block=2*sh+gap;
    if(block>free){gap=Math.max(90,free-2*sh);block=2*sh+gap;}
    var top=T+Math.max(0,(free-block)/2),r=document.documentElement.style;
    r.setProperty('--row1',Math.round(top)+'px');r.setProperty('--row2',Math.round(top+sh+gap)+'px');r.setProperty('--mid',Math.round(top+sh+gap/2)+'px');
  }catch(e){}
}
buildEmojis();buildRankSheet();makePlayers();buildSeats();layoutTable();pileSync();renderAct();sndIcon();
setTimeout(layoutTable,250);setTimeout(layoutTable,1200);   /* the WebView can settle its size after first paint */
showMenu();
if(P&&P.ready){try{P.ready();}catch(e){}}
})();
</script>
