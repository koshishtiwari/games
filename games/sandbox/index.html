      function updateMiningEffects(dt) {
        for (const fragment of miningFragments) {
          if (!fragment.active) {
            miningFragmentMesh.setMatrixAt(fragment.index, zeroMatrix);
            continue;
          }
          fragment.life -= dt;
          fragment.vel.y -= 8.5 * dt;
          fragment.pos.addScaledVector(fragment.vel, dt);
          const floorY = worldHeightAt(fragment.pos.x, fragment.pos.z) + 0.05;
          if (fragment.pos.y < floorY) {
            fragment.pos.y = floorY;
            fragment.vel.y *= -0.2;
            fragment.vel.x *= 0.62;
            fragment.vel.z *= 0.62;
          }
          fragment.rotation.addScaledVector(fragment.spin, dt);
          if (fragment.life <= 0) {
            fragment.active = false;
            miningFragmentMesh.setMatrixAt(fragment.index, zeroMatrix);
            continue;
          }
          miningFxDummy.position.copy(fragment.pos);
          miningFxDummy.rotation.set(fragment.rotation.x, fragment.rotation.y, fragment.rotation.z);
          miningFxDummy.scale.setScalar(fragment.scale);
          miningFxDummy.updateMatrix();
          miningFragmentMesh.setMatrixAt(fragment.index, miningFxDummy.matrix);
        }
        miningFragmentMesh.instanceMatrix.needsUpdate = true;

        for (const drop of gemDrops) {
          if (!drop.active) {
            gemDropMesh.setMatrixAt(drop.index, zeroMatrix);
            continue;
          }
          drop.age += dt;
          if (drop.age < 0.42) {
            drop.vel.y -= 7 * dt;
            drop.pos.addScaledVector(drop.vel, dt);
            const floorY = worldHeightAt(drop.pos.x, drop.pos.z) + 0.18;
            if (drop.pos.y < floorY) {
              drop.pos.y = floorY;
              drop.vel.y = Math.abs(drop.vel.y) * 0.32;
            }
          } else {
            gemPickupTarget.set(player.pos.x, player.pos.y + 0.88, player.pos.z);
            drop.pos.lerp(gemPickupTarget, Math.min(1, dt * (4.2 + drop.age * 2.4)));
          }
          drop.rotation.x += dt * 5.2;
          drop.rotation.y += dt * 7.4;
          const collected = drop.age > 0.42 &&
            (drop.pos.distanceToSquared(gemPickupTarget) < 0.08 || drop.age > 1.65);
          if (collected) {
            playerState.gems[drop.gem] += drop.amount;
            refreshGemPouch();
            showPickupMessage(`Collected ${drop.amount} ${GEM_TYPES[drop.gem].label}`);
            drop.active = false;
            gemDropMesh.setMatrixAt(drop.index, zeroMatrix);
            continue;
          }
          miningFxDummy.position.copy(drop.pos);
          miningFxDummy.rotation.set(drop.rotation.x, drop.rotation.y, drop.rotation.z);
          const pulse = 0.88 + Math.sin(drop.age * 11) * 0.08;
          miningFxDummy.scale.setScalar(pulse);
          miningFxDummy.updateMatrix();
          gemDropMesh.setMatrixAt(drop.index, miningFxDummy.matrix);
        }
        gemDropMesh.instanceMatrix.needsUpdate = true;
      }

      oreMeshList.forEach((mesh) => {
        mesh.visible = false;
        mainCave.visuals.push(mesh);
      });
      [miningFragmentMesh, gemDropMesh].forEach((mesh) => {
        mesh.visible = false;
        mainCave.visuals.push(mesh);
      });
      refreshOreNodes();

      const pickupMeshList = Object.values(pickupMeshes);
      const pickupMeshSet = new Set(pickupMeshList);
      const enemyMeshSet = new Set(enemyMeshList);
      const worldTapMeshes = [...pickupMeshList, ...enemyMeshList, ...oreMeshList, caveMouth];
      const pickupRaycaster = new THREE.Raycaster();
      const pickupPointer = new THREE.Vector2();
      const pickupScreenPoint = new THREE.Vector3();
      const pickupRoot = new THREE.Object3D();
      const pickupHead = node(pickupRoot, 0, 0.31, 0);
      const pickupPickTipL = node(pickupHead, 0.39, 0, 0);
      const pickupPickTipR = node(pickupHead, -0.39, 0, 0);
      pickupPickTipL.rotation.z = -Math.PI * 0.5;
      pickupPickTipR.rotation.z = Math.PI * 0.5;
      const pickupAccent = node(pickupRoot, 0, 0.085, 0);
      const bandageFirst = node(pickupRoot, 0, 0, 0);
      bandageFirst.rotation.y = 0.58;
      const bandageSecond = node(pickupRoot, 0, 0.025, 0);
      bandageSecond.rotation.y = -0.58;
      const bandageFirstPad = node(bandageFirst, 0, 0.032, 0);
      const bandageSecondPad = node(bandageSecond, 0, 0.032, 0);
      const painkillerCap = node(pickupRoot, 0, 0.175, 0);
      const painkillerMark = node(pickupRoot, 0, 0, 0.12);
      const boosterTop = node(pickupRoot, 0, 0.19, 0);
      const boosterBottom = node(pickupRoot, 0, -0.19, 0);
      const boosterTab = node(pickupRoot, 0.025, 0.211, 0);
      const boosterBoltTop = node(pickupRoot, 0.025, 0.045, 0.13);
      boosterBoltTop.rotation.z = -0.5;
      const boosterBoltBottom = node(pickupRoot, -0.02, -0.045, 0.13);
      boosterBoltBottom.rotation.z = 0.5;

      function refreshPickups() {
        pickups.forEach((item, index) => {
          const consumable = item.type === "bandage" || item.type === "painkiller" || item.type === "booster";
          const upright = item.type === "lantern" || item.type === "treasure";
          const y = worldHeightAt(item.pos.x, item.pos.z)
            + (item.type === "treasure" ? 0.16
              : item.type === "lantern" ? 0.15
              : item.type === "booster" ? 0.21
              : item.type === "painkiller" ? 0.15
              : item.type === "bandage" ? 0.04
              : 0.055);
          pickupRoot.position.set(item.pos.x, y, item.pos.z);
          pickupRoot.rotation.set(consumable || upright ? 0 : Math.PI / 2, item.rotation, 0);
          pickupRoot.updateMatrixWorld(true);
          for (const mesh of Object.values(pickupMeshes)) mesh.setMatrixAt(index, zeroMatrix);
          if (!item.active) return;
          if (item.type === "stick") pickupMeshes.stick.setMatrixAt(index, pickupRoot.matrixWorld);
          else if (item.type === "arrow") pickupMeshes.arrow.setMatrixAt(index, pickupRoot.matrixWorld);
          else if (item.type === "axe") {
            pickupMeshes.axe.setMatrixAt(index, pickupRoot.matrixWorld);
            pickupMeshes.axeHead.setMatrixAt(index, pickupHead.matrixWorld);
          } else if (item.type === "pickaxe") {
            pickupMeshes.pickaxe.setMatrixAt(index, pickupRoot.matrixWorld);
            pickupMeshes.pickaxeHead.setMatrixAt(index, pickupHead.matrixWorld);
            pickupMeshes.pickaxeTipL.setMatrixAt(index, pickupPickTipL.matrixWorld);
            pickupMeshes.pickaxeTipR.setMatrixAt(index, pickupPickTipR.matrixWorld);
          } else if (item.type === "lantern") {
            pickupMeshes.lantern.setMatrixAt(index, pickupRoot.matrixWorld);
          } else if (item.type === "treasure") {
            pickupMeshes.treasure.setMatrixAt(index, pickupRoot.matrixWorld);
            pickupMeshes.treasureBand.setMatrixAt(index, pickupAccent.matrixWorld);
          } else if (item.type === "bandage") {
            pickupMeshes.bandage.setMatrixAt(index, bandageFirst.matrixWorld);
            pickupMeshes.bandageSecond.setMatrixAt(index, bandageSecond.matrixWorld);
            pickupMeshes.bandagePad.setMatrixAt(index, bandageFirstPad.matrixWorld);
            pickupMeshes.bandageSecondPad.setMatrixAt(index, bandageSecondPad.matrixWorld);
          } else if (item.type === "painkiller") {
            pickupMeshes.painkiller.setMatrixAt(index, pickupRoot.matrixWorld);
            pickupMeshes.painkillerLabel.setMatrixAt(index, pickupRoot.matrixWorld);
            pickupMeshes.painkillerCap.setMatrixAt(index, painkillerCap.matrixWorld);
            pickupMeshes.painkillerMark.setMatrixAt(index, painkillerMark.matrixWorld);
          } else if (item.type === "booster") {
            pickupMeshes.booster.setMatrixAt(index, pickupRoot.matrixWorld);
            pickupMeshes.boosterLabel.setMatrixAt(index, pickupRoot.matrixWorld);
            pickupMeshes.boosterTop.setMatrixAt(index, boosterTop.matrixWorld);
            pickupMeshes.boosterBottom.setMatrixAt(index, boosterBottom.matrixWorld);
            pickupMeshes.boosterTab.setMatrixAt(index, boosterTab.matrixWorld);
            pickupMeshes.boosterBoltTop.setMatrixAt(index, boosterBoltTop.matrixWorld);
            pickupMeshes.boosterBoltBottom.setMatrixAt(index, boosterBoltBottom.matrixWorld);
          } else pickupMeshes[item.type].setMatrixAt(index, pickupRoot.matrixWorld);
        });
        Object.values(pickupMeshes).forEach((mesh) => (mesh.instanceMatrix.needsUpdate = true));
      }
      refreshPickups();

      const PICKUP_REACH = 1.55;
      const MINING_REACH = 2.15;
      const MINING_APPROACH_LIMIT = 8;
      let tapApproach = null;
      let manualTargetTime = 0;
      let miningTargetIndex = -1;

      const moveDestinationMarker = new THREE.Mesh(
        new THREE.RingGeometry(0.18, 0.29, 24),
        new THREE.MeshBasicMaterial({
          color: 0x9fc8d5,
          transparent: true,
          opacity: 0.78,
          side: THREE.DoubleSide,
          depthWrite: false,
          fog: true,
        })
      );
      moveDestinationMarker.rotation.x = -Math.PI * 0.5;
      moveDestinationMarker.renderOrder = 3;
      moveDestinationMarker.visible = false;
      scene.add(moveDestinationMarker);

      function showPickupMessage(message) {
        prompt.textContent = message;
        prompt.classList.add("show");
        promptTime = 1.25;
      }

      function cancelMining() {
        miningTargetIndex = -1;
      }

      function requestMoveToPoint(point) {
        if (!point || playerState.dead || playerState.interactTime > 0) return;
        const destination = point.clone();
        if (activeCave) {
          // Floor tiles slightly overlap the cave boundary. Pull edge taps
          // inward until the navigation volume has a safe destination.
          if (!activeCave.containsWorld(destination.x, destination.z, 0.38)) {
            let foundSafePoint = false;
            for (let step = 1; step <= 16; step++) {
              const t = step / 16;
              destination.x = THREE.MathUtils.lerp(point.x, player.pos.x, t);
              destination.z = THREE.MathUtils.lerp(point.z, player.pos.z, t);
              if (activeCave.containsWorld(destination.x, destination.z, 0.38)) {
                foundSafePoint = true;
                break;
              }
            }
            if (!foundSafePoint) return;
          }
          destination.y = activeCave.floorY;
        } else {
          const bound = GROUND_SIZE * 0.48;
          destination.x = THREE.MathUtils.clamp(destination.x, -bound, bound);
          destination.z = THREE.MathUtils.clamp(destination.z, -bound, bound);
          destination.y = terrainHeightAt(destination.x, destination.z);
        }
        cancelMining();
        autoTarget = null;
        manualTargetTime = 0;
        lockBreakTime = 0.7;
        tapApproach = { type: "point", position: destination };
      }

      function updateMoveDestinationMarker() {
        const destination = tapApproach?.type === "point" ? tapApproach.position : null;
        moveDestinationMarker.visible = Boolean(destination);
        if (!destination) return;
        moveDestinationMarker.position.set(
          destination.x,
          worldHeightAt(destination.x, destination.z) + 0.055,
          destination.z
        );
        const pulse = 1 + Math.sin(clock.elapsedTime * 7) * 0.12;
        moveDestinationMarker.scale.setScalar(pulse);
        moveDestinationMarker.material.opacity = 0.66
          + Math.sin(clock.elapsedTime * 7) * 0.12;
      }

      function strikeOre(ore) {
        if (!ore?.active) {
          cancelMining();
          return;
        }
        ore.hp--;
        ore.hitTime = 0.28;
        spawnMiningFragments(ore, ore.hp <= 0);
        if (ore.hp <= 0) {
          ore.active = false;
          cancelMining();
          spawnGemDrop(ore);
          showPickupMessage(`${GEM_TYPES[ore.gem].label} deposit shattered · gem released`);
        } else {
          showPickupMessage(`${GEM_TYPES[ore.gem].label} deposit cracking · ${ore.hp} strikes left`);
        }
        refreshOreNodes();
      }

      function requestMine(index) {
        const ore = oreNodes[index];
        if (!ore?.active || playerState.dead || playerState.interactTime > 0) return;
        tapApproach = null;
        manualTargetTime = 0;
        if (!playerState.hasPickaxe) {
          showPickupMessage("A pickaxe is required · search near the cave entrance");
          return;
        }
        const miningPoint = getOreVisualPosition(ore);
        const dx = miningPoint.x - player.pos.x;
        const dz = miningPoint.z - player.pos.z;
        const distance = Math.hypot(dx, dz);
        if (distance <= MINING_REACH) {
          autoTarget = null;
          lockBreakTime = 0.5;
          miningTargetIndex = index;
          equip("pickaxe");
          player.heading = Math.atan2(dx, dz);
          character.root.rotation.set(0, player.heading, 0);
          attackRequested = true;
        } else if (distance <= MINING_APPROACH_LIMIT) {
          cancelMining();
          autoTarget = null;
          lockBreakTime = 0.55;
          tapApproach = { type: "ore", index };
          showPickupMessage(`Approaching ${GEM_TYPES[ore.gem].label} vein`);
        } else showPickupMessage("That ore vein is too far away");
      }

      function beginPickup(index) {
        const item = pickups[index];
        if (!item?.active || playerState.dead || playerState.interactTime > 0) return;
        if (Math.hypot(item.pos.x - player.pos.x, item.pos.z - player.pos.z) > PICKUP_REACH) return;
        if ((item.type === "bandage" || item.type === "painkiller") &&
            playerState.health >= playerState.maxHealth) {
          showPickupMessage("Health is already full");
          return;
        }
        playerState.interactTime = 0.42;
        playerState.interactApplied = false;
        playerState.pendingPickup = index;
      }

      function requestPickup(index) {
        const item = pickups[index];
        if (!item?.active || playerState.dead || playerState.interactTime > 0) return;
        tapApproach = null;
        cancelMining();
        manualTargetTime = 0;
        if ((item.type === "bandage" || item.type === "painkiller") &&
            playerState.health >= playerState.maxHealth) {
          showPickupMessage("Health is already full");
          return;
        }
        const distance = Math.hypot(item.pos.x - player.pos.x, item.pos.z - player.pos.z);
        if (distance <= PICKUP_REACH) {
          tapApproach = null;
          beginPickup(index);
        } else {
          autoTarget = null;
          lockBreakTime = 0.55;
          tapApproach = { type: "pickup", index };
          showPickupMessage(`Moving to ${item.type}`);
        }
      }

      function requestEnemyAttack(enemy) {
        if (!enemy || enemy.dead || enemy.hidden || playerState.dead || playerState.interactTime > 0) return;
        tapApproach = null;
        cancelMining();
        const distance = Math.hypot(enemy.pos.x - player.pos.x, enemy.pos.z - player.pos.z);
        const range = playerAttackRange();
        const approachLimit = Math.min(8.5, Math.max(5.25, range + 2.25));
        if (distance > approachLimit) {
          showPickupMessage("That enemy is too far away");
          return;
        }
        autoTarget = enemy;
        manualTargetTime = 2.4;
        lockBreakTime = 0;
        enemy.state = "chase";
        enemy.engagedTime = 2.2;
        if (distance <= range) {
          tapApproach = null;
          attackRequested = true;
        } else {
          tapApproach = { type: "enemy", index: enemy.index };
          showPickupMessage("Closing distance");
        }
      }

      function requestCaveEntrance() {
        if (activeCave || playerState.dead) return;
        if (!playerState.hasLantern) {
          showPickupMessage("Take the lantern beside the cave first");
          return;
        }
        const distance = Math.hypot(
          player.pos.x - mainCave.entranceOutdoor.x,
          player.pos.z - mainCave.entranceOutdoor.z
        );
        if (distance <= 1.5) enterCave(mainCave);
        else if (distance <= 8.5) {
          tapApproach = { type: "cave" };
          showPickupMessage("Approaching the cave");
        } else showPickupMessage("The cave entrance is too far away");
      }

      function tapApproachPosition() {
        if (!tapApproach) return null;
        if (tapApproach.type === "point") return tapApproach.position;
        if (tapApproach.type === "pickup") {
          const item = pickups[tapApproach.index];
          return item?.active ? item.pos : null;
        }
        if (tapApproach.type === "ore") {
          const ore = oreNodes[tapApproach.index];
          return ore?.active ? getOreVisualPosition(ore) : null;
        }
        if (tapApproach.type === "cave") return mainCave.entranceOutdoor;
        const enemy = enemies[tapApproach.index];
        return enemy && !enemy.dead && !enemy.hidden ? enemy.pos : null;
      }

      function tapApproachStopDistance() {
        return tapApproach?.type === "point"
          ? 0.2
          : tapApproach?.type === "enemy"
          ? Math.max(0.9, playerAttackRange() - 0.12)
          : tapApproach?.type === "ore"
            ? MINING_REACH - 0.18
          : tapApproach?.type === "cave"
            ? 1.35
          : PICKUP_REACH - 0.12;
      }

      function completeTapApproach() {
        if (!tapApproach) return;
        const approach = tapApproach;
        tapApproach = null;
        if (approach.type === "pickup") beginPickup(approach.index);
        else if (approach.type === "ore") requestMine(approach.index);
        else if (approach.type === "cave") requestCaveEntrance();
        else if (approach.type === "point") return;
        else requestEnemyAttack(enemies[approach.index]);
      }

      function tryWorldTap(clientX, clientY) {
        if (playerState.dead) return;
        const rect = renderer.domElement.getBoundingClientRect();
        pickupPointer.set(
          (clientX - rect.left) / rect.width * 2 - 1,
          -(clientY - rect.top) / rect.height * 2 + 1
        );
        camera.updateMatrixWorld();
        pickupRaycaster.setFromCamera(pickupPointer, camera);
        const hits = pickupRaycaster.intersectObjects(worldTapMeshes, false);
        for (const hit of hits) {
          if (hit.object === caveMouth) {
            requestCaveEntrance();
            return;
          }
          if (hit.instanceId === undefined) continue;
          if (pickupMeshSet.has(hit.object)) {
            if (!pickups[hit.instanceId]?.active) continue;
            requestPickup(hit.instanceId);
            return;
          }
          if (oreMeshSet.has(hit.object)) {
            if (!oreNodes[hit.instanceId]?.active) continue;
            requestMine(hit.instanceId);
            return;
          }
          if (enemyMeshSet.has(hit.object)) {
            const enemy = enemies[hit.instanceId];
            if (!enemy || enemy.dead || enemy.hidden) continue;
            requestEnemyAttack(enemy);
            return;
          }
        }
        let nearestIndex = -1;
        let nearestType = null;
        let nearestPixels = 45;
        for (let index = 0; index < pickups.length; index++) {
          const item = pickups[index];
          if (!item.active) continue;
          pickupScreenPoint.set(
            item.pos.x,
            worldHeightAt(item.pos.x, item.pos.z) + 0.12,
            item.pos.z
          ).project(camera);
          if (pickupScreenPoint.z < -1 || pickupScreenPoint.z > 1) continue;
          const screenX = rect.left + (pickupScreenPoint.x * 0.5 + 0.5) * rect.width;
          const screenY = rect.top + (-pickupScreenPoint.y * 0.5 + 0.5) * rect.height;
          const pixels = Math.hypot(clientX - screenX, clientY - screenY);
          if (pixels < 34 && pixels < nearestPixels) {
            nearestPixels = pixels;
            nearestIndex = index;
            nearestType = "pickup";
          }
        }
        if (activeCave) {
          for (const ore of oreNodes) {
            if (!ore.active) continue;
            const visualPosition = getOreVisualPosition(ore);
            pickupScreenPoint.set(
              visualPosition.x,
              oreSurfaceHeight(ore),
              visualPosition.z
            ).project(camera);
            if (pickupScreenPoint.z < -1 || pickupScreenPoint.z > 1) continue;
            const screenX = rect.left + (pickupScreenPoint.x * 0.5 + 0.5) * rect.width;
            const screenY = rect.top + (-pickupScreenPoint.y * 0.5 + 0.5) * rect.height;
            const pixels = Math.hypot(clientX - screenX, clientY - screenY);
            if (pixels < 40 && pixels < nearestPixels) {
              nearestPixels = pixels;
              nearestIndex = ore.index;
              nearestType = "ore";
            }
          }
        }
        for (const enemy of enemies) {
          if (enemy.dead || enemy.hidden) continue;
          pickupScreenPoint.set(
            enemy.pos.x,
            worldHeightAt(enemy.pos.x, enemy.pos.z) + enemy.size * 1.05,
            enemy.pos.z
          ).project(camera);
          if (pickupScreenPoint.z < -1 || pickupScreenPoint.z > 1) continue;
          const screenX = rect.left + (pickupScreenPoint.x * 0.5 + 0.5) * rect.width;
          const screenY = rect.top + (-pickupScreenPoint.y * 0.5 + 0.5) * rect.height;
          const pixels = Math.hypot(clientX - screenX, clientY - screenY);
          if (pixels < nearestPixels) {
            nearestPixels = pixels;
            nearestIndex = enemy.index;
            nearestType = "enemy";
          }
        }
        if (nearestIndex >= 0) {
          if (nearestType === "pickup") requestPickup(nearestIndex);
          else if (nearestType === "ore") requestMine(nearestIndex);
          else requestEnemyAttack(enemies[nearestIndex]);
          return;
        }

        // Empty-space taps become movement commands. Raycast only against
        // the currently walkable level so scenery never steals the click.
        const walkableSurface = activeCave ? activeCave.floorMesh : ground;
        const walkableHit = pickupRaycaster.intersectObject(walkableSurface, false)[0];
        if (walkableHit) requestMoveToPoint(walkableHit.point);
      }

      const playerState = {
        health: 100,
        maxHealth: 100,
        dead: false,
        deathTime: 0,
        invulnerable: 0,
        damageFlash: 0,
        equipped: null,
        arrows: 0,
        attackTime: 0,
        attackDuration: 0.5,
        attackApplied: false,
        interactTime: 0,
        interactApplied: false,
        pendingPickup: -1,
        boosterTime: 0,
        hasLantern: false,
        hasPickaxe: false,
        treasure: 0,
        gems: { moonstone: 0, amethyst: 0, emerald: 0, ruby: 0 },
      };
      let promptTime = 0;
      let autoTarget = null;
      let lockBreakTime = 0;
      const enemyHealthBars = enemies.map(() => {
        const bar = document.createElement("div");
        const fill = document.createElement("i");
        bar.className = "enemyHealth";
        bar.appendChild(fill);
        enemyHealthLayer.appendChild(bar);
        return { bar, fill };
      });
      const enemyBarPoint = new THREE.Vector3();

      function equip(type) {
        playerState.equipped = type;
        Object.entries(character.equipment).forEach(([key, item]) => {
          item.visible = key === type;
        });
        const held = type
          ? type === "arrow" ? `Arrows · ${playerState.arrows}` : type
          : "Hands";
        equipmentLabel.textContent = `${held}${playerState.hasLantern ? " · Lantern" : ""}`;
      }

      function refreshGemPouch() {
        let total = 0;
        for (const entry of gemPouchEntries) {
          const gem = entry.dataset.gem;
          const count = playerState.gems[gem] ?? 0;
          total += count;
          entry.textContent = `${GEM_TYPES[gem].label} ${count}`;
        }
        gemPouch.classList.toggle("show", Boolean(activeCave || playerState.hasPickaxe || total));
      }
      refreshGemPouch();

      const caveFogColor = new THREE.Color(0x091522);
      function setCaveAtmosphere(inside) {
        activeCave = inside ? mainCave : null;
        scene.fog.color.copy(inside ? caveFogColor : fogColor);
        scene.fog.near = inside ? 7 : 34;
        scene.fog.far = inside ? 92 : 128;
        scene.background = inside ? caveFogColor : fogColor;
        skyDome.visible = !inside;
        fogCardGroup.visible = !inside;
        stars.visible = !inside;
        cloudGroup.visible = !inside;
        birdLeftWings.visible = !inside;
        birdRightWings.visible = !inside;
        birdBodies.visible = !inside;
        hemi.intensity = inside ? 0.19 : 0.58;
        foliageFill.intensity = inside ? 0.08 : 0.26;
        sun.intensity = inside ? 0.025 : 1.2;
        renderer.toneMappingExposure = inside ? 0.96 : 0.82;
        caveBounceLights.forEach((light) => (light.visible = inside));
        caveMoonFill.visible = inside;
        outdoorLanternLights.forEach((light) => (light.visible = !inside));
        mainCave.exitBeacon.visible = inside;
        mainCave.visuals.forEach((mesh) => (mesh.visible = inside));
        outdoorEnvironmentMeshes.forEach((mesh) => (mesh.visible = !inside));
        character.lantern.visible = playerState.hasLantern;
        refreshGemPouch();
        if (!inside) updateDayNightCycle(0, true);
      }

      function placePlayerAt(position, heading) {
        player.pos.set(position.x, worldHeightAt(position.x, position.z) + 0.008, position.z);
        player.heading = heading;
        player.velY = 0;
        player.grounded = true;
        character.root.position.copy(player.pos);
        character.root.rotation.set(0, heading, 0);
        tapApproach = null;
        autoTarget = null;
        lockBreakTime = 0.8;
        cameraSnapRequested = true;
      }

      function enterCave(cave) {
        setCaveAtmosphere(true);
        placePlayerAt(
          new THREE.Vector3(cave.entryWorld.x + 4, cave.floorY, cave.entryWorld.z),
          Math.PI * 0.5
        );
        cavePortalCooldown = 2.25;
        showPickupMessage("Entered Forked Hollow · the passage opens into the deep");
      }

      function leaveCave(cave, throughExit = false) {
        setCaveAtmosphere(false);
        const destination = throughExit ? cave.exitOutdoor : cave.entranceOutdoor;
        const offset = throughExit ? new THREE.Vector3(-1.2, 0, -1.2) : new THREE.Vector3(0, 0, 2.3);
        placePlayerAt(destination.clone().add(offset), throughExit ? -Math.PI * 0.75 : 0);
        cavePortalCooldown = 2.25;
        showPickupMessage(throughExit ? "You found the forest exit" : "Returned to the clearing");
      }

      function updateCavePortals(dt) {
        cavePortalCooldown = Math.max(0, cavePortalCooldown - dt);
        if (cavePortalCooldown > 0 || playerState.dead) return;
        if (!activeCave) {
          const distance = Math.hypot(
            player.pos.x - mainCave.entranceOutdoor.x,
            player.pos.z - mainCave.entranceOutdoor.z
          );
          if (distance < 3 && !playerState.hasLantern) {
            showPickupMessage("The cave is pitch black · take the lantern beside the entrance");
          } else if (distance < 1.45 && playerState.hasLantern) enterCave(mainCave);
          return;
        }
        const entryDistance = Math.hypot(
          player.pos.x - activeCave.entryWorld.x,
          player.pos.z - activeCave.entryWorld.z
        );
        const exitDistance = Math.hypot(
          player.pos.x - activeCave.exitWorld.x,
          player.pos.z - activeCave.exitWorld.z
        );
        if (exitDistance < 1.5) leaveCave(activeCave, true);
        else if (entryDistance < 1.2) leaveCave(activeCave, false);
      }

      // Generic projected world marker retained for later objectives. Caves
      // intentionally do not register one: their lantern trail and bird life
      // provide environmental discovery without an on-screen distance label.
      const worldMarkerPoint = new THREE.Vector3();
      function updateWorldMarker(target, label) {
        if (!target) {
          worldMarker.style.display = "none";
          return;
        }
        camera.updateMatrixWorld();
        worldMarkerPoint.copy(target).project(camera);
        if (worldMarkerPoint.z < -1 || worldMarkerPoint.z > 1) {
          worldMarker.style.display = "none";
          return;
        }
        const width = renderer.domElement.clientWidth;
        const height = renderer.domElement.clientHeight;
        const x = THREE.MathUtils.clamp((worldMarkerPoint.x * 0.5 + 0.5) * width, 74, width - 74);
        const y = THREE.MathUtils.clamp((-worldMarkerPoint.y * 0.5 + 0.5) * height, 64, height - 110);
        const distance = Math.round(Math.hypot(
          player.pos.x - target.x,
          player.pos.z - target.z
        ));
        worldMarker.style.display = "flex";
        worldMarker.style.left = `${x}px`;
        worldMarker.style.top = `${y}px`;
        worldMarker.querySelector("span").textContent = `${label} · ${distance}m`;
      }

      function damagePlayer(amount, sourceX = player.pos.x - 1, sourceZ = player.pos.z) {
        if (playerState.dead || playerState.invulnerable > 0) return false;
        const appliedDamage = Math.max(1, Math.round(amount * (playerState.boosterTime > 0 ? 0.6 : 1)));
        const lethal = playerState.health <= appliedDamage;
        playerState.health = Math.max(0, playerState.health - appliedDamage);
        playerState.invulnerable = 0.42;
        playerState.damageFlash = 0.75;
        spawnBlood(
          player.pos.x,
          player.pos.y + 1.02,
          player.pos.z,
          sourceX,
          sourceZ,
          lethal ? 15 : 9
        );
        if (playerState.health === 0) {
          playerState.dead = true;
          playerState.deathTime = 0;
          tapApproach = null;
          deathLabel.style.opacity = "1";
        }
        return true;
      }

      function healPlayer(amount) {
        if (playerState.dead) return;
        const before = playerState.health;
        playerState.health = Math.min(playerState.maxHealth, playerState.health + amount);
        if (playerState.health > before && playerState.health / playerState.maxHealth > 0.8) {
          clearStuckArrows();
        }
      }

      function damageEnemy(enemy, amount, sourceX = player.pos.x, sourceZ = player.pos.z) {
        if (enemy.dead || enemy.hidden) return;
        const lethal = enemy.hp <= amount;
        enemy.hp = Math.max(0, enemy.hp - amount);
        enemy.hurtTime = 0.22;
        enemy.engagedTime = 2.2;
        enemy.state = "chase";
        spawnBlood(
          enemy.pos.x,
          worldHeightAt(enemy.pos.x, enemy.pos.z) + enemy.size * 1.04,
          enemy.pos.z,
          sourceX,
          sourceZ,
          lethal ? 15 : 8
        );
        if (enemy.hp <= 0) {
          enemy.dead = true;
          enemy.state = "dead";
          enemy.deathTime = 0;
          enemy.moving = false;
        }
      }

      function playerForward(target = new THREE.Vector3()) {
        return target.set(Math.sin(player.heading), 0, Math.cos(player.heading));
      }

      function playerAttackRange() {
        if (playerState.equipped === "arrow" && playerState.arrows > 0) return 7.2;
        if (playerState.equipped === "stick") return 2;
        if (playerState.equipped === "axe") return 1.85;
        if (playerState.equipped === "pickaxe") return 1.9;
        return 1.25;
      }

      function performPlayerAttack() {
        if (playerState.equipped === "pickaxe" && miningTargetIndex >= 0) {
          const ore = oreNodes[miningTargetIndex];
          const miningPoint = ore?.active ? getOreVisualPosition(ore) : null;
          if (miningPoint && Math.hypot(miningPoint.x - player.pos.x, miningPoint.z - player.pos.z) <= MINING_REACH + 0.2) {
            strikeOre(ore);
            return;
          }
          cancelMining();
        }
        if (playerState.equipped === "arrow" && playerState.arrows > 0) {
          const origin = new THREE.Vector3(player.pos.x, player.pos.y + 1.18, player.pos.z);
          const target = origin.clone().addScaledVector(playerForward(), 18);
          fireProjectile("player", origin, target, 15, 24);
          playerState.arrows--;
          if (playerState.arrows === 0) equip(null);
          else equipmentLabel.textContent = `Arrows · ${playerState.arrows}${playerState.hasLantern ? " · Lantern" : ""}`;
          return;
        }

        const range = playerAttackRange();
        const damage = playerState.equipped === "stick"
          ? 17
          : playerState.equipped === "axe"
            ? 30
            : playerState.equipped === "pickaxe" ? 22 : 8;
        const facing = playerForward();
        let best = null;
        let bestDistance = range;
        if (autoTarget && !autoTarget.dead && !autoTarget.hidden) {
          const lockedDistance = Math.hypot(autoTarget.pos.x - player.pos.x, autoTarget.pos.z - player.pos.z);
          if (lockedDistance < range) {
            best = autoTarget;
            bestDistance = lockedDistance;
          }
        }
        for (const enemy of enemies) {
          if (enemy.dead || enemy.hidden) continue;
          const dx = enemy.pos.x - player.pos.x;
          const dz = enemy.pos.z - player.pos.z;
          const distance = Math.hypot(dx, dz);
          if (distance < bestDistance && (dx * facing.x + dz * facing.z) / Math.max(distance, 0.001) > 0.15) {
            best = enemy;
            bestDistance = distance;
          }
        }
        if (best) damageEnemy(best, damage);
      }

      function applyPlayerActionPose(alpha) {
        bones.body.position.set(0, 0.18, 0);
        bones.armL.position.set(0.34, 0.48, 0);
        bones.armR.position.set(-0.34, 0.48, 0);
        character.equipment.stick.rotation.x = 0;
        character.equipment.axe.rotation.x = 0;
        character.equipment.axe.userData.headPivot.rotation.x = -0.08;
        character.equipment.pickaxe.rotation.x = 0;
        character.equipment.pickaxe.userData.headPivot.rotation.x = -0.08;
        character.equipment.arrow.rotation.x = 0;
        if (playerState.dead) {
          const fall = THREE.MathUtils.smootherstep(playerState.deathTime, 0, 0.95);
          character.root.position.y += 0.16 * fall;
          character.root.rotation.x = -fall * Math.PI * 0.48;
          rotateBone(bones.body, 0, 0, 0, 1);
          rotateBone(bones.armL, 0.22 * fall, 0, 0.82 * fall, 1);
          rotateBone(bones.armR, -0.12 * fall, 0, -0.78 * fall, 1);
          rotateBone(bones.legL.upper, 0.14 * fall, 0, 0, 1);
          rotateBone(bones.legR.upper, 0.08 * fall, 0, 0, 1);
          return;
        }
        if (playerState.interactTime > 0) {
          const p = 1 - playerState.interactTime / 0.42;
          const reach = Math.sin(p * Math.PI);
          rotateBone(bones.body, 0.22 * reach, 0, 0, alpha);
          rotateBone(bones.armR, -1.05 * reach, 0, -0.12, alpha);
        } else if (playerState.attackTime > 0) {
          const p = 1 - playerState.attackTime / playerState.attackDuration;
          const throwStyle = playerState.equipped === "arrow";
          if (throwStyle) {
            const throwArc = Math.sin(p * Math.PI);
            rotateBone(bones.body, 0.03, throwArc * 0.22, 0, alpha);
            rotateBone(bones.armR, -1.5 * throwArc, 0, -0.24 * throwArc, 1);
          } else {
            const windup = THREE.MathUtils.smoothstep(p, 0, 0.3);
            const strike = THREE.MathUtils.smoothstep(p, 0.3, 0.58);
            const recover = THREE.MathUtils.smoothstep(p, 0.72, 1);
            const contact = strike * (1 - recover);
            let armX = THREE.MathUtils.lerp(0, -0.25, windup);
            let armZ = THREE.MathUtils.lerp(-0.04, -1.92, windup);
            armX = THREE.MathUtils.lerp(armX, -1.12, strike);
            armZ = THREE.MathUtils.lerp(armZ, -0.22, strike);
            armX = THREE.MathUtils.lerp(armX, 0, recover);
            armZ = THREE.MathUtils.lerp(armZ, -0.04, recover);
            bones.body.position.z = 0.09 * contact;
            bones.armR.position.z = 0.32 * contact;
            if (playerState.equipped === "axe" || playerState.equipped === "pickaxe") {
              const swungTool = character.equipment[playerState.equipped];
              swungTool.rotation.x = 2.85 * contact;
              swungTool.userData.headPivot.rotation.x = THREE.MathUtils.lerp(
                -0.08,
                -1.45,
                contact
              );
            }
            else if (playerState.equipped === "stick") character.equipment.stick.rotation.x = 0.38 * contact;
            rotateBone(bones.body, 0.03, (windup - strike) * 0.3, 0, alpha);
            rotateBone(bones.armR, armX, 0, armZ, 1);
          }
        }
      }

      function updatePlayerState(dt) {
        playerState.invulnerable = Math.max(0, playerState.invulnerable - dt);
        playerState.damageFlash = Math.max(0, playerState.damageFlash - dt * 2.8);
        playerState.boosterTime = Math.max(0, playerState.boosterTime - dt);
        promptTime = Math.max(0, promptTime - dt);
        if (promptTime <= 0) prompt.classList.remove("show");
        damageFlash.style.opacity = String(playerState.damageFlash);
        healthFill.style.transform = `scaleX(${playerState.health / playerState.maxHealth})`;
        const healthPct = Math.round((playerState.health / playerState.maxHealth) * 100);
        if (healthPct !== lastPostedHealthPct) postStats();
        effectLabel.textContent = playerState.boosterTime > 0
          ? `Guard · ${Math.ceil(playerState.boosterTime)}s · Damage −40%`
          : "";
        effectLabel.style.opacity = playerState.boosterTime > 0 ? "1" : "0";

        if (playerState.dead) {
          playerState.deathTime += dt;
          attackRequested = false;
          cancelMining();
          if (playerState.deathTime > 2.6) {
            playerState.dead = false;
            playerState.health = playerState.maxHealth;
            playerState.invulnerable = 1.2;
            playerState.boosterTime = 0;
            clearStuckArrows();
            if (activeCave) setCaveAtmosphere(false);
            player.pos.set(0, worldHeightAt(0, 0) + 0.008, 0);
            player.velY = 0;
            player.grounded = true;
            deathLabel.style.opacity = "0";
          }
          return;
        }

        if (playerState.interactTime > 0) {
          playerState.interactTime -= dt;
          if (!playerState.interactApplied && playerState.interactTime < 0.22) {
            const item = pickups[playerState.pendingPickup];
            if (item?.active) {
              item.active = false;
              if (item.type === "arrow") {
                playerState.arrows += 5;
                equip("arrow");
                showPickupMessage("Arrows equipped · +5");
              } else if (item.type === "bandage") {
                healPlayer(playerState.maxHealth * 0.25);
                showPickupMessage("Bandaged · +25% health");
              } else if (item.type === "painkiller") {
                healPlayer(playerState.maxHealth * 0.5);
                showPickupMessage("Painkillers · +50% health");
              } else if (item.type === "booster") {
                playerState.boosterTime = 18;
                showPickupMessage("Energy guard active");
              } else if (item.type === "lantern") {
                playerState.hasLantern = true;
                character.lantern.visible = true;
                equip(playerState.equipped);
                showPickupMessage("Lantern lit · the cave is now accessible");
              } else if (item.type === "pickaxe") {
                playerState.hasPickaxe = true;
                equip("pickaxe");
                refreshGemPouch();
                showPickupMessage("Pickaxe equipped · tap glowing ore to mine");
              } else if (item.type === "treasure") {
                playerState.treasure++;
                healPlayer(playerState.maxHealth * 0.2);
                showPickupMessage(`Treasure recovered · ${playerState.treasure}/${mainCave.treasureSpawns.length}`);
              } else {
                equip(item.type);
                showPickupMessage(`${item.type} equipped`);
              }
              refreshPickups();
            }
            playerState.interactApplied = true;
          }
        }

        if (miningTargetIndex >= 0 && playerState.attackTime <= 0 && playerState.interactTime <= 0) {
          const ore = oreNodes[miningTargetIndex];
          const miningPoint = ore?.active ? getOreVisualPosition(ore) : null;
          if (!miningPoint ||
              Math.hypot(miningPoint.x - player.pos.x, miningPoint.z - player.pos.z) > MINING_REACH + 0.25) {
            cancelMining();
          } else {
            const dx = miningPoint.x - player.pos.x;
            const dz = miningPoint.z - player.pos.z;
            player.heading = Math.atan2(dx, dz);
            character.root.rotation.set(0, player.heading, 0);
            attackRequested = true;
          }
        }

        if (attackRequested && playerState.attackTime <= 0 && playerState.interactTime <= 0) {
          playerState.attackDuration = playerState.equipped === "axe"
            ? 0.62
            : playerState.equipped === "pickaxe" ? 0.72 : 0.48;
          playerState.attackTime = playerState.attackDuration;
          playerState.attackApplied = false;
        }
        attackRequested = false;
        if (playerState.attackTime > 0) {
          playerState.attackTime -= dt;
          if (!playerState.attackApplied && playerState.attackTime < playerState.attackDuration * 0.52) {
            performPlayerAttack();
            playerState.attackApplied = true;
          }
        }
      }

      function turnEnemy(enemy, heading, dt) {
        const difference = Math.atan2(Math.sin(heading - enemy.heading), Math.cos(heading - enemy.heading));
        enemy.heading += difference * Math.min(1, dt * 7);
      }

      function moveEnemy(enemy, dx, dz, speed, dt) {
        if (enemy.cave) {
          const waypoint = enemy.cave.nextWaypoint(
            enemy.pos.x,
            enemy.pos.z,
            enemy.pos.x + dx,
            enemy.pos.z + dz,
            enemy.radius + 0.12
          );
          dx = waypoint.x - enemy.pos.x;
          dz = waypoint.z - enemy.pos.z;
        }
        const length = Math.hypot(dx, dz) || 1;
        dx /= length;
        dz /= length;
        turnEnemy(enemy, Math.atan2(dx, dz), dt);
        const nextX = enemy.pos.x + dx * speed * dt;
        const nextZ = enemy.pos.z + dz * speed * dt;
        if (enemy.cave && !enemy.cave.containsWorld(nextX, nextZ, enemy.radius + 0.12)) {
          enemy.moving = false;
          if (enemy.state === "patrol") choosePatrol(enemy);
          return;
        }
        enemy.pos.x = nextX;
        enemy.pos.z = nextZ;
        enemy.phase += speed * dt * 6.2;
        enemy.moving = true;
      }

      function beginEnemyAttack(enemy) {
        enemy.state = "attack";
        enemy.attackTime = enemy.type === "archer" ? 0.85 : 0.65;
        enemy.hitApplied = false;
        enemy.moving = false;
      }

      function beginSunlightDeath(enemy) {
        enemy.hp = 0;
        enemy.dead = true;
        enemy.hidden = false;
        enemy.sheltered = false;
        enemy.awakenedByForest = false;
        enemy.state = "dead";
        enemy.attackTime = 0;
        enemy.deathTime = 0;
        enemy.respawnTime = 0;
        enemy.moving = false;
      }

      let aiFrame = 0;
      function updateEnemies(dt) {
        aiFrame++;
        const playerInForest = !activeCave && isInForestShade(player.pos.x, player.pos.z);
        for (const enemy of enemies) {
          enemy.cooldown = Math.max(0, enemy.cooldown - dt);
          enemy.hurtTime = Math.max(0, enemy.hurtTime - dt);
          enemy.engagedTime = Math.max(0, enemy.engagedTime - dt);
          if (enemy.dead) {
            enemy.deathTime += dt;
            enemy.hidden = enemy.deathTime > 1.85;
            enemy.respawnTime += dt;
            if (!skeletonsRetreating && enemy.respawnTime > 14 &&
                Math.hypot(enemy.home.x - player.pos.x, enemy.home.z - player.pos.z) > 8) {
              enemy.dead = enemy.hidden = false;
              enemy.sheltered = false;
              enemy.deathTime = enemy.respawnTime = 0;
              enemy.engagedTime = 0;
              enemy.hp = enemy.maxHp;
              enemy.pos.copy(enemy.home);
              enemy.sunExposure = 0;
              enemy.forestWakeTime = 0;
              enemy.awakenedByForest = false;
              enemy.state = "patrol";
              if (!enemy.cave) chooseNearestOutdoorShelter(enemy);
              choosePatrol(enemy);
            }
            continue;
          }

          if (!enemy.cave && sunIsUp && !enemy.sheltered &&
              !isInForestShade(enemy.pos.x, enemy.pos.z)) {
            enemy.sunExposure += dt;
            if (enemy.sunExposure >= enemy.sunTolerance) {
              beginSunlightDeath(enemy);
              continue;
            }
          } else enemy.sunExposure = Math.max(0, enemy.sunExposure - dt * 0.8);

          if (!enemy.cave && !skeletonsRetreating && enemy.sheltered) {
            if (nightReturnClock < enemy.retreatDelay * 0.55) {
              enemy.moving = false;
              continue;
            }
            const emergenceX = enemy.home.x - enemy.shelterTarget.x;
            const emergenceZ = enemy.home.z - enemy.shelterTarget.z;
            const emergenceLength = Math.hypot(emergenceX, emergenceZ) || 1;
            enemy.pos.set(
              enemy.shelterTarget.x + emergenceX / emergenceLength * 0.75,
              0,
              enemy.shelterTarget.z + emergenceZ / emergenceLength * 0.75
            );
            enemy.sheltered = false;
            enemy.hidden = false;
            enemy.awakenedByForest = false;
            enemy.forestWakeTime = 0;
            enemy.state = "return";
          }

          if (enemy.sheltered) {
            const wakeDistance = Math.hypot(
              player.pos.x - enemy.pos.x,
              player.pos.z - enemy.pos.z
            );
            const canWakeInForest = skeletonsRetreating &&
              enemy.shelterType === "forest" && playerInForest &&
              wakeDistance < FOREST_WAKE_RADIUS;
            if (canWakeInForest) {
              enemy.forestWakeTime += dt;
              if (enemy.forestWakeTime >= enemy.forestWakeDelay) {
                enemy.sheltered = false;
                enemy.hidden = false;
                enemy.awakenedByForest = true;
                enemy.forestWakeTime = 0;
                enemy.state = "chase";
                enemy.engagedTime = 2.2;
              }
            } else enemy.forestWakeTime = Math.max(0, enemy.forestWakeTime - dt * 1.5);
            if (!enemy.awakenedByForest) {
              enemy.hidden = true;
              enemy.moving = false;
              continue;
            }
          }

          if (!enemy.cave && !skeletonsRetreating && enemy.state === "retreat") {
            enemy.state = "return";
          }

          const dx = player.pos.x - enemy.pos.x;
          const dz = player.pos.z - enemy.pos.z;
          const distance = Math.hypot(dx, dz);
          const detection = enemy.type === "archer" ? 15 : 12;
          let forcedForestRetreat = false;
          if (enemy.awakenedByForest &&
              (!playerInForest || distance > detection * 1.65 || playerState.dead)) {
            enemy.awakenedByForest = false;
            enemy.state = "retreat";
            enemy.attackTime = 0;
            forcedForestRetreat = true;
          }

          const farPatrol = enemy.state === "patrol" && distance > 28;
          if (farPatrol && (aiFrame + enemy.index) % 4 !== 0) {
            enemy.moving = false;
            continue;
          }
          const logicDt = farPatrol ? dt * 4 : dt;
          if (!forcedForestRetreat && !playerState.dead && distance < detection &&
              enemy.state !== "attack") {
            enemy.state = "chase";
            enemy.engagedTime = Math.max(enemy.engagedTime, 1.2);
          }
          if (playerState.dead && (enemy.state === "chase" || enemy.state === "attack")) {
            enemy.state = !enemy.cave && skeletonsRetreating
              ? "retreat"
              : !enemy.cave && enemy.pos.distanceToSquared(enemy.home) > 0.42
                ? "return"
                : "patrol";
            enemy.attackTime = 0;
          }
          if (distance > detection * 1.65 && enemy.state === "chase") {
            if (!enemy.cave && skeletonsRetreating) {
              chooseNearestOutdoorShelter(enemy);
              enemy.state = "retreat";
            }
            else if (!enemy.cave && enemy.pos.distanceToSquared(enemy.home) > 0.42) {
              enemy.state = "return";
            } else {
              enemy.state = "patrol";
              choosePatrol(enemy);
            }
          }

          if (!enemy.cave && skeletonsRetreating &&
              daylightRetreatClock >= enemy.retreatDelay &&
              enemy.state !== "attack" && enemy.state !== "chase") {
            if (enemy.state !== "retreat") chooseNearestOutdoorShelter(enemy);
            enemy.state = "retreat";
          }

          enemy.moving = false;
          if (enemy.state === "retreat") {
            const retreatX = enemy.shelterTarget.x - enemy.pos.x;
            const retreatZ = enemy.shelterTarget.z - enemy.pos.z;
            const shelterReach = enemy.shelterType === "forest" ? 2 : 1.05;
            if (Math.hypot(retreatX, retreatZ) < shelterReach) {
              enemy.pos.copy(enemy.shelterTarget);
              enemy.sheltered = true;
              enemy.hidden = true;
              enemy.awakenedByForest = false;
              enemy.sunExposure = 0;
            } else moveEnemy(enemy, retreatX, retreatZ, 0.92 * enemy.speedScale, dt);
          } else if (enemy.state === "return") {
            const homeX = enemy.home.x - enemy.pos.x;
            const homeZ = enemy.home.z - enemy.pos.z;
            if (Math.hypot(homeX, homeZ) < 0.65) {
              enemy.state = "patrol";
              choosePatrol(enemy);
            } else moveEnemy(enemy, homeX, homeZ, 1.08 * enemy.speedScale, dt);
          } else if (enemy.state === "patrol") {
            const px = enemy.patrol.x - enemy.pos.x;
            const pz = enemy.patrol.z - enemy.pos.z;
            if (Math.hypot(px, pz) < 0.45) choosePatrol(enemy);
            else moveEnemy(enemy, px, pz, 0.75 * enemy.speedScale, logicDt);
          } else if (enemy.state === "chase") {
            if (enemy.type === "archer") {
              if (distance > 8.5) moveEnemy(enemy, dx, dz, 1.55 * enemy.speedScale, dt);
              else if (distance < 5.2) moveEnemy(enemy, -dx, -dz, 1.25 * enemy.speedScale, dt);
              else {
                turnEnemy(enemy, Math.atan2(dx, dz), dt);
                if (enemy.cooldown <= 0) beginEnemyAttack(enemy);
              }
            } else {
              const reach = (enemy.type === "spear" ? 2.05 : 1.35) * enemy.size;
              if (distance > reach) moveEnemy(enemy, dx, dz, (enemy.type === "sword" ? 2 : 1.7) * enemy.speedScale, dt);
              else if (enemy.cooldown <= 0) beginEnemyAttack(enemy);
            }
          } else if (enemy.state === "attack") {
            enemy.attackTime -= dt;
            turnEnemy(enemy, Math.atan2(dx, dz), dt);
            const hitTime = enemy.type === "archer" ? 0.34 : 0.3;
            if (!enemy.hitApplied && enemy.attackTime < hitTime) {
              if (enemy.type === "archer") {
                const origin = new THREE.Vector3(enemy.pos.x, worldHeightAt(enemy.pos.x, enemy.pos.z) + 1.25, enemy.pos.z);
                const target = new THREE.Vector3(player.pos.x, player.pos.y + 1, player.pos.z);
                fireProjectile("enemy", origin, target, 10, 9);
              } else {
                const reach = (enemy.type === "spear" ? 2.25 : 1.55) * enemy.size;
                if (distance < reach) {
                  damagePlayer(enemy.type === "spear" ? 13 : 10, enemy.pos.x, enemy.pos.z);
                }
              }
              enemy.hitApplied = true;
            }
            if (enemy.attackTime <= 0) {
              enemy.state = "chase";
              enemy.cooldown = enemy.type === "archer" ? 1.35 : 0.8;
            }
          }
        }
      }

      const crowdGrid = new Map();
      const CROWD_CELL = 1.2;
      function resolveEnemyCollisions() {
        crowdGrid.clear();
        for (const enemy of enemies) {
          if (enemy.dead || enemy.hidden) continue;
          const x = Math.floor(enemy.pos.x / CROWD_CELL);
          const z = Math.floor(enemy.pos.z / CROWD_CELL);
          const key = `${x},${z}`;
          let bucket = crowdGrid.get(key);
          if (!bucket) crowdGrid.set(key, (bucket = []));
          bucket.push(enemy);
        }

        for (const enemy of enemies) {
          if (enemy.dead || enemy.hidden) continue;
          const cellX = Math.floor(enemy.pos.x / CROWD_CELL);
          const cellZ = Math.floor(enemy.pos.z / CROWD_CELL);
          for (let x = cellX - 1; x <= cellX + 1; x++) {
            for (let z = cellZ - 1; z <= cellZ + 1; z++) {
              const bucket = crowdGrid.get(`${x},${z}`);
              if (!bucket) continue;
              for (const other of bucket) {
                if (other.index <= enemy.index) continue;
                let dx = other.pos.x - enemy.pos.x;
                let dz = other.pos.z - enemy.pos.z;
                let distance = Math.hypot(dx, dz);
                const minimum = enemy.radius + other.radius + 0.08;
                if (distance >= minimum) continue;
                if (distance < 0.0001) {
                  const angle = (enemy.index * 2.399 + other.index) % (Math.PI * 2);
                  dx = Math.cos(angle) * 0.0001;
                  dz = Math.sin(angle) * 0.0001;
                  distance = 0.0001;
                }
                const push = (minimum - distance) * 0.62;
                dx /= distance;
                dz /= distance;
                enemy.pos.x -= dx * push;
                enemy.pos.z -= dz * push;
                other.pos.x += dx * push;
                other.pos.z += dz * push;
              }
            }
          }

          let fromPlayerX = enemy.pos.x - player.pos.x;
          let fromPlayerZ = enemy.pos.z - player.pos.z;
          let playerDistance = Math.hypot(fromPlayerX, fromPlayerZ);
          const playerMinimum = enemy.radius + 0.42;
          if (playerDistance < 0.0001) {
            const angle = enemy.index * 2.399;
            fromPlayerX = Math.cos(angle) * 0.0001;
            fromPlayerZ = Math.sin(angle) * 0.0001;
            playerDistance = 0.0001;
          }
          if (playerDistance < playerMinimum && playerDistance > 0.0001) {
            const push = playerMinimum - playerDistance;
            enemy.pos.x += fromPlayerX / playerDistance * push;
            enemy.pos.z += fromPlayerZ / playerDistance * push;
          }
        }
      }

      function updateAutoTarget(dt) {
        if (playerState.dead) {
          autoTarget = null;
          lockBreakTime = 0;
          manualTargetTime = 0;
          return;
        }
        lockBreakTime = Math.max(0, lockBreakTime - dt);
        manualTargetTime = Math.max(0, manualTargetTime - dt);
        if (tapApproach?.type === "pickup") {
          autoTarget = null;
          return;
        }
        const inputMagnitude = Math.min(1, Math.hypot(moveInput.x, moveInput.y));
        const movementX = -Math.cos(camYaw) * moveInput.x - Math.sin(camYaw) * moveInput.y;
        const movementZ = Math.sin(camYaw) * moveInput.x - Math.cos(camYaw) * moveInput.y;

        if (lockBreakTime > 0 && playerState.attackTime <= 0) {
          autoTarget = null;
          return;
        }

        let best = null;
        let bestScore = Infinity;
        if (autoTarget && !autoTarget.dead && !autoTarget.hidden &&
            (autoTarget.state === "attack" || autoTarget.state === "chase")) {
          const distance = Math.hypot(autoTarget.pos.x - player.pos.x, autoTarget.pos.z - player.pos.z);
          if (distance < (manualTargetTime > 0 ? 9 : 8.5)) {
            best = autoTarget;
            bestScore = manualTargetTime > 0
              ? -Infinity
              : distance - (autoTarget.state === "attack" ? 2.5 : 0);
          }
        }
        for (const enemy of enemies) {
          if (enemy.dead || enemy.hidden ||
              (enemy.state !== "attack" && enemy.state !== "chase")) continue;
          const distance = Math.hypot(enemy.pos.x - player.pos.x, enemy.pos.z - player.pos.z);
          if (distance > 7.5) continue;
          const score = distance - (enemy.state === "attack" ? 2.5 : 0);
          if (score < bestScore) {
            best = enemy;
            bestScore = score;
          }
        }
        autoTarget = best;
        if (!autoTarget) return;
        const targetX = autoTarget.pos.x - player.pos.x;
        const targetZ = autoTarget.pos.z - player.pos.z;
        const targetDistance = Math.max(0.001, Math.hypot(targetX, targetZ));
        if (inputMagnitude > 0.28 && playerState.attackTime <= 0) {
          const intentDot = (movementX * targetX + movementZ * targetZ) /
            (inputMagnitude * targetDistance);
          if (intentDot < 0.35) {
            autoTarget = null;
            lockBreakTime = 0.72;
            return;
          }
        }
        const desired = Math.atan2(targetX, targetZ);
        const difference = Math.atan2(Math.sin(desired - player.heading), Math.cos(desired - player.heading));
        const moving = inputMagnitude > 0.2;
        const turnSpeed = playerState.attackTime > 0 ? 13 : moving ? 3.5 : 9;
        player.heading += difference * Math.min(1, dt * turnSpeed);
        character.root.rotation.set(0, player.heading, 0);
        if (autoAttackEnabled && playerState.attackTime <= 0 &&
            playerState.interactTime <= 0 && targetDistance <= playerAttackRange()) {
          attackRequested = true;
        }
      }

      function updateEnemyHealthBars() {
        let barIndex = 0;
        const width = renderer.domElement.clientWidth;
        const height = renderer.domElement.clientHeight;
        for (const enemy of enemies) {
          const realmHidden = activeCave ? enemy.cave !== activeCave : Boolean(enemy.cave);
          if (realmHidden || enemy.dead || enemy.hidden ||
              (enemy.state !== "attack" && enemy.state !== "chase" &&
               enemy.engagedTime <= 0 && enemy !== autoTarget)) continue;
          enemyBarPoint.set(
            enemy.pos.x,
            worldHeightAt(enemy.pos.x, enemy.pos.z) + enemy.size * 1.92,
            enemy.pos.z
          ).project(camera);
          if (enemyBarPoint.z < -1 || enemyBarPoint.z > 1 ||
              Math.abs(enemyBarPoint.x) > 1.12 || Math.abs(enemyBarPoint.y) > 1.12) continue;
          const entry = enemyHealthBars[barIndex++];
          entry.bar.style.display = "block";
          const screenX = (enemyBarPoint.x * 0.5 + 0.5) * width;
          const screenY = (-enemyBarPoint.y * 0.5 + 0.5) * height;
          entry.bar.style.transform = `translate3d(${screenX}px, ${screenY}px, 0) translate(-50%, -50%)`;
          entry.bar.classList.toggle("target", enemy === autoTarget);
          entry.fill.style.transform = `scaleX(${THREE.MathUtils.clamp(enemy.hp / enemy.maxHp, 0, 1)})`;
        }
        for (; barIndex < enemyHealthBars.length; barIndex++) {
          enemyHealthBars[barIndex].bar.style.display = "none";
        }
      }

      function updateProjectiles(dt) {
        for (let index = 0; index < projectiles.length; index++) {
          const shot = projectiles[index];
          if (!shot.active) {
            projectileMesh.setMatrixAt(index, zeroMatrix);
            continue;
          }
          shot.life -= dt;
          shot.prev.copy(shot.pos);
          shot.vel.y -= 1.8 * dt;
          shot.pos.addScaledVector(shot.vel, dt);
          if (shot.life <= 0 || shot.pos.y < worldHeightAt(shot.pos.x, shot.pos.z)) shot.active = false;
          else if (shot.owner === "enemy") {
            const hitBone = playerState.dead ? null : playerArrowHitBone(shot);
            if (hitBone) {
              const damaged = damagePlayer(
                shot.damage,
                shot.prev.x,
                shot.prev.z
              );
              if (damaged) attachArrowToPlayer(shot, hitBone);
              shot.active = false;
            }
          } else {
            for (const enemy of enemies) {
              if (!enemy.dead && !enemy.hidden &&
                  Math.hypot(shot.pos.x - enemy.pos.x, shot.pos.z - enemy.pos.z) < 0.48 &&
                  Math.abs(shot.pos.y - (worldHeightAt(enemy.pos.x, enemy.pos.z) + 0.9)) < 0.75) {
                damageEnemy(enemy, shot.damage);
                shot.active = false;
                break;
              }
            }
          }

          if (!shot.active) projectileMesh.setMatrixAt(index, zeroMatrix);
          else {
            projectileDirection.copy(shot.vel).normalize();
            projectileQuaternion.setFromUnitVectors(projectileAxis, projectileDirection);
            instanceDummy.position.copy(shot.pos);
            instanceDummy.quaternion.copy(projectileQuaternion);
            instanceDummy.scale.setScalar(1);
            instanceDummy.updateMatrix();
            projectileMesh.setMatrixAt(index, instanceDummy.matrix);
          }
        }
        projectileMesh.instanceMatrix.needsUpdate = true;
      }

      function enemyFootRootY(enemy, side, angle, lift, sinHeading, cosHeading) {
        const localX = side * 0.095 * enemy.size * enemy.width;
        const localZ = -0.68 * Math.sin(angle) * enemy.size * enemy.depth;
        const footX = enemy.pos.x + cosHeading * localX + sinHeading * localZ;
        const footZ = enemy.pos.z - sinHeading * localX + cosHeading * localZ;
        return worldHeightAt(footX, footZ) + enemy.size * (0.68 * Math.cos(angle) - 0.69 - lift);
      }

      function renderEnemies() {
        for (const enemy of enemies) {
          const realmHidden = activeCave ? enemy.cave !== activeCave : Boolean(enemy.cave);
          const attackProgress = enemy.state === "attack"
            ? 1 - Math.max(0, enemy.attackTime) / (enemy.type === "archer" ? 0.85 : 0.65)
            : 0;
          const stride = enemy.moving ? Math.sin(enemy.phase) * 0.52 : 0;
          const liftWave = Math.cos(enemy.phase);
          const footLift = enemy.moving ? 0.075 : 0;
          const sinHeading = Math.sin(enemy.heading);
          const cosHeading = Math.cos(enemy.heading);
          const liftL = Math.max(0, -liftWave) * footLift;
          const liftR = Math.max(0, liftWave) * footLift;
          const rootYL = enemyFootRootY(enemy, 1, stride, liftL, sinHeading, cosHeading);
          const rootYR = enemyFootRootY(enemy, -1, -stride, liftR, sinHeading, cosHeading);
          const rootY = enemy.dead
            ? worldHeightAt(enemy.pos.x, enemy.pos.z)
            : Math.max(rootYL, rootYR);

          enemyRig.root.position.set(enemy.pos.x, rootY, enemy.pos.z);
          enemyRig.root.rotation.set(0, enemy.heading, 0);
          enemyRig.root.scale.set(
            enemy.hidden || realmHidden ? 0 : enemy.size * enemy.width,
            enemy.hidden || realmHidden ? 0 : enemy.size,
            enemy.hidden || realmHidden ? 0 : enemy.size * enemy.depth
          );

          enemyRig.skull.position.set(0, 1.52, 0);
          enemyRig.chest.position.set(0, 1.14, 0);
          enemyRig.pelvis.position.set(0, 0.74, 0);
          enemyRig.armJointL.position.set(0.23, 1.28, 0);
          enemyRig.armJointR.position.set(-0.23, 1.28, 0);
          enemyRig.legJointL.position.set(0.095, 0.69, 0);
          enemyRig.legJointR.position.set(-0.095, 0.69, 0);
          enemyRig.skull.rotation.set(0, 0, 0);
          enemyRig.chest.rotation.set(0, 0, 0);
          enemyRig.pelvis.rotation.set(0, 0, 0);
          enemyRig.armJointL.rotation.set(0, 0, 0);
          enemyRig.armJointR.rotation.set(0, 0, 0);
          enemyRig.legJointL.rotation.set(0, 0, 0);
          enemyRig.legJointR.rotation.set(0, 0, 0);
          enemyRig.weaponGrip.rotation.set(0, 0, 0);
          enemyRig.bowGrip.rotation.set(0, 0, 0);

          if (enemy.dead) {
            const t = Math.min(1.35, enemy.deathTime);
            const spread = THREE.MathUtils.smoothstep(t, 0, 0.72);
            const gravity = t * t;
            const angle = enemy.index * 2.399963;
            const scatter = (part, baseX, baseY, direction, distance, pop, floorY) => {
              part.position.set(
                baseX + Math.cos(angle + direction) * distance * spread,
                Math.max(floorY, baseY + pop * t - gravity * 2.55),
                Math.sin(angle + direction) * distance * spread
              );
            };
            scatter(enemyRig.skull, 0, 1.52, 0, 0.58, 0.82, 0.14);
            scatter(enemyRig.chest, 0, 1.14, 1.25, 0.3, 0.38, 0.17);
            scatter(enemyRig.pelvis, 0, 0.74, 2.45, 0.22, 0.18, 0.07);
            scatter(enemyRig.armJointL, 0.23, 1.28, 3.1, 0.66, 0.55, 0.5);
            scatter(enemyRig.armJointR, -0.23, 1.28, 4.15, 0.66, 0.62, 0.5);
            scatter(enemyRig.legJointL, 0.095, 0.69, 5.05, 0.45, 0.34, 0.68);
            scatter(enemyRig.legJointR, -0.095, 0.69, 5.9, 0.45, 0.3, 0.68);
            const tumble = Math.min(1, t * 1.45);
            enemyRig.skull.rotation.set(tumble * 2.2, tumble * 1.4, tumble * -1.7);
            enemyRig.chest.rotation.set(tumble * -1.1, tumble * 0.7, tumble * 1.25);
            enemyRig.pelvis.rotation.set(tumble * 0.8, tumble * -0.5, tumble * -1.05);
            enemyRig.armJointL.rotation.set(tumble * 1.8, tumble * 0.5, tumble * 1.35);
            enemyRig.armJointR.rotation.set(tumble * -1.55, tumble * -0.7, tumble * -1.6);
            enemyRig.legJointL.rotation.set(tumble * 1.15, 0, tumble * 0.72);
            enemyRig.legJointR.rotation.set(tumble * -1.05, 0, tumble * -0.82);
          } else {
            enemyRig.legJointL.position.y = 0.69 + liftL;
            enemyRig.legJointR.position.y = 0.69 + liftR;
            enemyRig.legJointL.rotation.x = stride;
            enemyRig.legJointR.rotation.x = -stride;

            let armLX = -stride;
            let armRX = stride;
            let armLZ = 0.05;
            let armRZ = -0.05;
            let bodyLean = 0;
            let weaponGripX = 0.16;
            let weaponGripZ = 0.68;
            let bowGripX = 0;

            if (enemy.type === "spear") {
              armLX = -0.34 - stride * 0.18;
              armRX = -0.28 + stride * 0.18;
              armLZ = -0.42;
              armRZ = 0.1;
              weaponGripX = 1.36;
              weaponGripZ = 0.08;
              bodyLean = 0.05;
            } else if (enemy.type === "archer") {
              armLX = -0.58;
              armRX = -0.28;
              armLZ = -0.05;
              armRZ = -0.32;
              bowGripX = 0.58;
            }

            if (enemy.state === "attack") {
              if (enemy.type === "sword") {
                const windup = THREE.MathUtils.smoothstep(attackProgress, 0, 0.36);
                const cut = THREE.MathUtils.smoothstep(attackProgress, 0.36, 0.62);
                const recover = THREE.MathUtils.smoothstep(attackProgress, 0.72, 1);
                armRZ = THREE.MathUtils.lerp(-0.05, -2.05, windup);
                armRX = THREE.MathUtils.lerp(0, -0.28, windup);
                armRZ = THREE.MathUtils.lerp(armRZ, -0.22, cut);
                armRX = THREE.MathUtils.lerp(armRX, -1.08, cut);
                armRZ = THREE.MathUtils.lerp(armRZ, -0.05, recover);
                armRX = THREE.MathUtils.lerp(armRX, 0, recover);
                const contact = cut * (1 - recover);
                enemyRig.armJointR.position.z = 0.24 * contact;
                weaponGripX = THREE.MathUtils.lerp(0.16, 2.35, contact);
                weaponGripZ = THREE.MathUtils.lerp(0.68, 0.24, cut * (1 - recover));
                bodyLean = cut * 0.16;
              } else if (enemy.type === "spear") {
                const thrust = Math.sin(attackProgress * Math.PI);
                armRX = THREE.MathUtils.lerp(-0.28, -1.44, thrust);
                armRZ = THREE.MathUtils.lerp(0.1, -0.04, thrust);
                armLX = THREE.MathUtils.lerp(-0.34, -1.2, thrust);
                armLZ = THREE.MathUtils.lerp(-0.42, -0.22, thrust);
                weaponGripX = THREE.MathUtils.lerp(1.36, 3.0, thrust);
                bodyLean = 0.05 + thrust * 0.24;
              } else {
                const draw = THREE.MathUtils.smoothstep(attackProgress, 0, 0.48);
                const release = THREE.MathUtils.smoothstep(attackProgress, 0.56, 0.78);
                const recover = THREE.MathUtils.smoothstep(attackProgress, 0.82, 1);
                const hold = draw * (1 - release);
                const aim = draw * (1 - recover);
                armLX = THREE.MathUtils.lerp(-0.58, -1.32, aim);
                armRX = THREE.MathUtils.lerp(-0.28, -0.72, hold);
                armLZ = -0.05;
                armRZ = -0.92 * hold;
                bowGripX = -armLX;
                bodyLean = -hold * 0.08;
              }
            }

            enemyRig.armJointL.rotation.set(armLX, 0, armLZ);
            enemyRig.armJointR.rotation.set(armRX, 0, armRZ);
            enemyRig.weaponGrip.rotation.set(weaponGripX, 0, weaponGripZ);
            enemyRig.bowGrip.rotation.x = bowGripX;
            enemyRig.chest.rotation.set(
              bodyLean,
              0,
              enemy.hurtTime > 0 ? Math.sin(enemy.hurtTime * 45) * 0.12 : 0
            );
            enemyRig.skull.rotation.y = enemy.moving ? Math.sin(enemy.phase * 0.5) * 0.055 : 0;
          }
          enemyRig.root.updateMatrixWorld(true);

          enemyMeshes.skull.setMatrixAt(enemy.index, enemyRig.skull.matrixWorld);
          enemyMeshes.sockets.setMatrixAt(enemy.index, enemyRig.skull.matrixWorld);
          enemyMeshes.chest.setMatrixAt(enemy.index, enemyRig.chest.matrixWorld);
          enemyMeshes.pelvis.setMatrixAt(enemy.index, enemyRig.pelvis.matrixWorld);
          enemyMeshes.armL.setMatrixAt(enemy.index, enemyRig.armL.matrixWorld);
          enemyMeshes.armR.setMatrixAt(enemy.index, enemyRig.armR.matrixWorld);
          enemyMeshes.legL.setMatrixAt(enemy.index, enemyRig.legL.matrixWorld);
          enemyMeshes.legR.setMatrixAt(enemy.index, enemyRig.legR.matrixWorld);
          enemyMeshes.sword.setMatrixAt(enemy.index, enemy.type === "sword" ? enemyRig.sword.matrixWorld : zeroMatrix);
          enemyMeshes.swordHandle.setMatrixAt(enemy.index, enemy.type === "sword" ? enemyRig.swordHandle.matrixWorld : zeroMatrix);
          enemyMeshes.swordGuard.setMatrixAt(enemy.index, enemy.type === "sword" ? enemyRig.swordGuard.matrixWorld : zeroMatrix);
          enemyMeshes.spear.setMatrixAt(enemy.index, enemy.type === "spear" ? enemyRig.spear.matrixWorld : zeroMatrix);
          enemyMeshes.spearTip.setMatrixAt(enemy.index, enemy.type === "spear" ? enemyRig.spearTip.matrixWorld : zeroMatrix);
          enemyMeshes.bow.setMatrixAt(enemy.index, enemy.type === "archer" ? enemyRig.bow.matrixWorld : zeroMatrix);
          enemyMeshes.bowString.setMatrixAt(enemy.index, enemy.type === "archer" ? enemyRig.bowString.matrixWorld : zeroMatrix);
        }
        enemyMeshList.forEach((mesh) => (mesh.instanceMatrix.needsUpdate = true));
      }
      function updateWorld(dt) {
        updateEnemies(dt);
        resolveEnemyCollisions();
        updateAutoTarget(dt);
        updatePlayerState(dt);
        updateProjectiles(dt);
        updateStuckArrows();
        updateBlood(dt);
        refreshOreNodes(dt);
        updateMiningEffects(dt);
        renderEnemies();
      }
      renderEnemies();

      // ---------------------------------------------------------------
      // Camera follow
      // ---------------------------------------------------------------
      const camTarget = new THREE.Vector3();
      const desiredCamPos = new THREE.Vector3();
      const cameraCollisionProbe = new THREE.Vector3();
      const cameraCollisionResult = new THREE.Vector3();

      function constrainCaveCamera(target, candidate, result) {
        // `candidate` and `result` may be the same vector. Preserve the
        // desired point before initializing the result or the camera snaps
        // directly onto the player.
        const candidateX = candidate.x;
        const candidateY = candidate.y;
        const candidateZ = candidate.z;
        result.copy(target);
        const dx = candidateX - target.x;
        const dy = candidateY - target.y;
        const dz = candidateZ - target.z;
        const distance = Math.hypot(dx, dy, dz);
        // Keep a camera-sized buffer from generated walls. Near an edge the
        // player capsule's smaller valid margin prevents collapsing the
        // camera all the way into the character.
        const collisionMargin = activeCave.containsWorld(target.x, target.z, 0.5)
          ? 0.5
          : 0.3;
        const samples = Math.max(2, Math.ceil(distance / 0.16));
        for (let index = 1; index <= samples; index++) {
          const t = index / samples;
          const x = target.x + dx * t;
          const z = target.z + dz * t;
          if (!activeCave.containsWorld(x, z, collisionMargin)) break;
          result.set(
            x,
            THREE.MathUtils.clamp(target.y + dy * t, 0.72, activeCave.cameraMaxY),
            z
          );
        }
        return result;
      }

      function updateCamera(dt) {
        const followDistance = activeCave ? CAVE_CAM_DIST : CAM_DIST;
        const followHeight = activeCave ? CAVE_CAM_HEIGHT : CAM_HEIGHT;
        camTarget.set(player.pos.x, player.pos.y + followHeight, player.pos.z);

        const horizDist = followDistance * Math.cos(camPitch);
        const height = followDistance * Math.sin(camPitch) + followHeight;

        desiredCamPos.set(
          player.pos.x + Math.sin(camYaw + Math.PI) * horizDist,
          player.pos.y + height,
          player.pos.z + Math.cos(camYaw + Math.PI) * horizDist
        );

        if (activeCave) constrainCaveCamera(camTarget, desiredCamPos, desiredCamPos);
        if (cameraSnapRequested) {
          camera.position.copy(desiredCamPos);
          cameraSnapRequested = false;
        } else if (activeCave) {
          cameraCollisionProbe.copy(camera.position).lerp(desiredCamPos, Math.min(1, dt * 10));
          constrainCaveCamera(camTarget, cameraCollisionProbe, cameraCollisionResult);
          camera.position.copy(cameraCollisionResult);
        } else camera.position.lerp(desiredCamPos, Math.min(1, dt * 8));
        camera.lookAt(camTarget);

        sun.target.position.copy(character.root.position);
        sun.position.copy(character.root.position).add(sunOffset);
      }

      // Keeps at most MAX_ACTIVE_LANTERN_LIGHTS real PointLights shading the
      // scene at once, picking whichever clearing lanterns are nearest the
      // player; the rest stay dark but keep their glow sprite/ground decal.
      let lanternCullTimer = 0;
      function updateActiveLanternLights() {
        if (activeCave) return;
        const sorted = [...flickeringLights].sort((a, b) =>
          a.position.distanceToSquared(player.pos) - b.position.distanceToSquared(player.pos)
        );
        sorted.forEach((light, index) => {
          light.visible = index < MAX_ACTIVE_LANTERN_LIGHTS;
        });
      }

      // ---------------------------------------------------------------
      // Main loop
      // ---------------------------------------------------------------
      const clock = new THREE.Clock();
      let started = false;

      function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(0.05, clock.getDelta());
        updatePlayer(dt);
        updateDayNightCycle(dt);
        updateFogCards(dt);
        updateCavePortals(dt);
        updateWorld(dt);
        updateCamera(dt);
        updateMoveDestinationMarker();
        updateBirds(dt);
        mainCaveDecor.update(dt);
        updateEnemyHealthBars();
        cloudGroup.rotation.y += dt * 0.0018;
        stars.rotation.y -= dt * 0.00035;
        if (playerState.hasLantern) {
          character.lanternLight.intensity = 14.2
            + Math.sin(clock.elapsedTime * 9.7) * 0.7
            + Math.sin(clock.elapsedTime * 17.3) * 0.35;
        }
        lanternCullTimer += dt;
        if (lanternCullTimer > 0.25) {
          lanternCullTimer = 0;
          updateActiveLanternLights();
        }
        flickeringLights.forEach((light) => {
          if (!light.visible) return;
          const t = clock.elapsedTime * 8.3 + light.userData.flickerSeed;
          const flicker = Math.sin(t) * 0.55 + Math.sin(t * 2.7 + 1.3) * 0.3 + Math.sin(t * 5.1) * 0.15;
          const nightGlow = activeCave ? 1 : 1 - daylightStrength;
          light.intensity = (light.userData.baseIntensity + flicker)
            * THREE.MathUtils.lerp(0.08, 1, nightGlow);
          const glowSprite = light.children[0];
          if (glowSprite?.material) {
            glowSprite.material.opacity = THREE.MathUtils.lerp(0.12, 1, nightGlow);
          }
        });
        litGroundPools.forEach((pool) => {
          const t = clock.elapsedTime * 8.3 + pool.userData.flickerSeed;
          const flicker = Math.sin(t) * 0.55 + Math.sin(t * 2.7 + 1.3) * 0.3 + Math.sin(t * 5.1) * 0.15;
          const s = pool.userData.baseScale * (1 + flicker * 0.035);
          pool.scale.set(s, s, 1);
          const nightGlow = activeCave ? 1 : 1 - daylightStrength;
          pool.material.opacity = THREE.MathUtils.lerp(0.1, 0.85, nightGlow)
            + flicker * 0.08 * nightGlow;
        });
        updateCaveBounceLighting(clock.elapsedTime);
        cinematicPass.uniforms.grain.value += dt * 31;
        composer.render(dt);

        if (!started) {
          started = true;
          document.getElementById("loading").classList.add("hide");
        }
      }
      animate();
    </script>
  </body>
</html>
