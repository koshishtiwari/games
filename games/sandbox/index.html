        { x: 0, z: 0, radius: 48, altitude: 16.4, angle: 5.5, speed: -0.06 },
      ];
      const birds = Array.from({ length: BIRD_COUNT }, (_, index) => {
        const perched = index < 8;
        const caveArea = index >= BASE_BIRD_COUNT;
        const flock = Math.max(0, index - 8) % birdFlocks.length;
        const portal = caveArea
          ? ((index - BASE_BIRD_COUNT) % 2 === 0
            ? mainCave.entranceOutdoor
            : mainCave.exitOutdoor)
          : null;
        return {
          perched,
          caveArea,
          perch: perched ? forestPerches[(index * 5 + 3) % forestPerches.length] : null,
          perchHeading: birdRng() * Math.PI * 2,
          flock,
          angleOffset: (Math.floor(Math.max(0, index - 8) / birdFlocks.length) - 1.5) * 0.07
            + (birdRng() - 0.5) * 0.045,
          radiusOffset: (birdRng() - 0.5) * (flock < 2 ? 4.2 : 3.2),
          altitudeOffset: (birdRng() - 0.5) * (flock < 2 ? 3.4 : 2.8),
          centerX: portal?.x ?? 0,
          centerY: portal?.y ?? 0,
          centerZ: portal?.z ?? 0,
          caveRadius: 5.2 + birdRng() * 5.5,
          caveAltitude: 4.1 + birdRng() * 4.8,
          caveSpeed: (0.16 + birdRng() * 0.13) * (index % 2 ? -1 : 1),
          phase: birdRng() * Math.PI * 2,
          scale: 0.48 + birdRng() * 0.34,
        };
      });
      let birdTime = 0;

      function updateBirds(dt) {
        birdTime += dt;
        for (const flock of birdFlocks) flock.angle += flock.speed * dt;
        for (let index = 0; index < birds.length; index++) {
          const bird = birds[index];
          const flock = birdFlocks[bird.flock];
          const angle = flock.angle + bird.angleOffset;
          const radius = flock.radius + bird.radiusOffset;
          if (bird.perched) {
            birdRoot.position.copy(bird.perch);
            birdRoot.position.y += Math.sin(birdTime * 1.1 + bird.phase) * 0.025;
            birdRoot.rotation.set(0, bird.perchHeading, 0);
          } else if (bird.caveArea) {
            const caveAngle = bird.phase + birdTime * bird.caveSpeed;
            birdRoot.position.set(
              bird.centerX + Math.cos(caveAngle) * bird.caveRadius,
              bird.centerY + bird.caveAltitude + Math.sin(birdTime * 1.35 + bird.phase) * 0.34,
              bird.centerZ + Math.sin(caveAngle) * bird.caveRadius * 0.72
            );
            const heading = -caveAngle + (bird.caveSpeed < 0 ? Math.PI : 0);
            birdRoot.rotation.set(0, heading, THREE.MathUtils.clamp(bird.caveSpeed * -0.75, -0.2, 0.2));
          } else {
            birdRoot.position.set(
              flock.x + Math.cos(angle) * radius,
              flock.altitude + bird.altitudeOffset + Math.sin(birdTime * 1.4 + bird.phase) * 0.42,
              flock.z + Math.sin(angle) * radius
            );
            const heading = -angle + (flock.speed < 0 ? Math.PI : 0);
            birdRoot.rotation.set(0, heading, THREE.MathUtils.clamp(flock.speed * -1.8, -0.2, 0.2));
          }
          birdRoot.scale.setScalar(bird.scale);
          const flap = bird.perched
            ? Math.sin(birdTime * 1.7 + bird.phase) * 0.035
            : Math.sin(birdTime * 8.5 + bird.phase) * 0.58;
          birdWingL.rotation.set(0, 0, flap);
          birdWingR.rotation.set(0, 0, -flap);
          birdRoot.updateMatrixWorld(true);
          birdLeftWings.setMatrixAt(index, birdWingL.matrixWorld);
          birdRightWings.setMatrixAt(index, birdWingR.matrixWorld);
          birdBodies.setMatrixAt(index, birdBody.matrixWorld);
        }
        birdLeftWings.instanceMatrix.needsUpdate = true;
        birdRightWings.instanceMatrix.needsUpdate = true;
        birdBodies.instanceMatrix.needsUpdate = true;
      }
      updateBirds(0);

      const outdoorEnvironmentMeshes = [
        ground, groundPatches, grassClumps, fallenLogs, mushroomStems, mushroomCaps,
        lanternPosts, lanternTops, lanternLamps, ...litGroundPools,
        pineTrunks, pineCrowns, heroPineTrunks, heroPineCrowns,
        broadleafTrunks, broadleafCrowns, heroBroadleafTrunks, heroBroadleafCrowns,
        understory, rocks, caveMouth, entranceRockMesh,
        caveTrailPosts, caveTrailLamps,
        caveExitMouth, exitRockMesh,
      ];

      // ---------------------------------------------------------------
      // Character: compact block farmer. Shared geometry and materials keep
      // the model cheap to draw and the silhouette readable at game scale.
      // ---------------------------------------------------------------
      const UPPER_LEG_LENGTH = 0.5;
      const LOWER_LEG_LENGTH = 0.42;
      const LEG_LENGTH = UPPER_LEG_LENGTH + LOWER_LEG_LENGTH;
      const BASE_HIPS_Y = LEG_LENGTH;
      const blockMaterial = (color) =>
        new THREE.MeshStandardMaterial({ color, roughness: 0.92, flatShading: true });

      function createAxeHeadGeometry() {
        const blade = new THREE.Shape();
        blade.moveTo(-0.14, -0.085);
        blade.lineTo(-0.14, 0.085);
        blade.lineTo(0.08, 0.055);
        blade.lineTo(0.08, -0.055);
        blade.closePath();
        const geometry = new THREE.ExtrudeGeometry(blade, {
          depth: 0.06,
          bevelEnabled: false,
          steps: 1,
        });
        geometry.translate(0, 0, -0.03);
        return geometry;
      }

      const MAT = {
        skin: blockMaterial(0xd99a68),
        hair: blockMaterial(0x4b3023),
        shirt: blockMaterial(0xc9783e),
        denim: blockMaterial(0x3f6f8a),
        denimDark: blockMaterial(0x294e64),
        boot: blockMaterial(0x513426),
        straw: blockMaterial(0xd6ad4f),
        hatBand: blockMaterial(0x74432d),
        face: blockMaterial(0x2b2420),
        metal: blockMaterial(0xe2c36f),
        wood: blockMaterial(0x7a5534),
        steel: blockMaterial(0x9da5a2),
      };

      const GEO = {
        pelvis: new THREE.BoxGeometry(0.42, 0.18, 0.24),
        torso: new THREE.BoxGeometry(0.5, 0.54, 0.26),
        bib: new THREE.BoxGeometry(0.3, 0.31, 0.025),
        strap: new THREE.BoxGeometry(0.055, 0.38, 0.025),
        button: new THREE.BoxGeometry(0.035, 0.035, 0.018),
        head: new THREE.BoxGeometry(0.36, 0.36, 0.34),
        hair: new THREE.BoxGeometry(0.34, 0.24, 0.05),
        eye: new THREE.BoxGeometry(0.045, 0.055, 0.018),
        mouth: new THREE.BoxGeometry(0.11, 0.025, 0.018),
        brim: new THREE.BoxGeometry(0.5, 0.045, 0.42),
        crown: new THREE.BoxGeometry(0.34, 0.16, 0.3),
        band: new THREE.BoxGeometry(0.35, 0.055, 0.31),
        arm: new THREE.BoxGeometry(0.16, 0.56, 0.17),
        hand: new THREE.BoxGeometry(0.17, 0.17, 0.18),
        upperLeg: new THREE.BoxGeometry(0.2, UPPER_LEG_LENGTH, 0.23),
        lowerLeg: new THREE.BoxGeometry(0.19, 0.26, 0.21),
        boot: new THREE.BoxGeometry(0.21, 0.18, 0.34),
        stick: new THREE.BoxGeometry(0.055, 0.62, 0.055),
        axeHead: createAxeHeadGeometry(),
        pickaxeHead: new THREE.BoxGeometry(0.58, 0.075, 0.085),
        pickaxeTip: new THREE.ConeGeometry(0.075, 0.23, 4),
        arrow: new THREE.BoxGeometry(0.035, 0.62, 0.035),
      };

      const character = buildBlockFarmer();
      scene.add(character.root);

      // Cheap dynamic indirect lighting: these non-shadowed probes mimic the
      // lantern reflecting from the floor, the wall ahead, and high cavern
      // haze. They are only enabled inside a cave.
      const caveBounceGround = new THREE.PointLight(0xc97838, 2.8, 10.5, 2);
      const caveBounceForward = new THREE.PointLight(0xe3a15f, 3.2, 9.5, 2);
      const caveBounceCeiling = new THREE.PointLight(0x789b96, 2.25, 18, 2);
      const caveBounceLights = [caveBounceGround, caveBounceForward, caveBounceCeiling];
      caveBounceLights.forEach((light) => {
        light.visible = false;
        light.castShadow = false;
        scene.add(light);
      });
      const caveMoonFill = new THREE.HemisphereLight(0x8db7df, 0x07101b, 0.42);
      caveMoonFill.visible = false;
      scene.add(caveMoonFill);

      function updateCaveBounceLighting(time) {
        if (!activeCave) return;
        const forwardX = Math.sin(player.heading);
        const forwardZ = Math.cos(player.heading);
        caveBounceGround.position.set(player.pos.x, 0.18, player.pos.z);
        caveBounceForward.position.set(
          player.pos.x + forwardX * 3.1,
          1.05,
          player.pos.z + forwardZ * 3.1
        );
        caveBounceCeiling.position.set(
          player.pos.x - forwardX * 0.8,
          Math.min(8.5, activeCave.ceilingHeight * 0.3),
          player.pos.z - forwardZ * 0.8
        );
        caveBounceGround.intensity = 2.65 + Math.sin(time * 7.1) * 0.18;
        caveBounceForward.intensity = 3.05 + Math.sin(time * 5.3 + 1.7) * 0.24;
        caveBounceCeiling.intensity = 2.15 + Math.sin(time * 3.9 + 0.4) * 0.14;
      }

      function buildBlockFarmer() {
        const root = new THREE.Group();
        root.name = "BlockFarmer";

        function mesh(parent, geometry, material, x, y, z, shadows = true) {
          const item = new THREE.Mesh(geometry, material);
          item.position.set(x, y, z);
          item.castShadow = shadows;
          item.receiveShadow = shadows;
          parent.add(item);
          return item;
        }

        const hips = new THREE.Bone();
        hips.position.y = BASE_HIPS_Y;
        root.add(hips);

        const body = new THREE.Bone();
        body.position.y = 0.18;
        hips.add(body);

        const head = new THREE.Bone();
        head.position.y = 0.72;
        body.add(head);

        function makeArm(side) {
          const sign = side === "L" ? 1 : -1;
          const bone = new THREE.Bone();
          bone.position.set(sign * 0.34, 0.48, 0);
          body.add(bone);
          mesh(bone, GEO.arm, MAT.shirt, 0, -0.28, 0);
          mesh(bone, GEO.hand, MAT.skin, 0, -0.65, 0.015);
          return bone;
        }

        function makeLeg(side) {
          const sign = side === "L" ? 1 : -1;
          const upper = new THREE.Bone();
          upper.position.set(sign * 0.12, 0, 0);
          hips.add(upper);
          const lower = new THREE.Bone();
          lower.position.y = -UPPER_LEG_LENGTH;
          upper.add(lower);
          mesh(upper, GEO.upperLeg, MAT.denim, 0, -UPPER_LEG_LENGTH * 0.5, 0);
          mesh(lower, GEO.lowerLeg, MAT.denim, 0, -0.13, 0);
          mesh(lower, GEO.boot, MAT.boot, 0, -0.33, 0.055);
          const sole = new THREE.Object3D();
          sole.position.set(0, -LOWER_LEG_LENGTH, 0);
          lower.add(sole);
          return { bone: upper, upper, lower, sole, baseX: sign * 0.12 };
        }

        const armL = makeArm("L");
        const armR = makeArm("R");
        const legL = makeLeg("L");
        const legR = makeLeg("R");

        const equipment = {};
        const heldRoot = new THREE.Group();
        heldRoot.position.set(0, -0.66, 0.11);
        heldRoot.rotation.x = 0.08;
        armR.add(heldRoot);
        equipment.stick = new THREE.Group();
        mesh(equipment.stick, GEO.stick, MAT.wood, 0, 0.2, 0);
        equipment.stick.rotation.z = 0.42;
        heldRoot.add(equipment.stick);
        equipment.axe = new THREE.Group();
        mesh(equipment.axe, GEO.stick, MAT.wood, 0, 0.19, 0);
        const axeHeadPivot = new THREE.Group();
        axeHeadPivot.position.set(0, 0.49, 0.075);
        equipment.axe.add(axeHeadPivot);
        const axeHead = mesh(axeHeadPivot, GEO.axeHead, MAT.steel, 0, 0, 0);
        axeHead.rotation.y = Math.PI / 2;
        equipment.axe.userData.headPivot = axeHeadPivot;
        equipment.axe.rotation.z = 0.55;
        heldRoot.add(equipment.axe);
        equipment.pickaxe = new THREE.Group();
        mesh(equipment.pickaxe, GEO.stick, MAT.wood, 0, 0.19, 0);
        const pickaxeHeadPivot = new THREE.Group();
        pickaxeHeadPivot.position.set(0, 0.5, 0);
        equipment.pickaxe.add(pickaxeHeadPivot);
        mesh(pickaxeHeadPivot, GEO.pickaxeHead, MAT.steel, 0, 0, 0);
        const pickTipL = mesh(pickaxeHeadPivot, GEO.pickaxeTip, MAT.steel, 0.39, 0, 0);
        const pickTipR = mesh(pickaxeHeadPivot, GEO.pickaxeTip, MAT.steel, -0.39, 0, 0);
        pickTipL.rotation.z = -Math.PI * 0.5;
        pickTipR.rotation.z = Math.PI * 0.5;
        equipment.pickaxe.userData.headPivot = pickaxeHeadPivot;
        equipment.pickaxe.rotation.z = 0.48;
        heldRoot.add(equipment.pickaxe);
        equipment.arrow = new THREE.Group();
        mesh(equipment.arrow, GEO.arrow, MAT.wood, 0, 0.2, 0);
        mesh(equipment.arrow, GEO.button, MAT.steel, 0, 0.53, 0);
        heldRoot.add(equipment.arrow);
        Object.values(equipment).forEach((item) => (item.visible = false));

        const lantern = new THREE.Group();
        lantern.position.set(0, -0.67, 0.11);
        lantern.rotation.z = 0.06;
        armL.add(lantern);
        const lanternHandle = mesh(
          lantern,
          new THREE.TorusGeometry(0.13, 0.018, 4, 9, Math.PI),
          MAT.metal,
          0,
          0.14,
          0
        );
        lanternHandle.rotation.z = Math.PI;
        mesh(lantern, new THREE.BoxGeometry(0.17, 0.22, 0.15), lanternGlowMaterial, 0, -0.015, 0);
        mesh(lantern, new THREE.BoxGeometry(0.22, 0.035, 0.2), MAT.hair, 0, -0.14, 0);
        mesh(lantern, new THREE.BoxGeometry(0.2, 0.035, 0.18), MAT.hair, 0, 0.11, 0);
        const lanternLight = new THREE.PointLight(0xffb05a, 14.2, 19, 2);
        lanternLight.position.set(0, 0.02, 0.08);
        lanternLight.castShadow = false;
        lanternLight.add(createFlameGlowSprite(0.55));
        lantern.add(lanternLight);
        lantern.visible = false;

        mesh(hips, GEO.pelvis, MAT.denimDark, 0, 0.07, 0);
        mesh(body, GEO.torso, MAT.shirt, 0, 0.27, 0);
        mesh(body, GEO.bib, MAT.denim, 0, 0.24, 0.143);
        mesh(body, GEO.strap, MAT.denim, 0.155, 0.35, 0.145);
        mesh(body, GEO.strap, MAT.denim, -0.155, 0.35, 0.145);
        mesh(body, GEO.button, MAT.metal, 0.155, 0.48, 0.165, false);
        mesh(body, GEO.button, MAT.metal, -0.155, 0.48, 0.165, false);
        mesh(body, new THREE.BoxGeometry(0.53, 0.085, 0.285), MAT.hair, 0, 0.035, 0);
        mesh(body, new THREE.BoxGeometry(0.105, 0.095, 0.035), MAT.metal, 0, 0.035, 0.16, false);
        const shoulderSash = mesh(
          body,
          new THREE.BoxGeometry(0.065, 0.66, 0.025),
          MAT.hair,
          0,
          0.29,
          0.158
        );
        shoulderSash.rotation.z = -0.54;

        mesh(head, GEO.head, MAT.skin, 0, 0, 0);
        mesh(head, GEO.hair, MAT.hair, 0, 0.015, -0.17);
        mesh(head, GEO.eye, MAT.face, 0.075, 0.045, 0.178, false);
        mesh(head, GEO.eye, MAT.face, -0.075, 0.045, 0.178, false);
        mesh(head, GEO.mouth, MAT.face, 0, -0.095, 0.179, false);
        mesh(head, GEO.brim, MAT.straw, 0, 0.18, 0);
        mesh(head, GEO.crown, MAT.straw, 0, 0.275, -0.015);
        mesh(head, GEO.band, MAT.hatBand, 0, 0.225, -0.015);

        return { root, equipment, lantern, lanternLight, bones: { hips, body, head, armL, armR, legL, legR } };
      }

      // ---------------------------------------------------------------
      // Distance-matched block animation. A full gait cycle advances by the
      // physical stride length, preventing speed-dependent foot skating.
      // ---------------------------------------------------------------
      const bones = character.bones;
      const targetEuler = new THREE.Euler();
      const targetQuaternion = new THREE.Quaternion();
      const soleWorldL = new THREE.Vector3();
      const soleWorldR = new THREE.Vector3();
      const stanceAnchor = new THREE.Vector3();
      const anchorLocal = new THREE.Vector3();
      let gaitPhase = 0;
      let moveBlend = 0;
      let runBlend = 0;
      let turnBlend = 0;
      let idleTime = 0;
      let stanceSide = null;

      function rotateBone(bone, x, y, z, alpha) {
        targetEuler.set(x, y, z);
        targetQuaternion.setFromEuler(targetEuler);
        bone.quaternion.slerp(targetQuaternion, alpha);
      }

      function soleCorrection(contact, target) {
        contact.getWorldPosition(target);
        return worldHeightAt(target.x, target.z) + 0.003 - target.y;
      }

      function plantLowestSole() {
        character.root.updateMatrixWorld(true);
        const correction = Math.max(
          soleCorrection(bones.legL.sole, soleWorldL),
          soleCorrection(bones.legR.sole, soleWorldR)
        );
        bones.hips.position.y += THREE.MathUtils.clamp(correction, -0.1, 0.1);
      }

      function lockStance(side, amplitude) {
        const leg = side === "L" ? bones.legL : bones.legR;
        if (stanceSide !== side || Math.abs(turnBlend) > 0.65) {
          character.root.updateMatrixWorld(true);
          anchorLocal.set(leg.baseX, 0, LEG_LENGTH * Math.sin(amplitude));
          stanceAnchor.copy(anchorLocal);
          character.root.localToWorld(stanceAnchor);
          stanceAnchor.y = worldHeightAt(stanceAnchor.x, stanceAnchor.z) + 0.003;
          stanceSide = side;
        }

        anchorLocal.copy(stanceAnchor);
        character.root.worldToLocal(anchorLocal);
        const angle = -Math.asin(THREE.MathUtils.clamp(anchorLocal.z / LEG_LENGTH, -0.82, 0.82));
        leg.bone.rotation.set(angle, 0, 0);
        leg.lower.rotation.set(0, 0, 0);
      }

      function poseIdle(alpha) {
        stanceSide = null;
        const breathe = Math.sin(idleTime * 1.8) * 0.008;
        bones.hips.position.y = THREE.MathUtils.lerp(bones.hips.position.y, BASE_HIPS_Y, alpha);
        bones.legL.bone.position.set(bones.legL.baseX, 0, 0);
        bones.legR.bone.position.set(bones.legR.baseX, 0, 0);
        rotateBone(bones.legL.bone, 0, 0, 0, alpha);
        rotateBone(bones.legR.bone, 0, 0, 0, alpha);
        rotateBone(bones.legL.lower, 0, 0, 0, alpha);
        rotateBone(bones.legR.lower, 0, 0, 0, alpha);
        rotateBone(bones.armL, 0, 0, 0.035, alpha);
        rotateBone(bones.armR, 0, 0, -0.035, alpha);
        rotateBone(bones.body, breathe, 0, 0, alpha);
        rotateBone(bones.head, -breathe, Math.sin(idleTime * 0.45) * 0.035, 0, alpha);
        plantLowestSole();
      }

      function poseLocomotion(alpha) {
        const swing = Math.sin(gaitPhase);
        const liftWave = Math.cos(gaitPhase);
        const amplitude = THREE.MathUtils.lerp(0.48, 0.72, runBlend) * moveBlend;
        const lift = THREE.MathUtils.lerp(0.055, 0.095, runBlend) * moveBlend;
        const lean = THREE.MathUtils.lerp(0.025, 0.085, runBlend) * moveBlend;
        const sway = Math.cos(gaitPhase) * 0.025 * moveBlend;

        bones.hips.position.y = THREE.MathUtils.lerp(bones.hips.position.y, BASE_HIPS_Y, alpha);
        bones.legL.bone.position.set(bones.legL.baseX, Math.max(0, -liftWave) * lift, 0);
        bones.legR.bone.position.set(bones.legR.baseX, Math.max(0, liftWave) * lift, 0);
        bones.legL.bone.rotation.set(swing * amplitude, 0, 0);
        bones.legR.bone.rotation.set(-swing * amplitude, 0, 0);
        bones.legL.lower.rotation.set(Math.max(0, -liftWave) * 0.42 * moveBlend, 0, 0);
        bones.legR.lower.rotation.set(Math.max(0, liftWave) * 0.42 * moveBlend, 0, 0);
        rotateBone(bones.armL, -swing * amplitude * 0.85, 0, 0.035, alpha);
        rotateBone(bones.armR, swing * amplitude * 0.85, 0, -0.035, alpha);
        rotateBone(bones.body, lean, turnBlend * 0.09, -sway, alpha);
        rotateBone(bones.head, -lean * 0.55, -turnBlend * 0.07, sway * 0.35, alpha);
        lockStance(liftWave >= 0 ? "L" : "R", amplitude);
        plantLowestSole();
      }

      function poseAirborne(alpha, verticalSpeed) {
        stanceSide = null;
        const rising = THREE.MathUtils.clamp(verticalSpeed / 6.2, -1, 1);
        bones.hips.position.y = THREE.MathUtils.lerp(bones.hips.position.y, BASE_HIPS_Y, alpha);
        bones.legL.bone.position.set(bones.legL.baseX, 0.045, 0);
        bones.legR.bone.position.set(bones.legR.baseX, 0.065, 0);
        rotateBone(bones.legL.bone, -0.28, 0, 0, alpha);
        rotateBone(bones.legR.bone, 0.2, 0, 0, alpha);
        rotateBone(bones.legL.lower, 0.48, 0, 0, alpha);
        rotateBone(bones.legR.lower, 0.38, 0, 0, alpha);
        rotateBone(bones.armL, -0.9 - rising * 0.15, 0, 0.12, alpha);
        rotateBone(bones.armR, -0.9 - rising * 0.15, 0, -0.12, alpha);
        rotateBone(bones.body, -0.055, turnBlend * 0.08, 0, alpha);
        rotateBone(bones.head, 0.045, -turnBlend * 0.06, 0, alpha);
      }

      function updateAnimation(dt, distanceMoved, isRunning, grounded, verticalSpeed, turnAmount) {
        const moving = distanceMoved > 0.00005;
        moveBlend += ((moving ? 1 : 0) - moveBlend) * Math.min(1, dt * 9);
        runBlend += ((isRunning ? 1 : 0) - runBlend) * Math.min(1, dt * 7);
        turnBlend += (turnAmount - turnBlend) * Math.min(1, dt * 10);
        idleTime += dt;

        if (grounded && moving) {
          const amplitude = THREE.MathUtils.lerp(0.48, 0.72, runBlend);
          const cycleDistance = 4 * LEG_LENGTH * Math.sin(amplitude);
          gaitPhase = (gaitPhase + distanceMoved * Math.PI * 2 / cycleDistance) % (Math.PI * 2);
        }

        const alpha = 1 - Math.exp(-dt * 12);
        if (!grounded) poseAirborne(alpha, verticalSpeed);
        else if (moveBlend > 0.035) poseLocomotion(alpha);
        else poseIdle(alpha);
        applyPlayerActionPose(alpha);
      }

      // ---------------------------------------------------------------
      // Controls: left-30% virtual joystick for movement,
      // right-70% drag for camera orbit, right-side action buttons.
      // ---------------------------------------------------------------
      const moveZone = document.getElementById("moveZone");
      const camZone = document.getElementById("camZone");
      const stick = document.getElementById("stick");
      const stickKnob = document.getElementById("stickKnob");
      const jumpBtn = document.getElementById("jumpBtn");
      const attackBtn = document.getElementById("attackBtn");
      const autoAttackBtn = document.getElementById("autoAttackBtn");
      const healthFill = document.getElementById("healthFill");
      const equipmentLabel = document.getElementById("equipmentLabel");
      const effectLabel = document.getElementById("effectLabel");
      const gemPouch = document.getElementById("gemPouch");
      const gemPouchEntries = [...gemPouch.querySelectorAll("[data-gem]")];
      const prompt = document.getElementById("prompt");
      const worldMarker = document.getElementById("worldMarker");
      const damageFlash = document.getElementById("damageFlash");
      const deathLabel = document.getElementById("deathLabel");
      const enemyHealthLayer = document.getElementById("enemyHealthLayer");
      const worldClockTime = document.getElementById("worldClockTime");
      const worldClockPhase = document.getElementById("worldClockPhase");

      const moveInput = { x: 0, y: 0 };
      let jumpRequested = false;
      let attackRequested = false;
      let autoAttackEnabled = true;

      const STICK_RADIUS = 48;
      let movePointerId = null;
      let moveDragged = false;
      const stickOrigin = { x: 0, y: 0 };

      function updateStick(x, y) {
        let dx = x - stickOrigin.x;
        let dy = y - stickOrigin.y;
        const distance = Math.hypot(dx, dy);
        if (distance > STICK_RADIUS) {
          dx *= STICK_RADIUS / distance;
          dy *= STICK_RADIUS / distance;
        }
        stickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
        moveInput.x = dx / STICK_RADIUS;
        moveInput.y = dy / STICK_RADIUS;
      }

      moveZone.addEventListener("pointerdown", (e) => {
        if (movePointerId !== null) return;
        movePointerId = e.pointerId;
        moveZone.setPointerCapture?.(e.pointerId);
        stickOrigin.x = e.clientX;
        stickOrigin.y = e.clientY;
        moveDragged = false;
        stick.style.left = e.clientX - STICK_RADIUS + "px";
        stick.style.top = e.clientY - STICK_RADIUS + "px";
        stick.classList.add("active");
        updateStick(e.clientX, e.clientY);
        e.preventDefault();
      });

      moveZone.addEventListener("pointermove", (e) => {
        if (e.pointerId !== movePointerId) return;
        if (Math.hypot(e.clientX - stickOrigin.x, e.clientY - stickOrigin.y) > 8) moveDragged = true;
        updateStick(e.clientX, e.clientY);
        e.preventDefault();
      });

      function stopMoving(e) {
        if (e.pointerId !== movePointerId) return;
        const wasTap = !moveDragged && e.type === "pointerup";
        movePointerId = null;
        moveInput.x = 0;
        moveInput.y = 0;
        stick.classList.remove("active");
        stickKnob.style.transform = "translate(0, 0)";
        if (wasTap) tryWorldTap(e.clientX, e.clientY);
      }
      moveZone.addEventListener("pointerup", stopMoving);
      moveZone.addEventListener("pointercancel", stopMoving);
      // Camera orbit (third person)
      let camYaw = Math.PI;
      let camPitch = 0.43;
      const CAM_DIST = 5.7;
      const CAM_HEIGHT = 1.72;
      const CAVE_CAM_DIST = 6.4;
      const CAVE_CAM_HEIGHT = 1.92;
      let cameraSnapRequested = false;
      let camPointerId = null;
      const lastCam = { x: 0, y: 0 };
      const camTapStart = { x: 0, y: 0 };
      let camDragged = false;

      camZone.addEventListener("pointerdown", (e) => {
        if (camPointerId !== null) return;
        camPointerId = e.pointerId;
        camZone.setPointerCapture?.(e.pointerId);
        lastCam.x = e.clientX;
        lastCam.y = e.clientY;
        camTapStart.x = e.clientX;
        camTapStart.y = e.clientY;
        camDragged = false;
        e.preventDefault();
      });

      camZone.addEventListener("pointermove", (e) => {
        if (e.pointerId !== camPointerId) return;
        const dx = e.clientX - lastCam.x;
        const dy = e.clientY - lastCam.y;
        if (Math.hypot(e.clientX - camTapStart.x, e.clientY - camTapStart.y) > 8) camDragged = true;
        lastCam.x = e.clientX;
        lastCam.y = e.clientY;
        camYaw -= dx * 0.006;
        camPitch = THREE.MathUtils.clamp(camPitch + dy * 0.004, -0.15, 0.9);
        e.preventDefault();
      });

      function stopCamera(e) {
        if (e.pointerId !== camPointerId) return;
        const wasTap = !camDragged && e.type === "pointerup";
        camPointerId = null;
        if (wasTap) tryWorldTap(e.clientX, e.clientY);
      }
      camZone.addEventListener("pointerup", stopCamera);
      camZone.addEventListener("pointercancel", stopCamera);
      // Action buttons
      jumpBtn.addEventListener("pointerdown", (e) => {
        jumpRequested = true;
        e.preventDefault();
      });
      attackBtn.addEventListener("pointerdown", (e) => {
        attackRequested = true;
        e.preventDefault();
      });
      autoAttackBtn.addEventListener("pointerdown", (e) => {
        autoAttackEnabled = !autoAttackEnabled;
        autoAttackBtn.classList.toggle("on", autoAttackEnabled);
        autoAttackBtn.setAttribute("aria-pressed", String(autoAttackEnabled));
        autoAttackBtn.setAttribute("aria-label", `Auto attack ${autoAttackEnabled ? "on" : "off"}`);
        e.preventDefault();
      });

      // ---------------------------------------------------------------
      // Player movement / physics with rendered-terrain contact.
      // ---------------------------------------------------------------
      const player = {
        pos: new THREE.Vector3(0, 0, 0),
        heading: 0, // radians, world space facing
        velY: 0,
        grounded: true,
      };

      // Re-evaluate haze against the moving player so nearby cards stay
      // subtle while the far side of the forest closes into thicker fog.
      let fogCardUpdateTimer = 1;
      function updateFogCards(dt) {
        if (!fogCardGroup.visible) return;
        fogCardUpdateTimer += dt;
        if (fogCardUpdateTimer < 0.12) return;
        fogCardUpdateTimer = 0;
        for (const sprite of fogCards) {
          const distance = Math.hypot(
            sprite.position.x - player.pos.x,
            sprite.position.z - player.pos.z
          );
          const distanceFactor = THREE.MathUtils.smoothstep(distance, 24, 96);
          sprite.material.opacity = sprite.userData.baseOpacity
            * (0.38 + distanceFactor * 0.62);
        }
      }

      const WALK_SPEED = 3.35;
      const RUN_SPEED = 8.2;
      const GRAVITY = -18;
      const JUMP_VELOCITY = 6.2;

      const forward = new THREE.Vector3();
      const right = new THREE.Vector3();
      const moveDir = new THREE.Vector3();

      function updatePlayer(dt) {
        const startX = player.pos.x;
        const startZ = player.pos.z;
        const manualInputMag = playerState.dead
          ? 0
          : Math.min(1, Math.hypot(moveInput.x, moveInput.y));
        let inputMag = manualInputMag;
        let autoApproaching = false;
        if (manualInputMag > 0.1) {
          if (tapApproach) tapApproach = null;
          cancelMining();
        }
        if (!playerState.dead && tapApproach && manualInputMag <= 0.1) {
          const target = tapApproachPosition();
          if (!target) tapApproach = null;
          else {
            let dx = target.x - player.pos.x;
            let dz = target.z - player.pos.z;
            const distance = Math.hypot(dx, dz);
            if (distance <= tapApproachStopDistance()) completeTapApproach();
            else {
              if (activeCave) {
                const waypoint = activeCave.nextWaypoint(
                  player.pos.x, player.pos.z, target.x, target.z, 0.38
                );
                dx = waypoint.x - player.pos.x;
                dz = waypoint.z - player.pos.z;
              }
              const waypointDistance = Math.hypot(dx, dz) || 1;
              moveDir.set(dx / waypointDistance, 0, dz / waypointDistance);
              inputMag = 0.72;
              autoApproaching = true;
            }
          }
        }
        const boost = THREE.MathUtils.smoothstep(inputMag, 0.62, 1);
        const running = boost > 0.35;
        let turnAmount = 0;

        if (inputMag > 0.05) {
          if (!autoApproaching) {
            // camera-relative manual movement
            forward.set(Math.sin(camYaw), 0, Math.cos(camYaw));
            right.set(-Math.cos(camYaw), 0, Math.sin(camYaw));
            moveDir
              .set(0, 0, 0)
              .addScaledVector(right, moveInput.x)
              .addScaledVector(forward, -moveInput.y);
          }
          if (moveDir.lengthSq() > 0.0001) {
            moveDir.normalize();
            const speed = THREE.MathUtils.lerp(WALK_SPEED, RUN_SPEED, boost) * inputMag;
            player.pos.addScaledVector(moveDir, speed * dt);

            const targetHeading = Math.atan2(moveDir.x, moveDir.z);
            let diff = targetHeading - player.heading;
            diff = Math.atan2(Math.sin(diff), Math.cos(diff));
            turnAmount = THREE.MathUtils.clamp(diff * 1.8, -1, 1);
            player.heading += diff * Math.min(1, dt * 14);
          }
        }

        if (activeCave) {
          if (!activeCave.containsWorld(player.pos.x, player.pos.z, 0.36)) {
            player.pos.x = startX;
            player.pos.z = startZ;
          }
        } else {
          const bound = GROUND_SIZE * 0.48;
          player.pos.x = THREE.MathUtils.clamp(player.pos.x, -bound, bound);
          player.pos.z = THREE.MathUtils.clamp(player.pos.z, -bound, bound);
        }
        const distanceMoved = Math.hypot(player.pos.x - startX, player.pos.z - startZ);

        const groundY = worldHeightAt(player.pos.x, player.pos.z) + 0.008;
        if (player.grounded) {
          player.pos.y = groundY;
          player.velY = 0;
        }

        // Jump and gravity use the sampled terrain as the landing plane.
        if (jumpRequested && player.grounded && !playerState.dead) {
          player.velY = JUMP_VELOCITY;
          player.grounded = false;
        }
        jumpRequested = false;

        let animationVelY = player.velY;
        if (!player.grounded) {
          player.velY += GRAVITY * dt;
          player.pos.y += player.velY * dt;
          animationVelY = player.velY;
          if (player.velY <= 0 && player.pos.y <= groundY) {
            player.pos.y = groundY;
            player.grounded = true;
          }
        }

        character.root.position.set(player.pos.x, player.pos.y, player.pos.z);
        character.root.rotation.set(0, player.heading, 0);

        updateAnimation(dt, distanceMoved, running, player.grounded, animationVelY, turnAmount);
      }

      // ---------------------------------------------------------------
      // Combat, pickups, projectiles, and instanced skeleton enemies.
      // ---------------------------------------------------------------
      const OUTDOOR_ENEMY_COUNT = 54;
      const ENEMY_COUNT = OUTDOOR_ENEMY_COUNT + mainCave.enemySpawns.length;
      const MAX_PROJECTILES = 72;
      const zeroMatrix = new THREE.Matrix4().makeScale(0, 0, 0);
      const instanceDummy = new THREE.Object3D();
      const enemyBoneMat = blockMaterial(0xd8d4bd);
      const enemyJointMat = blockMaterial(0xaaa793);
      const enemyWeaponMat = blockMaterial(0x858b89);

      function mergeBoxGeometry(parts) {
        const positions = [];
        const normals = [];
        for (const [width, height, depth, x, y, z] of parts) {
          const part = new THREE.BoxGeometry(width, height, depth).toNonIndexed();
          const partPositions = part.attributes.position;
          const partNormals = part.attributes.normal;
          for (let index = 0; index < partPositions.count; index++) {
            positions.push(
              partPositions.getX(index) + x,
              partPositions.getY(index) + y,
              partPositions.getZ(index) + z
            );
            normals.push(
              partNormals.getX(index),
              partNormals.getY(index),
              partNormals.getZ(index)
            );
          }
          part.dispose();
        }
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
        geometry.setAttribute("normal", new THREE.Float32BufferAttribute(normals, 3));
        return geometry;
      }

      const skeletonSkullGeometry = mergeBoxGeometry([
        [0.28, 0.24, 0.25, 0, 0.035, 0],
        [0.2, 0.085, 0.18, 0, -0.13, 0.025],
      ]);
      const skeletonChestGeometry = mergeBoxGeometry([
        [0.06, 0.4, 0.09, 0, 0, -0.015],
        [0.34, 0.055, 0.13, 0, 0.13, 0],
        [0.31, 0.05, 0.12, 0, 0.03, 0],
        [0.27, 0.045, 0.11, 0, -0.07, 0],
      ]);
      const skeletonSocketGeometry = mergeBoxGeometry([
        [0.064, 0.065, 0.025, 0.072, 0.065, 0.132],
        [0.064, 0.065, 0.025, -0.072, 0.065, 0.132],
        [0.045, 0.055, 0.025, 0, -0.005, 0.134],
      ]);
      const enemySocketMat = blockMaterial(0x252824);

      function instances(geometry, material, count) {
        const result = new THREE.InstancedMesh(geometry, material, count);
        result.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        result.castShadow = true;
        result.receiveShadow = true;
        result.frustumCulled = false;
        scene.add(result);
        return result;
      }

      const enemyBowGeometry = new THREE.TorusGeometry(0.28, 0.025, 4, 8, Math.PI);
      enemyBowGeometry.rotateZ(-Math.PI / 2);
      enemyBowGeometry.rotateY(-Math.PI / 2);
      enemyBowGeometry.translate(0, 0, -0.28);

      const enemyMeshes = {
        skull: instances(skeletonSkullGeometry, enemyBoneMat, ENEMY_COUNT),
        sockets: instances(skeletonSocketGeometry, enemySocketMat, ENEMY_COUNT),
        chest: instances(skeletonChestGeometry, enemyBoneMat, ENEMY_COUNT),
        pelvis: instances(new THREE.BoxGeometry(0.28, 0.14, 0.16), enemyJointMat, ENEMY_COUNT),
        armL: instances(new THREE.BoxGeometry(0.085, 0.5, 0.085), enemyBoneMat, ENEMY_COUNT),
        armR: instances(new THREE.BoxGeometry(0.085, 0.5, 0.085), enemyBoneMat, ENEMY_COUNT),
        legL: instances(new THREE.BoxGeometry(0.1, 0.68, 0.11), enemyBoneMat, ENEMY_COUNT),
        legR: instances(new THREE.BoxGeometry(0.1, 0.68, 0.11), enemyBoneMat, ENEMY_COUNT),
        sword: instances(new THREE.BoxGeometry(0.055, 0.62, 0.07), enemyWeaponMat, ENEMY_COUNT),
        swordHandle: instances(new THREE.BoxGeometry(0.075, 0.18, 0.075), MAT.wood, ENEMY_COUNT),
        swordGuard: instances(new THREE.BoxGeometry(0.18, 0.04, 0.07), enemyWeaponMat, ENEMY_COUNT),
        spear: instances(new THREE.BoxGeometry(0.04, 1.25, 0.04), MAT.wood, ENEMY_COUNT),
        spearTip: instances(new THREE.ConeGeometry(0.075, 0.18, 4), enemyWeaponMat, ENEMY_COUNT),
        bow: instances(enemyBowGeometry, MAT.wood, ENEMY_COUNT),
        bowString: instances(new THREE.BoxGeometry(0.012, 0.56, 0.012), enemyWeaponMat, ENEMY_COUNT),
      };
      const enemyMeshList = Object.values(enemyMeshes);

      function node(parent, x, y, z) {
        const result = new THREE.Object3D();
        result.position.set(x, y, z);
        parent.add(result);
        return result;
      }

      const enemyRig = { root: new THREE.Object3D() };
      enemyRig.skull = node(enemyRig.root, 0, 1.52, 0);
      enemyRig.chest = node(enemyRig.root, 0, 1.14, 0);
      enemyRig.pelvis = node(enemyRig.root, 0, 0.74, 0);
      enemyRig.armJointL = node(enemyRig.root, 0.23, 1.28, 0);
      enemyRig.armJointR = node(enemyRig.root, -0.23, 1.28, 0);
      enemyRig.armL = node(enemyRig.armJointL, 0, -0.25, 0);
      enemyRig.armR = node(enemyRig.armJointR, 0, -0.25, 0);
      enemyRig.legJointL = node(enemyRig.root, 0.095, 0.69, 0);
      enemyRig.legJointR = node(enemyRig.root, -0.095, 0.69, 0);
      enemyRig.legL = node(enemyRig.legJointL, 0, -0.34, 0);
      enemyRig.legR = node(enemyRig.legJointR, 0, -0.34, 0);
      enemyRig.weaponGrip = node(enemyRig.armJointR, 0, -0.5, 0.08);
      enemyRig.swordHandle = node(enemyRig.weaponGrip, 0, -0.02, 0);
      enemyRig.swordGuard = node(enemyRig.weaponGrip, 0, 0.07, 0);
      enemyRig.sword = node(enemyRig.weaponGrip, 0, 0.38, 0);
      enemyRig.spear = node(enemyRig.weaponGrip, 0, 0.36, 0);
      enemyRig.spearTip = node(enemyRig.weaponGrip, 0, 1.075, 0);
      enemyRig.bowGrip = node(enemyRig.armJointL, 0, -0.5, 0.08);
      enemyRig.bow = node(enemyRig.bowGrip, 0, 0, 0);
      enemyRig.bowString = node(enemyRig.bowGrip, 0, 0, -0.28);

      const enemyRng = mulberry32(8417);
      const enemyTypes = ["sword", "spear", "archer"];
      const enemies = Array.from({ length: ENEMY_COUNT }, (_, index) => {
        const caveSpawn = index >= OUTDOOR_ENEMY_COUNT
          ? mainCave.enemySpawns[index - OUTDOOR_ENEMY_COUNT]
          : null;
        const angle = enemyRng() * Math.PI * 2;
        const distance = 11 + enemyRng() * 48;
        const position = caveSpawn
          ? caveSpawn.clone()
          : new THREE.Vector3(Math.cos(angle) * distance, 0, Math.sin(angle) * distance);
        const size = 0.84 + enemyRng() * 0.34;
        const width = 0.76 + enemyRng() * 0.5;
        const depth = 0.86 + enemyRng() * 0.25;
        const baseHealth = index % 3 === 0 ? 55 : index % 3 === 1 ? 48 : 38;
        return {
          index,
          type: enemyTypes[index % 3],
          pos: position,
          home: position.clone(),
          patrol: position.clone(),
          heading: enemyRng() * Math.PI * 2,
          phase: enemyRng() * Math.PI * 2,
          hp: Math.round(baseHealth * size),
          maxHp: Math.round(baseHealth * size),
          size,
          width,
          depth,
          cave: caveSpawn ? mainCave : null,
          radius: 0.24 * size * Math.max(0.9, width),
          speedScale: THREE.MathUtils.clamp(1.08 / size, 0.86, 1.16),
          state: "patrol",
          cooldown: enemyRng(),
          attackTime: 0,
          hitApplied: false,
          hurtTime: 0,
          engagedTime: 0,
          dead: false,
          hidden: false,
          sheltered: false,
          shelterTarget: new THREE.Vector3(),
          shelterType: "forest",
          retreatDelay: (index * 2.17) % 9,
          sunExposure: 0,
          sunTolerance: 1.4 + (index * 1.37) % 5.4,
          forestWakeTime: 0,
          forestWakeDelay: 0.9 + (index * 0.47) % 1.4,
          awakenedByForest: false,
          deathTime: 0,
          respawnTime: 0,
          moving: false,
        };
      });

      const FOREST_SHADE_RADIUS = 39;
      const FOREST_SHELTER_RADIUS = 47;
      const FOREST_WAKE_RADIUS = 13;

      function isInForestShade(x, z) {
        return Math.hypot(x, z) >= FOREST_SHADE_RADIUS;
      }

      function chooseNearestOutdoorShelter(enemy) {
        const currentRadius = Math.hypot(enemy.pos.x, enemy.pos.z);
        const fallbackAngle = enemy.index * 2.399963;
        const directionX = currentRadius > 0.01
          ? enemy.pos.x / currentRadius
          : Math.cos(fallbackAngle);
        const directionZ = currentRadius > 0.01
          ? enemy.pos.z / currentRadius
          : Math.sin(fallbackAngle);
        const forestLaneRadius = FOREST_SHELTER_RADIUS + (enemy.index % 5) * 1.35;
        // Skeletons already among the trees should slip farther into nearby
        // cover instead of oddly walking back toward the clearing's edge.
        const forestRadius = Math.max(
          forestLaneRadius,
          currentRadius >= FOREST_SHADE_RADIUS ? currentRadius + 1.5 : 0
        );
        const forestTarget = new THREE.Vector3(
          directionX * forestRadius,
          0,
          directionZ * forestRadius
        );
        const candidates = [
          { type: "forest", target: forestTarget },
          { type: "cave", target: mainCave.entranceOutdoor },
          { type: "cave", target: mainCave.exitOutdoor },
        ];
        let best = candidates[0];
        let bestDistance = enemy.pos.distanceToSquared(best.target);
        for (let index = 1; index < candidates.length; index++) {
          const distance = enemy.pos.distanceToSquared(candidates[index].target);
          if (distance < bestDistance) {
            best = candidates[index];
            bestDistance = distance;
          }
        }
        enemy.shelterType = best.type;
        enemy.shelterTarget.copy(best.target);
      }

      for (const enemy of enemies) {
        if (enemy.cave) continue;
        chooseNearestOutdoorShelter(enemy);
      }

      function choosePatrol(enemy) {
        for (let attempt = 0; attempt < 8; attempt++) {
          const angle = enemyRng() * Math.PI * 2;
          const radius = 2 + enemyRng() * 5;
          const x = enemy.home.x + Math.cos(angle) * radius;
          const z = enemy.home.z + Math.sin(angle) * radius;
          if (enemy.cave && !enemy.cave.containsWorld(x, z, enemy.radius + 0.18)) continue;
          enemy.patrol.set(x, 0, z);
          return;
        }
        enemy.patrol.copy(enemy.home);
      }
      enemies.forEach(choosePatrol);

      const projectileGeo = new THREE.BoxGeometry(0.025, 0.025, 0.52);
      const projectileMesh = instances(projectileGeo, MAT.wood, MAX_PROJECTILES);
      const projectiles = Array.from({ length: MAX_PROJECTILES }, () => ({
        active: false,
        owner: "enemy",
        pos: new THREE.Vector3(),
        prev: new THREE.Vector3(),
        vel: new THREE.Vector3(),
        life: 0,
        damage: 0,
      }));
      const projectileDirection = new THREE.Vector3();
      const projectileQuaternion = new THREE.Quaternion();
      const projectileAxis = new THREE.Vector3(0, 0, 1);

      const MAX_BLOOD_PARTICLES = 160;
      const bloodMaterial = new THREE.MeshStandardMaterial({
        color: 0x8b1712,
        roughness: 1,
        flatShading: true,
      });
      const bloodPoolMaterial = new THREE.MeshStandardMaterial({
        color: 0x65110d,
        roughness: 1,
        transparent: true,
        opacity: 0.86,
        depthWrite: false,
        polygonOffset: true,
        polygonOffsetFactor: -2,
      });
      const bloodParticleMesh = instances(
        new THREE.IcosahedronGeometry(0.035, 0),
        bloodMaterial,
        MAX_BLOOD_PARTICLES
      );
      bloodParticleMesh.castShadow = false;
      const bloodPoolGeometry = new THREE.CircleGeometry(1, 12);
      bloodPoolGeometry.rotateX(-Math.PI / 2);
      const bloodPoolMesh = instances(bloodPoolGeometry, bloodPoolMaterial, ENEMY_COUNT + 1);
      bloodPoolMesh.castShadow = false;
      bloodPoolMesh.receiveShadow = false;
      bloodPoolMesh.renderOrder = 1;
      const bloodParticles = Array.from({ length: MAX_BLOOD_PARTICLES }, () => ({
        active: false,
        pos: new THREE.Vector3(),
        vel: new THREE.Vector3(),
        life: 0,
        size: 1,
      }));
      const bloodRng = mulberry32(27191);
      const bloodDummy = new THREE.Object3D();
      let bloodCursor = 0;

      function spawnBlood(x, y, z, sourceX, sourceZ, count = 8) {
        let awayX = x - sourceX;
        let awayZ = z - sourceZ;
        const awayLength = Math.hypot(awayX, awayZ) || 1;
        awayX /= awayLength;
        awayZ /= awayLength;
        for (let index = 0; index < count; index++) {
          const drop = bloodParticles[bloodCursor++ % MAX_BLOOD_PARTICLES];
          const side = (bloodRng() - 0.5) * 2.4;
          const force = 0.8 + bloodRng() * 2.2;
          drop.active = true;
          drop.pos.set(
            x + (bloodRng() - 0.5) * 0.12,
            y + (bloodRng() - 0.5) * 0.18,
            z + (bloodRng() - 0.5) * 0.12
          );
          drop.vel.set(
            awayX * force - awayZ * side,
            1.5 + bloodRng() * 2.8,
            awayZ * force + awayX * side
          );
          drop.life = 0.8 + bloodRng() * 0.75;
          drop.size = 0.65 + bloodRng() * 1.35;
        }
      }

      function setBloodPool(index, x, z, scaleX, scaleZ, angle) {
        bloodDummy.position.set(x, worldHeightAt(x, z) + 0.018, z);
        bloodDummy.rotation.set(0, angle, 0);
        bloodDummy.scale.set(scaleX, 1, scaleZ);
        bloodDummy.updateMatrix();
        bloodPoolMesh.setMatrixAt(index, bloodDummy.matrix);
      }

      function updateBlood(dt) {
        for (let index = 0; index < bloodParticles.length; index++) {
          const drop = bloodParticles[index];
          if (!drop.active) {
            bloodParticleMesh.setMatrixAt(index, zeroMatrix);
            continue;
          }
          drop.life -= dt;
          drop.vel.y -= 12.5 * dt;
          drop.pos.addScaledVector(drop.vel, dt);
          const ground = worldHeightAt(drop.pos.x, drop.pos.z) + 0.025;
          if (drop.pos.y <= ground) {
            drop.pos.y = ground;
            drop.vel.set(0, 0, 0);
            drop.life = Math.min(drop.life, 0.42);
          }
          if (drop.life <= 0) {
            drop.active = false;
            bloodParticleMesh.setMatrixAt(index, zeroMatrix);
            continue;
          }
          const scale = drop.size * Math.min(1, drop.life * 5);
          bloodDummy.position.copy(drop.pos);
          bloodDummy.rotation.set(index * 1.7, index * 0.91, 0);
          bloodDummy.scale.setScalar(scale);
          bloodDummy.updateMatrix();
          bloodParticleMesh.setMatrixAt(index, bloodDummy.matrix);
        }
        bloodParticleMesh.instanceMatrix.needsUpdate = true;

        for (const enemy of enemies) {
          if (!enemy.dead) {
            bloodPoolMesh.setMatrixAt(enemy.index, zeroMatrix);
            continue;
          }
          const growth = THREE.MathUtils.smootherstep(enemy.deathTime, 0.12, 0.82);
          setBloodPool(
            enemy.index,
            enemy.pos.x,
            enemy.pos.z,
            enemy.size * (0.34 + (enemy.index % 4) * 0.035) * growth,
            enemy.size * (0.25 + (enemy.index % 3) * 0.035) * growth,
            enemy.index * 2.399
          );
        }
        if (playerState.dead) {
          const growth = THREE.MathUtils.smootherstep(playerState.deathTime, 0.18, 0.95);
          setBloodPool(ENEMY_COUNT, player.pos.x, player.pos.z, 0.52 * growth, 0.34 * growth, player.heading);
        } else bloodPoolMesh.setMatrixAt(ENEMY_COUNT, zeroMatrix);
        bloodPoolMesh.instanceMatrix.needsUpdate = true;
      }

      function fireProjectile(owner, origin, target, speed, damage) {
        const shot = projectiles.find((item) => !item.active);
        if (!shot) return;
        shot.active = true;
        shot.owner = owner;
        shot.pos.copy(origin);
        shot.prev.copy(origin);
        shot.vel.copy(target).sub(origin).normalize().multiplyScalar(speed);
        shot.life = 4;
        shot.damage = damage;

      const arrowImpactPoint = new THREE.Vector3();

      const arrowWorldQuaternion = new THREE.Quaternion();
      const arrowParentQuaternion = new THREE.Quaternion();

      const stuckArrowWorldMatrix = new THREE.Matrix4();

      function playerArrowHitBone(shot) {
        const segmentX = shot.pos.x - shot.prev.x;
        const segmentZ = shot.pos.z - shot.prev.z;
        const segmentLengthSq = segmentX * segmentX + segmentZ * segmentZ;
        const t = segmentLengthSq > 0.00001
          ? THREE.MathUtils.clamp(
              ((player.pos.x - shot.prev.x) * segmentX + (player.pos.z - shot.prev.z) * segmentZ) /
                segmentLengthSq,
              0,
              1
            )
          : 0;
        arrowImpactPoint.copy(shot.prev).lerp(shot.pos, t);
        const dx = arrowImpactPoint.x - player.pos.x;
        const dz = arrowImpactPoint.z - player.pos.z;
        const cos = Math.cos(player.heading);
        const sin = Math.sin(player.heading);
        const localX = cos * dx - sin * dz;
        const localZ = sin * dx + cos * dz;
        const localY = arrowImpactPoint.y - player.pos.y;
        if (Math.abs(localZ) > 0.34 || localY < 0.08 || localY > 2.04) return null;
        if (localY > 1.58) return Math.abs(localX) < 0.22 ? bones.head : null;
        if (localY > 0.88) return Math.abs(localX) < 0.27 ? bones.body : null;
        if (Math.abs(localX) > 0.24) return null;
        const leg = localX >= 0 ? bones.legL : bones.legR;
        return localY < 0.46 ? leg.lower : leg.upper;
      }

      function attachArrowToPlayer(shot, bone) {
        const lodged = stuckArrows[stuckArrowCursor++ % MAX_STUCK_ARROWS];
        arrowImpactDirection.copy(shot.vel).normalize();
        arrowImpactPoint.addScaledVector(arrowImpactDirection, -0.04);
        character.root.updateMatrixWorld(true);
        lodged.active = true;
        lodged.bone = bone;
        lodged.localPosition.copy(arrowImpactPoint);
        bone.worldToLocal(lodged.localPosition);
        arrowWorldQuaternion.setFromUnitVectors(projectileAxis, arrowImpactDirection);
        bone.getWorldQuaternion(arrowParentQuaternion);
        lodged.localQuaternion.copy(arrowParentQuaternion).invert().multiply(arrowWorldQuaternion);
      }

          stuckArrowLocalMatrix.compose(lodged.localPosition, lodged.localQuaternion, stuckArrowScale);
          stuckArrowWorldMatrix.multiplyMatrices(lodged.bone.matrixWorld, stuckArrowLocalMatrix);

          const hitScale = 1 + Math.sin(ore.hitTime * 34) * ore.hitTime * 0.16;

          oreRoot.scale.setScalar(hitScale);
          oreRoot.updateMatrixWorld(true);
          oreBaseMesh.setMatrixAt(ore.index, oreBaseNode.matrixWorld);
          oreCrystalNodes.forEach((crystal, crystalIndex) => {

              crackIndex < damageStage ? crack.matrixWorld : zeroMatrix

      function oreSurfaceHeight(ore) {
        const floorY = worldHeightAt(ore.pos.x, ore.pos.z);

        if (ore.kind === "wall") {
          return oreImpactNormal.set(Math.sin(ore.rotation), 0.18, Math.cos(ore.rotation)).normalize();
        }
        const dx = player.pos.x - ore.pos.x;
        const dz = player.pos.z - ore.pos.z;

      function spawnMiningFragments(ore, shattered = false) {
        const normal = getOreImpactNormal(ore);
        const visualPosition = getOreVisualPosition(ore, new THREE.Vector3());
        const count = shattered ? 15 : 7;
        for (let pieceIndex = 0; pieceIndex < count; pieceIndex++) {
          const fragment = miningFragments.find((piece) => !piece.active)
            ?? miningFragments[(ore.index * 13 + pieceIndex) % miningFragments.length];
          const gemChip = pieceIndex % (shattered ? 3 : 5) === 0;
          fragment.active = true;
          fragment.life = 0.65 + Math.random() * 0.65;
          fragment.scale = (gemChip ? 0.62 : 0.8) + Math.random() * 0.75;
          fragment.pos.set(
            visualPosition.x + normal.x * 0.24 + (Math.random() - 0.5) * 0.45,
            oreSurfaceHeight(ore) + (Math.random() - 0.5) * 0.38,
            visualPosition.z + normal.z * 0.24 + (Math.random() - 0.5) * 0.45
          );
          fragment.vel.set(
            normal.x * (1.2 + Math.random() * 1.8) + (Math.random() - 0.5) * 1.7,
            1.4 + Math.random() * 2.6,
            normal.z * (1.2 + Math.random() * 1.8) + (Math.random() - 0.5) * 1.7
          );
          fragment.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
          fragment.spin.set(
            (Math.random() - 0.5) * 9,
            (Math.random() - 0.5) * 9,
            (Math.random() - 0.5) * 9
          );
          oreColor.setHex(gemChip ? GEM_TYPES[ore.gem].color : 0x46535b);
          miningFragmentMesh.setColorAt(fragment.index, oreColor);
        }
        if (miningFragmentMesh.instanceColor) miningFragmentMesh.instanceColor.needsUpdate = true;
