<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Mr Vampire — Model Viewer</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1118; color: #e8ecf4; font-family: system-ui, -apple-system, sans-serif; }
  #gl { display: block; width: 100%; height: 100%; cursor: grab; }
  #gl:active { cursor: grabbing; }
  #bar {
    position: fixed; top: 14px; left: 14px; right: 14px;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between;
    pointer-events: none;
  }
  .group { display: flex; gap: 6px; pointer-events: auto; background: rgba(14,19,28,.75); padding: 6px; border-radius: 999px; border: 1px solid rgba(255,255,255,.10); backdrop-filter: blur(8px); }
  button, a.pill {
    appearance: none; border: 0; background: transparent; color: rgba(255,255,255,.72);
    padding: 6px 14px; border-radius: 999px; font-size: 12px; font-weight: 600; letter-spacing: .04em;
    cursor: pointer; text-decoration: none; transition: background .15s, color .15s;
  }
  button:hover, a.pill:hover { color: #fff; background: rgba(255,255,255,.08); }
  button.on { background: #8e1f2b; color: #fff; }
  #tip {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    font-size: 11px; color: rgba(255,255,255,.45); pointer-events: none; letter-spacing: .04em;
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="bar">
  <div class="group">
    <button data-model="man" class="on">Mr. Strange</button>
    <button data-model="templar">Templar</button>
    <button data-model="bat">Bat</button>
  </div>
  <div class="group" id="poseGroup">
    <button data-anim="tpose" class="on">Lower T-Pose</button>
    <button data-anim="idle">Idle</button>
    <button data-anim="walk">Walk</button>
    <button data-anim="run">Run</button>
    <button data-anim="attack">Attack</button>
  </div>
  <div class="group">
    <button id="wireBtn">Wireframe</button>
    <button id="resetBtn">Reset Cam</button>
    <a class="pill" href="./index.html">Back to Game</a>
  </div>
</div>
<div id="tip">Left-drag: orbit · Right-drag / Shift-drag / WASD: pan · Scroll: zoom</div>
<script type="importmap">
{ "imports": { "three": "./three.module.min.js" } }
</script>
<script type="module" src="./src/viewer.js"></script>
</body>
</html>
