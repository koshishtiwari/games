<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0e141d" />
<title>Mr Vampire</title>
<link rel="stylesheet" href="./style.css" />
</head>
<body>
<canvas id="gl"></canvas>

<div id="ui">
  <div id="hud"></div>
  <div id="hint">
    <span class="touch">Drag to move &nbsp;·&nbsp; use the buttons to fight and fly</span>
    <span class="keys">WASD move &nbsp;·&nbsp; Space jump &nbsp;·&nbsp; J punch &nbsp;·&nbsp; L slam &nbsp;·&nbsp; B bat</span>
  </div>
  <a id="viewerLink" href="./viewer.html?v=4" aria-label="Model viewer" title="Model viewer">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg>
  </a>
  <div id="stick"><div id="stickBase"></div><div id="stickKnob"></div></div>
  <div id="actions">
    <div id="bat" class="act sm" role="button" aria-label="Bat form">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 7.2c.9-1.6 2.2-2.6 3.4-2.6l.3 2.1c1.9-.9 4.2-.9 6.3.1-1.4.6-2.2 1.8-2.4 3.4-1 .1-2 .5-2.8 1.3.1-.9-.2-1.6-.8-2.1-.4 1.1-1 1.9-2 2.4v2.6l-.8-1.3-.8 1.3v-2.6c-1-.5-1.6-1.3-2-2.4-.6.5-.9 1.2-.8 2.1-.8-.8-1.8-1.2-2.8-1.3-.2-1.6-1-2.8-2.4-3.4 2.1-1 4.4-1 6.3-.1l.3-2.1c1.2 0 2.5 1 3.4 2.6z"/></svg>
      <span>BAT</span>
    </div>
    <div id="slam" class="act sm" role="button" aria-label="Ground slam">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v11M7.5 10.5L12 15l4.5-4.5M4 20h16"/></svg>
      <span>SLAM</span>
    </div>
    <div id="punch" class="act md" role="button" aria-label="Punch">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5v4M12 17.5v4M2.5 12h4M17.5 12h4M5.3 5.3l2.8 2.8M15.9 15.9l2.8 2.8M18.7 5.3l-2.8 2.8M8.1 15.9l-2.8 2.8"/><circle cx="12" cy="12" r="2.4" fill="currentColor"/></svg>
      <span>HIT</span>
    </div>
    <div id="jump" class="act lg" role="button" aria-label="Jump">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 13l6-6 6 6M6 19l6-6 6 6"/></svg>
      <span>JUMP</span>
    </div>
  </div>
</div>
<div id="fatal"></div>

<script>
  // Surface load/runtime failures instead of showing a black screen.
  window.addEventListener('error', (e) => {
    const f = document.getElementById('fatal');
    f.style.display = 'flex';
    f.textContent = 'Could not start: ' + (e.message || e.error || 'unknown error');
  });
</script>

<script type="importmap">
{ "imports": { "three": "./three.module.min.js" } }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
