<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#ffd9ea" />
<title>Squish Box</title>
<style>
  :root {
    --ink: #3a1d4d;
    --pink: #ff6fa5;
    --pink-d: #d93f7d;
    --paper: #fffaf3;
    --rc: #cfd8e6;
    --font: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Nunito", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: radial-gradient(120% 80% at 50% 62%, #f08cb8 0%, #c96aa6 45%, #7a3a7a 100%); color: var(--ink); font-family: var(--font); touch-action: none; overscroll-behavior: none; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 2; }
  #hud { position: fixed; inset: 0; pointer-events: none; }

  .chip { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 12px); height: 40px; padding: 0 14px; border-radius: 14px; background: rgba(255,255,255,.78); color: var(--ink); font-weight: 800; font-size: 14px; display: flex; align-items: center; gap: 8px; box-shadow: 0 2px 0 rgba(58,29,77,.12); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #count { left: 14px; }
  #count b { font-size: 17px; font-variant-numeric: tabular-nums; }
  #gear { right: 14px; width: 40px; padding: 0; justify-content: center; pointer-events: auto; }
  #gear svg { width: 22px; height: 22px; }

  #card { position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 62px); transform: translate(-50%, -24px) scale(.9); opacity: 0; transition: transform .45s cubic-bezier(.2,1.4,.4,1), opacity .25s; text-align: center; }
  #card.show { transform: translate(-50%, 0) scale(1); opacity: 1; }
  #rar { display: inline-block; padding: 5px 14px 4px; border-radius: 999px; background: var(--rc); color: #fff; font-weight: 900; letter-spacing: .12em; font-size: 12px; text-shadow: 0 1px 0 rgba(0,0,0,.25); box-shadow: 0 2px 0 rgba(0,0,0,.15); }
  #nm { margin-top: 6px; font-size: 34px; font-weight: 900; line-height: 1.05; color: var(--ink); text-shadow: 0 2px 0 #fff, 0 -2px 0 #fff, 2px 0 0 #fff, -2px 0 0 #fff, 0 5px 14px rgba(255,255,255,.7); }
  #stars { margin-top: 4px; font-size: 18px; letter-spacing: 4px; color: var(--rc); text-shadow: 0 1px 0 rgba(255,255,255,.9); }
  #stars i { font-style: normal; opacity: .25; }
  #stars i.on { opacity: 1; }

  #hint { position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 36px); text-align: center; font-weight: 900; font-size: 18px; color: var(--ink); opacity: 0; transition: opacity .35s; text-shadow: 0 2px 0 #fff, 0 -2px 0 #fff, 2px 0 0 #fff, -2px 0 0 #fff; padding: 0 24px; }
  #hint.show { opacity: .9; }
  #hint.pulse { animation: pulse 1.3s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

  #again { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); transform: translate(-50%, 90px); opacity: 0; transition: transform .45s cubic-bezier(.2,1.4,.4,1), opacity .25s; pointer-events: none; height: 56px; padding: 0 30px; border-radius: 18px; font-weight: 900; font-size: 18px; color: #fff; background: var(--pink); box-shadow: 0 5px 0 var(--pink-d), 0 10px 24px rgba(217,63,125,.35); text-shadow: 0 2px 0 rgba(0,0,0,.18); white-space: nowrap; }
  #again.show { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
  #again:active { transform: translate(-50%, 4px); box-shadow: 0 1px 0 var(--pink-d), 0 4px 12px rgba(217,63,125,.35); }

  #tune { position: absolute; left: 50%; bottom: 0; width: min(100%, 460px); transform: translate(-50%, 105%); transition: transform .35s cubic-bezier(.2,1,.3,1); background: rgba(255,250,243,.97); border-radius: 26px 26px 0 0; padding: 18px 20px calc(env(safe-area-inset-bottom, 0px) + 18px); box-shadow: 0 -10px 40px rgba(58,29,77,.22); pointer-events: auto; max-height: 86%; overflow-y: auto; touch-action: pan-y; }
  #tune.show { transform: translate(-50%, 0); }
  #tune h3 { font-size: 20px; font-weight: 900; margin-bottom: 4px; }
  #tune p.sub { font-size: 12px; opacity: .6; font-weight: 700; margin-bottom: 12px; }
  .row { display: grid; grid-template-columns: 112px 1fr; align-items: center; gap: 10px; margin: 8px 0; font-weight: 800; font-size: 14px; }
  .row input[type=range] { width: 100%; height: 28px; accent-color: var(--pink); touch-action: pan-y; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 12px; }
  .pill { padding: 9px 14px; border-radius: 12px; font-weight: 900; font-size: 13px; background: #fff; box-shadow: inset 0 0 0 2px rgba(58,29,77,.14); }
  .pill.on { background: var(--ink); color: #fff; box-shadow: none; }
  .btns { display: flex; gap: 10px; margin-top: 12px; }
  .btns button { flex: 1; height: 46px; border-radius: 14px; font-weight: 900; font-size: 14px; background: #fff; box-shadow: inset 0 0 0 2px rgba(58,29,77,.14); }
  .btns button.pri { background: var(--ink); color: #fff; box-shadow: none; }
  #scrim { position: absolute; inset: 0; background: rgba(58,29,77,.25); opacity: 0; pointer-events: none; transition: opacity .3s; }
  #scrim.show { opacity: 1; pointer-events: auto; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="flash"></div>
<div id="hud">
  <div class="chip" id="count">Squishes <b id="cn">0</b></div>
  <button class="chip" id="gear" aria-label="Tune">
    <svg viewBox="0 0 24 24" fill="none" stroke="#3a1d4d" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.4"/><circle cx="8" cy="17" r="2.4"/></svg>
  </button>
  <div id="card"><div id="rar">COMMON</div><div id="nm">Bumi</div><div id="stars"></div></div>
  <div id="hint"></div>
  <button id="again">Open another box</button>
  <div id="scrim"></div>
  <div id="tune">
    <h3>Tune the squish</h3>
    <p class="sub">Changes apply live. Try them on the squishy.</p>
    <div class="row"><span>Elasticity</span><input type="range" id="s_elastic" min="0" max="1" step="0.01"></div>
    <div class="row"><span>Softness</span><input type="range" id="s_soft" min="0" max="1" step="0.01"></div>
    <div class="row"><span>Jiggle</span><input type="range" id="s_jiggle" min="0" max="1" step="0.01"></div>
    <div class="row"><span>Plumpness</span><input type="range" id="s_plump" min="0" max="1" step="0.01"></div>
    <div class="row"><span>Slow rise</span><input type="range" id="s_rise" min="0" max="1" step="0.01"></div>
    <div class="row"><span>Stretchiness</span><input type="range" id="s_stretchy" min="0" max="1" step="0.01"></div>
    <div class="sub" style="margin-top:10px;margin-bottom:0">Next box rarity</div>
    <div class="chips" id="rarChips"></div>
    <div class="chips">
      <button class="pill" id="t_sound">Sound</button>
      <button class="pill" id="t_haptics">Haptics</button>
    </div>
    <div class="btns"><button id="b_defaults">Defaults</button><button class="pri" id="b_close">Done</button></div>
  </div>
</div>

<script type="module">
import * as THREE from './three.module.min.js';
(() => {
'use strict';

/* SQUISH BOX 3D (test squishy: Bumi). three.js scene + custom soft body. */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const $ = (id) => document.getElementById(id);

/* ---------------------------------------------------------------------
   3D SOFT BODY (pure, no DOM, no three.js). The node tests extract this block.
   Units: body radius is ~1. Model: shape matching (rotation only) for the
   jelly spring, edge springs for skin, volume pressure for plumpness,
   plastic memory for slow rise, finger patches for grab / press / knead.
   --------------------------------------------------------------------- */
// <physics>
function icosphere(detail) {
  const t = (1 + Math.sqrt(5)) / 2;
  let V = [[-1, t, 0], [1, t, 0], [-1, -t, 0], [1, -t, 0], [0, -1, t], [0, 1, t], [0, -1, -t], [0, 1, -t], [t, 0, -1], [t, 0, 1], [-t, 0, -1], [-t, 0, 1]]
    .map((v) => { const l = Math.hypot(v[0], v[1], v[2]); return [v[0] / l, v[1] / l, v[2] / l]; });
  let F = [[0, 11, 5], [0, 5, 1], [0, 1, 7], [0, 7, 10], [0, 10, 11], [1, 5, 9], [5, 11, 4], [11, 10, 2], [10, 7, 6], [7, 1, 8],
    [3, 9, 4], [3, 4, 2], [3, 2, 6], [3, 6, 8], [3, 8, 9], [4, 9, 5], [2, 4, 11], [6, 2, 10], [8, 6, 7], [9, 8, 1]];
  for (let d = 0; d < detail; d++) {
    const cache = new Map();
    const mid = (a, b) => {
      const k = a < b ? a + '_' + b : b + '_' + a;
      let m = cache.get(k);
      if (m === undefined) {
        const p = [(V[a][0] + V[b][0]) / 2, (V[a][1] + V[b][1]) / 2, (V[a][2] + V[b][2]) / 2];
        const l = Math.hypot(p[0], p[1], p[2]); p[0] /= l; p[1] /= l; p[2] /= l;
        m = V.length; V.push(p); cache.set(k, m);
      }
      return m;
    };
    const NF = [];
    for (const f of F) {
      const a = f[0], b = f[1], c = f[2], ab = mid(a, b), bc = mid(b, c), ca = mid(c, a);
      NF.push([a, ab, ca], [b, bc, ab], [c, ca, bc], [ab, bc, ca]);
    }
    F = NF;
  }
  return { V, F };
}

function meshVolume(P, tri, nt) {
  let v = 0;
  for (let t = 0; t < nt; t++) {
    const i = tri[3 * t] * 3, j = tri[3 * t + 1] * 3, k = tri[3 * t + 2] * 3;
    v += (P[i] * (P[j + 1] * P[k + 2] - P[j + 2] * P[k + 1]) - P[i + 1] * (P[j] * P[k + 2] - P[j + 2] * P[k]) + P[i + 2] * (P[j] * P[k + 1] - P[j + 1] * P[k])) / 6;
  }
  return v;
}

function makeBlob(def, detail) {
  const ico = icosphere(detail), n = ico.V.length, nt = ico.F.length;
  const b = {
    n, nt, def,
    tri: new Uint16Array(nt * 3),
    X: new Float64Array(n * 3), V: new Float64Array(n * 3), A: new Float64Array(n * 3),
    Q: new Float64Array(n * 3), Q0: new Float64Array(n * 3), dir: new Float64Array(n * 3),
    PF: new Float64Array(n * 3), NRM: new Float64Array(n * 3), W: new Float64Array(n),
    earW: new Float64Array(n),
    edges: null, L0: null, V0: 0, Av0: 0, minY0: 0,
    q: [0, 0, 0, 1], R: [1, 0, 0, 0, 1, 0, 0, 0, 1],
    cx: 0, cy: 0, cz: 0, deform: 0, act: 0, volRatio: 1, impact: 0, grounded: false, breath: 0,
  };
  for (let t = 0; t < nt; t++) { b.tri[3 * t] = ico.F[t][0]; b.tri[3 * t + 1] = ico.F[t][1]; b.tri[3 * t + 2] = ico.F[t][2]; }
  let mx = 0, my = 0, mz = 0;
  for (let i = 0; i < n; i++) {
    const d = ico.V[i];
    b.dir[3 * i] = d[0]; b.dir[3 * i + 1] = d[1]; b.dir[3 * i + 2] = d[2];
    const r = def.shape(d[0], d[1], d[2]);
    b.Q0[3 * i] = d[0] * r * def.sx; b.Q0[3 * i + 1] = d[1] * r * def.sy; b.Q0[3 * i + 2] = d[2] * r * def.sz;
    mx += b.Q0[3 * i]; my += b.Q0[3 * i + 1]; mz += b.Q0[3 * i + 2];
    b.earW[i] = def.earWeight ? def.earWeight(d[0], d[1], d[2]) : 0;
  }
  mx /= n; my /= n; mz /= n;
  for (let i = 0; i < n; i++) { b.Q0[3 * i] -= mx; b.Q0[3 * i + 1] -= my; b.Q0[3 * i + 2] -= mz; }
  b.Q0pre = Float64Array.from(b.Q0);   // untilted copy: face texture coordinates come from this
  if (def.tilt) {
    const c = Math.cos(def.tilt), sn = Math.sin(def.tilt);
    for (let i = 0; i < n; i++) {
      const y = b.Q0[3 * i + 1], z = b.Q0[3 * i + 2];
      b.Q0[3 * i + 1] = y * c - z * sn; b.Q0[3 * i + 2] = y * sn + z * c;
    }
  }
  let minY = 1e9;
  for (let i = 0; i < n; i++) if (b.Q0[3 * i + 1] < minY) minY = b.Q0[3 * i + 1];
  b.minY0 = -minY;
  if (meshVolume(b.Q0, b.tri, nt) < 0) {
    for (let t = 0; t < nt; t++) { const x = b.tri[3 * t + 1]; b.tri[3 * t + 1] = b.tri[3 * t + 2]; b.tri[3 * t + 2] = x; }
  }
  b.Q.set(b.Q0);
  const seen = new Set(), el = [];
  for (let t = 0; t < nt; t++) {
    for (let k = 0; k < 3; k++) {
      const a = b.tri[3 * t + k], c = b.tri[3 * t + ((k + 1) % 3)], lo = Math.min(a, c), hi = Math.max(a, c), key = lo * n + hi;
      if (!seen.has(key)) { seen.add(key); el.push(lo, hi); }
    }
  }
  b.edges = Int32Array.from(el);
  b.L0 = new Float64Array(el.length / 2);
  for (let e = 0; e < b.L0.length; e++) {
    const i = el[2 * e] * 3, j = el[2 * e + 1] * 3;
    b.L0[e] = Math.hypot(b.Q0[i] - b.Q0[j], b.Q0[i + 1] - b.Q0[j + 1], b.Q0[i + 2] - b.Q0[j + 2]);
  }
  b.V0 = meshVolume(b.Q0, b.tri, nt);
  let area = 0;
  for (let t = 0; t < nt; t++) {
    const i = b.tri[3 * t] * 3, j = b.tri[3 * t + 1] * 3, k = b.tri[3 * t + 2] * 3;
    const ax = b.Q0[j] - b.Q0[i], ay = b.Q0[j + 1] - b.Q0[i + 1], az = b.Q0[j + 2] - b.Q0[i + 2];
    const bx = b.Q0[k] - b.Q0[i], by = b.Q0[k + 1] - b.Q0[i + 1], bz = b.Q0[k + 2] - b.Q0[i + 2];
    area += 0.5 * Math.hypot(ay * bz - az * by, az * bx - ax * bz, ax * by - ay * bx);
  }
  b.Av0 = area / n;
  return b;
}

function placeBlob(b, cx, cy, cz, sx, sy, sz) {
  for (let i = 0; i < b.n; i++) {
    b.X[3 * i] = cx + b.Q0[3 * i] * sx; b.X[3 * i + 1] = cy + b.Q0[3 * i + 1] * sy; b.X[3 * i + 2] = cz + b.Q0[3 * i + 2] * sz;
    b.V[3 * i] = 0; b.V[3 * i + 1] = 0; b.V[3 * i + 2] = 0; b.W[i] = 0;
  }
  b.Q.set(b.Q0); b.q = [0, 0, 0, 1]; b.cx = cx; b.cy = cy; b.cz = cz;
}
function kickBlob(b, vx, vy, vz) {
  for (let i = 0; i < b.n; i++) { b.V[3 * i] += vx; b.V[3 * i + 1] += vy; b.V[3 * i + 2] += vz; }
}
function spinBlob(b, wy) {
  for (let i = 0; i < b.n; i++) { b.V[3 * i] += wy * (b.X[3 * i + 2] - b.cz); b.V[3 * i + 2] -= wy * (b.X[3 * i] - b.cx); }
}
function centroid(b) {
  let x = 0, y = 0, z = 0;
  for (let i = 0; i < b.n; i++) { x += b.X[3 * i]; y += b.X[3 * i + 1]; z += b.X[3 * i + 2]; }
  b.cx = x / b.n; b.cy = y / b.n; b.cz = z / b.n;
}
function blobOK(b) {
  for (let i = 0; i < b.n * 3; i++) if (!isFinite(b.X[i]) || !isFinite(b.V[i])) return false;
  return true;
}
function computeNormals(b) {
  const N = b.NRM, X = b.X, tri = b.tri;
  N.fill(0);
  for (let t = 0; t < b.nt; t++) {
    const i = tri[3 * t] * 3, j = tri[3 * t + 1] * 3, k = tri[3 * t + 2] * 3;
    const ax = X[j] - X[i], ay = X[j + 1] - X[i + 1], az = X[j + 2] - X[i + 2];
    const bx = X[k] - X[i], by = X[k + 1] - X[i + 1], bz = X[k + 2] - X[i + 2];
    const nx = ay * bz - az * by, ny = az * bx - ax * bz, nz = ax * by - ay * bx;
    N[i] += nx; N[i + 1] += ny; N[i + 2] += nz; N[j] += nx; N[j + 1] += ny; N[j + 2] += nz; N[k] += nx; N[k + 1] += ny; N[k + 2] += nz;
  }
  for (let i = 0; i < b.n; i++) {
    const l = Math.hypot(N[3 * i], N[3 * i + 1], N[3 * i + 2]) || 1;
    N[3 * i] /= l; N[3 * i + 1] /= l; N[3 * i + 2] /= l;
  }
}

// Start a touch from a camera ray (o = origin, d = unit direction, fw = camera forward).
function beginTouch(b, ox, oy, oz, dx, dy, dz, fwx, fwy, fwz) {
  const X = b.X, tri = b.tri;
  let bestT = 1e18;
  for (let t = 0; t < b.nt; t++) {
    const i = tri[3 * t] * 3, j = tri[3 * t + 1] * 3, k = tri[3 * t + 2] * 3;
    const e1x = X[j] - X[i], e1y = X[j + 1] - X[i + 1], e1z = X[j + 2] - X[i + 2];
    const e2x = X[k] - X[i], e2y = X[k + 1] - X[i + 1], e2z = X[k + 2] - X[i + 2];
    const px = dy * e2z - dz * e2y, py = dz * e2x - dx * e2z, pz = dx * e2y - dy * e2x;
    const det = e1x * px + e1y * py + e1z * pz;
    if (Math.abs(det) < 1e-10) continue;
    const inv = 1 / det;
    const tx = ox - X[i], ty = oy - X[i + 1], tz = oz - X[i + 2];
    const u = (tx * px + ty * py + tz * pz) * inv;
    if (u < 0 || u > 1) continue;
    const qx = ty * e1z - tz * e1y, qy = tz * e1x - tx * e1z, qz = tx * e1y - ty * e1x;
    const v = (dx * qx + dy * qy + dz * qz) * inv;
    if (v < 0 || u + v > 1) continue;
    const tt = (e2x * qx + e2y * qy + e2z * qz) * inv;
    if (tt > 1e-4 && tt < bestT) bestT = tt;
  }
  let hx, hy, hz, interior = false;
  if (bestT < 1e17) {
    hx = ox + dx * bestT; hy = oy + dy * bestT; hz = oz + dz * bestT; interior = true;
  } else {
    let bd = 1e18, bi = -1;
    for (let i = 0; i < b.n; i++) {
      const vx = X[3 * i] - ox, vy = X[3 * i + 1] - oy, vz = X[3 * i + 2] - oz;
      const tp = vx * dx + vy * dy + vz * dz;
      if (tp < 0) continue;
      const d2 = vx * vx + vy * vy + vz * vz - tp * tp;
      if (d2 < bd) { bd = d2; bi = i; }
    }
    if (bi < 0 || bd > 0.55 * 0.55) return null;
    hx = X[3 * bi]; hy = X[3 * bi + 1]; hz = X[3 * bi + 2];
  }
  const sigma = 0.42, idx = [], w = [], ox_ = [], oy_ = [], oz_ = [];
  for (let k = 0; k < b.n; k++) {
    const ex = X[3 * k] - hx, ey = X[3 * k + 1] - hy, ez = X[3 * k + 2] - hz;
    const dd = Math.hypot(ex, ey, ez);
    if (dd < 2 * sigma) {
      const wk = Math.exp(-(dd * dd) / (sigma * sigma));
      if (wk > 0.04) { idx.push(k); w.push(wk); ox_.push(ex); oy_.push(ey); oz_.push(ez); }
    }
  }
  return {
    idx, w, ox: ox_, oy: oy_, oz: oz_, hx, hy, hz, dx, dy, dz, fwx, fwy, fwz,
    fx: hx, fy: hy, fz: hz, vx: 0, vy: 0, vz: 0, tm: 0,
    interior, bias: interior ? 0.55 : 0, biasTarget: interior ? 1 : 0, str: 0, age: 0,
  };
}
// Move a touch: intersect the new camera ray with the plane through the grab point.
function moveTouch(t, ox, oy, oz, dx, dy, dz) {
  const den = dx * t.fwx + dy * t.fwy + dz * t.fwz;
  if (Math.abs(den) < 1e-4) return;
  const tt = ((t.hx - ox) * t.fwx + (t.hy - oy) * t.fwy + (t.hz - oz) * t.fwz) / den;
  t.fx = ox + dx * tt; t.fy = oy + dy * tt; t.fz = oz + dz * tt;
}

function step(b, dt, ctx) {
  const P = ctx.P, n = b.n, X = b.X, VV = b.V, A = b.A, Q = b.Q, Q0 = b.Q0, W = b.W, PF = b.PF, tri = b.tri;
  const TAU2 = Math.PI * 2;

function endPointer(e) {
  if (tearTouch && tearTouch.id === e.pointerId) {
    const tt = tearTouch; tearTouch = null;
    if (bx && !bx.popped && bx.tear > 0.02) bx.relax = true;   // the lid settles back down
    if (tt.moved < 14 && performance.now() - tt.t0 < 350) {
      bx.shake = 1; snd.rattle(); hap('heavy', 0);
      setHint('Something is inside!', false);
      setTimeout(() => { if (state === 'idle' && bx && bx.tear < 0.02) setHint('Swipe up to lift the lid', true); }, 1300);
    }
    return;
  }
  if (spinTouch && spinTouch.id === e.pointerId) { spinTouch = null; return; }
  const t = touches.get(e.pointerId);
  if (t) {
    touches.delete(e.pointerId);
    const i = touchList.indexOf(t); if (i >= 0) touchList.splice(i, 1);
    if (t.str > 0.35) { snd.boing(clamp(t.str, 0.3, 1)); hap('light', 0); }
    else if (Math.hypot(t.vx, t.vy, t.vz) > 6) hap('selection', 0);
  }
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
cv.addEventListener('contextmenu', (e) => e.preventDefault());

/* ---------------------------------------------------------------------
   UPDATE
   --------------------------------------------------------------------- */
function updateBox(dt) {
  const o = bx;
  if (o.popped) {
    if (o.lv) {
      const l = o.lv, g = o.lidG;
      l.vy -= 38 * dt; g.position.x += l.vx * dt; g.position.y += l.vy * dt; g.position.z += l.vz * dt;
      g.rotation.x += l.rx * dt; g.rotation.y += l.ry * dt; g.rotation.z += l.rz * dt;
      if (g.position.y < 0.05) { g.position.y = 0.05; l.vy = -l.vy * 0.3; l.vx *= 0.7; l.vz *= 0.7; l.rx *= 0.5; l.ry *= 0.5; l.rz *= 0.5; }
      if (Math.abs(g.position.x) > halfW + 3) g.visible = false;
    }
    o.topGlow.material.opacity = Math.max(0, o.topGlow.material.opacity - dt * 0.8);
    o.gapGlow.material.opacity = Math.max(0, o.gapGlow.material.opacity - dt * 2);
    leakL.intensity = Math.max(0, leakL.intensity - dt * 30);
    o.sqy += (0 - o.sqy) * Math.min(1, dt * 9);
    return;
  }
  if (state === 'boxIn') {
    o.vy -= 58 * dt; o.y += o.vy * dt;
    if (o.y <= 0) {
      o.y = 0;
      if (o.vy < -6) {
        snd.thud(clamp(-o.vy / 26, 0.2, 1)); hap('light', 0);
        o.sqy = 0.12; o.vy = -o.vy * 0.34; o.shake = Math.max(o.shake, 0.4);
      } else { o.vy = 0; state = 'idle'; setHint('Swipe up to lift the lid', true); }
    }
  }
  o.sqy += (0 - o.sqy) * Math.min(1, dt * 9);
  o.shake *= Math.exp(-dt * 4.5);
  o.rot = Math.sin(time * 1.5) * 0.012 + Math.sin(time * 41) * 0.03 * o.shake;
  if (state === 'idle') {
    if (o.relax && !tearTouch) {
      o.tear = Math.max(0, o.tear - dt * 1.4); o.lastTick = Math.min(o.lastTick, o.tear);
      if (o.tear === 0) { o.relax = false; snd.thud(0.35); hap('light', 0); o.shake = Math.max(o.shake, 0.5); }
    }
    // steam leaks out from under the lid; more and more tinted by what is inside as it lifts
    o.steamAcc += dt * (2.2 + o.tear * 30);
    while (o.steamAcc > 1) {
      o.steamAcc -= 1;
      _tint.copy(_white).lerp(_glowC.set(rarity.glow), Math.min(1, o.tear * 0.9));
      spawnSteam(o.x + rnd(-0.8, 0.8), HB + 0.1 + o.tear * 0.5, SR * rnd(0.5, 1.0), '#' + _tint.getHexString(), 0.28 + o.tear * 0.3, false);
    }
  }
}

function physicsFrame(dt) {
  const n = Math.max(1, Math.min(8, Math.ceil(dt / (1 / 170)))), sdt = dt / n;
  const ctx = { P, xBound: Math.max(0.6, halfW - 0.1), zBound: 1.4, touches: touchList, basket: bx && bx.popped ? BASKET : null };
  blob.impact = 0; blob.breath = Math.sin(time * 2.1) * 0.012;
  for (let s = 0; s < n; s++) step(blob, sdt, ctx);
  if (!blobOK(blob)) placeBlob(blob, 0, TRAY_FLOOR + blob.minY0, 0, 1, 1, 1);
}

function updatePlay(dt) {
  physicsFrame(dt);
  const b = blob;
  if (b.impact > 3.2) {
    const v = clamp(b.impact / 22, 0.15, 1);
    snd.boing(v); hap(b.impact > 12 ? 'heavy' : 'light', 80); face.happy = 0.4;
  }
  let stretch = 0, pressing = 0, speed = 0;
  const nowp = performance.now();
  for (const t of touchList) {
    t.age += dt;
    if (nowp - t.tm > 70) { t.vx *= 0.8; t.vy *= 0.8; t.vz *= 0.8; }
    if (t.interior) pressing = Math.max(pressing, t.bias); stretch = Math.max(stretch, t.str);
    speed = Math.max(speed, Math.hypot(t.vx, t.vy, t.vz));
  }
  stat.act = b.act; stat.deform = b.deform; stat.stretch = stretch; stat.touching = touchList.length > 0; stat.pullSpeed = clamp(speed / 6, 0, 1);
  if (stat.touching && b.act > 0.3) hap('selection', 75);
  if (stretch > 0.45) hap('light', 120);
  // face mood
  if (!touchList.length) face.base += (b.deform - face.base) * Math.min(1, dt * 1.5);   // resting squeeze from the tray is not 'squished'
  const sqT = clamp(Math.max((b.deform - face.base - 0.04) * 4, pressing * 0.8), 0, 1);
  const stT = clamp((stretch - 0.4) / 0.9, 0, 1);
  const airT = !b.grounded && touchList.length === 0 ? 1 : 0, k = Math.min(1, dt * 12);
  face.sq += (sqT - face.sq) * k; face.stretch += (stT - face.stretch) * k; face.air += (airT - face.air) * Math.min(1, dt * 6);
  face.happy = Math.max(0, face.happy - dt); face.nextBlink -= dt;
  if (face.nextBlink < 0) { face.blink = 0.13; face.nextBlink = rnd(2.2, 5); }
  face.blink = Math.max(0, face.blink - dt);
  const wide = Math.max(face.stretch, face.air * 0.8);
  const kd = face.sq > 0.7 ? 'squeeze' : face.sq > 0.45 || face.happy > 0 ? 'happy' : wide > 0.35 ? 'wow' : face.blink > 0 ? 'blink' : 'idle';
  if (kd !== faceKind) { faceKind = kd; blobMat.map = faceTex[kd]; }
}

function update(dt) {
  time += dt;
  stat.tear *= Math.exp(-dt * 12);
  if (bx && !bx.gone) updateBox(dt);
  if (state === 'play' && blob) updatePlay(dt);
  else if (state === 'leaving' && blob) {
    leaveT += dt; physicsFrame(dt);
    if (leaveT >= 0.3) {
      for (let i = 0; i < 26; i++) { const a = rnd(0, TAU); spawnConf(blob.cx, blob.cy, blob.cz, Math.cos(a) * rnd(2, 6), rnd(2, 7), Math.sin(a) * rnd(2, 6) * 0.5, rarity.conf[(Math.random() * rarity.conf.length) | 0], rnd(0.6, 1), 1); }
      newBox();
    }
  }
  if (bx && bx.gone && state === 'play') { /* box is out of view; keep it parked */ bx.g.visible = false; }
  // legendary sparkle trail
  if (blob && state === 'play' && rarity.key === 'legendary' && Math.random() < dt * 16) {
    const t = trail[trailCursor++ % 60]; t.life = 0; t.max = rnd(0.5, 0.9);
    t.x = blob.cx + rnd(-1, 1); t.y = blob.cy + rnd(-0.6, 1); t.z = blob.cz + rnd(-0.2, 1); t.vy = rnd(0.2, 0.9);
  }
  updateFx(dt); updateSteam(dt);
  for (const s of bokeh) { s.position.x = s.userData.x0 + Math.sin(time * s.userData.sp + s.userData.ph) * 0.8; s.position.y = s.userData.y0 + Math.cos(time * s.userData.sp * 0.8 + s.userData.ph) * 0.5; }
  audioUpdate(dt, stat);
}

/* ---------------------------------------------------------------------
   LOOP
   --------------------------------------------------------------------- */
let last = 0, running = true;
function frame(now) {
  requestAnimationFrame(frame);
  if (!running) { last = now; return; }
  const raw = (now - (last || now)) / 1000;
  const dt = Math.min(0.05, Math.max(0.001, raw));
  last = now;
  update(dt);
  if (bx) updateBoxVisuals();
  if (blob && blobMesh) syncBlob();
  // camera shake
  if (shakeAmt > 0.004) camera.position.set(camBase.x + rnd(-shakeAmt, shakeAmt), camBase.y + rnd(-shakeAmt, shakeAmt), camBase.z); else camera.position.copy(camBase);
  renderer.render(scene, camera);
  // auto quality: if frames stay slow, drop resolution
  frameAcc += raw; frameN++;
  if (frameN >= 90) {
    if (frameAcc / frameN > 0.024 && prCur > 1) { prCur = Math.max(1, prCur - 0.25); renderer.setPixelRatio(prCur); renderer.setSize(W, H, false); }
    frameAcc = 0; frameN = 0;
  }
}

/* ---------------------------------------------------------------------
   UI WIRING
   --------------------------------------------------------------------- */
function syncTune() {
  ['elastic', 'soft', 'jiggle', 'plump', 'rise', 'stretchy'].forEach((k) => { $('s_' + k).value = S[k]; });
  $('t_sound').classList.toggle('on', !!S.sound);
  $('t_haptics').classList.toggle('on', !!S.haptics);
  $('rarChips').querySelectorAll('.pill').forEach((p) => p.classList.toggle('on', p.dataset.k === S.force));
}
function openTune(open) {
  $('tune').classList.toggle('show', open); $('scrim').classList.toggle('show', open);
  if (open) syncTune();
}
(function wireUI() {
  const chips = $('rarChips');
  ['random'].concat(RAR_ORDER).forEach((k) => {
    const b = document.createElement('button'); b.className = 'pill'; b.dataset.k = k;
    b.textContent = k === 'random' ? 'Random' : RARITIES[k].label.charAt(0) + RARITIES[k].label.slice(1).toLowerCase();
    b.addEventListener('click', () => { S.force = k; save(); syncTune(); hap('selection', 0); });
    chips.appendChild(b);
  });
  ['elastic', 'soft', 'jiggle', 'plump', 'rise', 'stretchy'].forEach((k) => {
    $('s_' + k).addEventListener('input', (e) => { S[k] = parseFloat(e.target.value); buildP(); save(); });
  });
  $('t_sound').addEventListener('click', () => { S.sound = !S.sound; save(); syncTune(); audioInit(); });
  $('t_haptics').addEventListener('click', () => { S.haptics = !S.haptics; save(); syncTune(); hap('light', 0); });
  $('b_defaults').addEventListener('click', () => { Object.assign(S, DEFAULTS, { force: S.force }); buildP(); save(); syncTune(); });
  $('b_close').addEventListener('click', () => openTune(false));
  $('scrim').addEventListener('click', () => openTune(false));
  $('gear').addEventListener('click', () => { audioInit(); openTune(true); });
  $('again').addEventListener('click', () => { audioInit(); leave(); });
  $('cn').textContent = S.count || 0;
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', () => setTimeout(layout, 120));
  document.addEventListener('visibilitychange', () => {
    running = !document.hidden;
    if (A.ctx) { if (document.hidden) A.ctx.suspend(); else A.ctx.resume(); }
  });
})();

layout();
newBox();
requestAnimationFrame(frame);

})();
</script>
