<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>Sky Shield: Air Raid</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
html,body{width:100%;height:100%;overflow:hidden;background:#7EC8E3;touch-action:none;}
#c{position:fixed;top:0;left:0;width:100%;height:100%;display:block;}

/* ── Combo pop ── */
#combo{
  position:fixed;top:22%;left:50%;transform:translateX(-50%) scale(1);
  color:#FFD700;font:900 32px Arial;
  text-shadow:0 0 20px rgba(255,160,0,0.9),0 2px 8px rgba(0,0,0,0.8);
  opacity:0;transition:opacity 0.2s,transform 0.2s;
  pointer-events:none;white-space:nowrap;z-index:20;
}

/* ── Floats ── */
#floats{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:10;}

/* ── Overlay ── */
#overlay{
  position:fixed;inset:0;
  background:
    radial-gradient(circle at 50% 26%,rgba(33,143,205,.34),transparent 33%),
    linear-gradient(160deg,rgba(4,10,21,.94) 0%,rgba(2,24,39,.97) 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:100;pointer-events:all;
  backdrop-filter:blur(8px);
  overflow:hidden;
}
#overlay:before{
  content:"";position:absolute;inset:-20%;opacity:.16;pointer-events:none;
  background-image:linear-gradient(rgba(135,227,255,.3) 1px,transparent 1px),linear-gradient(90deg,rgba(135,227,255,.3) 1px,transparent 1px);
  background-size:52px 52px;transform:perspective(520px) rotateX(64deg) translateY(34%);mask-image:linear-gradient(to bottom,transparent 5%,#000 52%,transparent 92%);
}
#overlay:after{content:"";position:absolute;width:min(78vw,680px);aspect-ratio:1;border:1px solid rgba(114,226,255,.12);border-radius:50%;box-shadow:0 0 0 55px rgba(114,226,255,.03),0 0 0 110px rgba(114,226,255,.02);pointer-events:none}
.overlay-card{
  position:relative;z-index:2;width:min(430px,calc(100vw - 36px));padding:34px 34px 28px;text-align:center;
  background:linear-gradient(145deg,rgba(13,35,51,.88),rgba(5,18,30,.8));border:1px solid rgba(143,231,255,.26);
  border-radius:26px;box-shadow:0 30px 80px rgba(0,0,0,.46),inset 0 1px rgba(255,255,255,.08)
}
.mission-emblem{
  width:78px;height:78px;margin:0 auto 19px;display:grid;place-items:center;border-radius:50%;
  color:#9bedff;background:radial-gradient(circle,rgba(71,202,255,.2),rgba(12,46,66,.42));
  border:1px solid rgba(142,231,255,.42);box-shadow:0 0 34px rgba(42,190,255,.22)
}
.mission-emblem svg{width:48px;height:48px;filter:drop-shadow(0 0 8px rgba(88,220,255,.58))}
.overlay-kicker{color:#82dff9;font:800 10px Arial;letter-spacing:3px;margin-bottom:9px}
#overlay h1{
  color:#fff;font:900 clamp(34px,8vw,48px) Arial;letter-spacing:-1.5px;
  text-shadow:0 0 34px rgba(100,201,255,.42);margin-bottom:9px;
}
#overlay .sub{
  color:rgba(231,247,255,.68);font:500 14px Arial;
  text-align:center;line-height:1.5;margin:0 auto 24px;max-width:310px;
}
#play-btn{
  width:100%;background:linear-gradient(135deg,#85edff,#16a8e7);
  color:#04121a;font:900 15px Arial;padding:16px 24px;border-radius:14px;border:none;letter-spacing:1.8px;
  box-shadow:0 12px 30px rgba(0,155,219,.28),inset 0 1px rgba(255,255,255,.7);
  position:relative;z-index:101;pointer-events:auto;touch-action:manipulation;cursor:pointer
}
#play-btn:after{content:"›";position:absolute;right:19px;top:50%;transform:translateY(-54%);font-size:27px;font-weight:500}
.mission-strip{display:flex;justify-content:center;gap:8px;margin:0 0 24px}
.mission-chip{min-width:88px;padding:9px 10px;border-radius:12px;background:rgba(127,222,255,.07);border:1px solid rgba(127,222,255,.13);color:rgba(226,247,255,.68);font:800 9px Arial;letter-spacing:1.2px}
.mission-chip b{display:block;color:#fff;font-size:17px;letter-spacing:0;margin-bottom:2px}
.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 24px}
.result-stat{padding:12px 5px;border-radius:13px;background:rgba(127,222,255,.07);border:1px solid rgba(127,222,255,.12);color:rgba(220,244,255,.55);font:800 8px Arial;letter-spacing:1.3px}
.result-stat b{display:block;color:#fff;font-size:22px;letter-spacing:0;margin-bottom:3px}
.outcome-emblem.success{color:#87ffc5;border-color:rgba(91,255,174,.45);box-shadow:0 0 34px rgba(50,255,160,.18)}
.outcome-emblem.danger{color:#ff9a8b;border-color:rgba(255,112,91,.42);box-shadow:0 0 34px rgba(255,74,51,.18)}
.outcome-emblem .outcome-symbol{font:900 34px Arial}
@media(max-width:520px){.overlay-card{padding:27px 22px 22px;border-radius:22px}.mission-emblem{width:68px;height:68px}.mission-strip{gap:6px}.mission-chip{min-width:0;flex:1}}

/* ── Missile defense HUD ── */
#hud{position:fixed;inset:0;z-index:30;pointer-events:none;color:#fff;font-family:Arial,sans-serif}
.hud-panel{
  position:absolute;background:linear-gradient(145deg,rgba(4,12,23,.82),rgba(12,28,42,.7));
  border:1px solid rgba(128,225,255,.28);box-shadow:0 12px 35px rgba(0,0,0,.28);
  backdrop-filter:blur(8px);border-radius:16px
}
#mission-panel{
  position:absolute;top:max(12px,env(safe-area-inset-top));padding:7px 13px;border:1px solid rgba(116,224,255,.34);
  border-radius:2px;background:linear-gradient(90deg,rgba(4,18,28,.68),rgba(4,18,28,.24));
  box-shadow:inset 0 1px rgba(205,247,255,.14);backdrop-filter:blur(4px);
  clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);
  display:flex;align-items:center;gap:10px;min-width:0
}
#mission-panel{left:50%;transform:translateX(-50%);white-space:nowrap}
.compact-readout{display:flex;align-items:baseline;gap:5px;font-size:11px;color:rgba(255,255,255,.55);letter-spacing:1px}
.compact-readout .hud-value{font-size:14px;color:#fff}
.cockpit-divider{width:1px;height:18px;background:rgba(117,223,255,.32)}
.eyebrow{font-size:9px;font-weight:900;letter-spacing:2.4px;color:#75dfff;margin-bottom:8px}
.hud-row{display:flex;align-items:baseline;justify-content:space-between;gap:18px;margin-top:5px}
.hud-label{font-size:10px;font-weight:800;letter-spacing:1.3px;color:rgba(255,255,255,.58)}
.hud-value{font-size:18px;font-weight:900;font-variant-numeric:tabular-nums}
#target-card{
  left:50%;top:max(60px,calc(env(safe-area-inset-top) + 52px));transform:translateX(-50%);
  min-width:220px;padding:11px 18px;text-align:center;opacity:0;transition:opacity .2s,transform .2s
}
#target-card.visible{opacity:1;transform:translateX(-50%) translateY(0)}
#target-card .target-name{font-size:13px;font-weight:900;letter-spacing:1px}
#target-card .target-state{font-size:10px;letter-spacing:1.6px;color:#ffcf57;margin-top:4px}
#instruction{display:none}
#lock-panel{
  position:absolute;right:max(18px,env(safe-area-inset-right));top:50%;transform:translateY(-50%) scale(.92);
  width:236px;padding:15px;opacity:0;pointer-events:none;transition:.2s
}
#lock-panel.active{opacity:1;pointer-events:auto;transform:translateY(-50%) scale(1)}
.lock-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}
.lock-title{font-size:11px;font-weight:900;letter-spacing:2px}
#lock-attempts{font-size:10px;color:rgba(255,255,255,.58)}
#lock-wheel{
  position:relative;width:172px;height:172px;margin:0 auto;border-radius:50%;
  background:conic-gradient(from 0deg,#152331 0deg,#152331 var(--start),#40ef9c var(--start),#ccffe8 var(--end),#152331 var(--end),#152331 360deg);
  border:3px solid rgba(167,228,255,.72);box-shadow:inset 0 0 30px rgba(0,0,0,.82),0 0 30px rgba(0,180,255,.12);
  touch-action:manipulation;cursor:pointer
}
#lock-wheel:after{content:"";position:absolute;inset:25px;border-radius:50%;background:rgba(4,11,19,.93);border:1px solid rgba(255,255,255,.16)}
#lock-needle{
  position:absolute;left:50%;top:50%;width:3px;height:74px;transform-origin:50% 100%;
  transform:translate(-50%,-100%) rotate(0deg);background:linear-gradient(#ff4a45,#fff);
  border-radius:4px;box-shadow:0 0 8px #ff3131;z-index:2
}
#lock-needle:after{content:"";position:absolute;left:50%;top:-7px;transform:translateX(-50%);border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:12px solid #ff554f}
#lock-center{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;width:48px;height:48px;border-radius:50%;
  display:grid;place-items:center;background:#0c1823;border:2px solid #89e8ff;font-size:17px;font-weight:900
}
#lock-feedback{min-height:28px;margin-top:9px;text-align:center;font-size:10px;font-weight:900;letter-spacing:1.4px;color:#8cf3ff}
#fire-panel{
  position:absolute;left:50%;bottom:max(20px,env(safe-area-inset-bottom));
  width:0;height:92px;pointer-events:auto
}
.weapon-btn{overflow:visible;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.weapon-icon{width:38px;height:38px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.45));pointer-events:none}
#fire-btn .weapon-icon{width:36px;height:52px}
#missile-count{font-size:18px;min-width:38px;right:4px;bottom:4px;padding:3px 5px;background:rgba(0,0,0,.68)}
.weapon-icon path,.weapon-icon ellipse,.weapon-icon line,.weapon-icon polyline{vector-effect:non-scaling-stroke}
.ammo-count{position:absolute;right:6px;bottom:5px;min-width:25px;padding:2px 4px;border-radius:9px;background:rgba(0,0,0,.5);font-size:11px;font-weight:900;letter-spacing:.3px;text-shadow:0 2px 5px #000;line-height:1}
.reload-ring{position:absolute;inset:-8px;opacity:0;pointer-events:none;transition:opacity .18s}
.reload-ring svg{width:100%;height:100%;display:block;transform:rotate(-90deg);overflow:visible}
.reload-track,.reload-progress{fill:none;stroke-width:2.3}
.reload-track{stroke:rgba(255,255,255,.16)}
.reload-progress{stroke:#fff;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;filter:drop-shadow(0 0 3px rgba(255,255,255,.95));transition:stroke-dashoffset .08s linear}
.weapon-btn.reloading .reload-ring{opacity:1;animation:reloadPulse .7s ease-in-out infinite alternate}
.weapon-btn.armed{box-shadow:0 0 0 7px rgba(255,245,184,.38),0 0 34px rgba(255,221,91,.9),0 10px 28px rgba(0,0,0,.45)!important}
.weapon-btn.armed .weapon-icon{animation:bombArmedPulse .55s ease-in-out infinite alternate}
@keyframes reloadPulse{from{filter:brightness(.85)}to{filter:brightness(1.45)}}
@keyframes bombArmedPulse{from{transform:scale(.94);filter:drop-shadow(0 0 2px #fff)}to{transform:scale(1.08);filter:drop-shadow(0 0 8px #fff4a0)}}
#fire-btn{
  position:absolute;left:0;bottom:0;transform:translateX(-50%);
  width:92px;height:92px;border-radius:50%;border:3px solid rgba(255,255,255,.85);
  color:#fff;background:radial-gradient(circle at 35% 25%,#ff795d,#c01818 72%);font:900 17px Arial;letter-spacing:1px;
  box-shadow:0 0 0 6px rgba(143,16,16,.35),0 10px 28px rgba(0,0,0,.45);cursor:pointer;touch-action:manipulation
}
#fire-btn:disabled{cursor:default;background:radial-gradient(circle at 35% 25%,#874d46,#501818 72%)}
.lock-label{display:none;font:900 13px Arial;letter-spacing:1.6px;color:#04121a}
#fire-btn.locking{
  background:radial-gradient(circle at 35% 25%,#8ff2ff,#0e6b8e 72%);
  border-color:rgba(190,245,255,.95);
  box-shadow:0 0 0 6px rgba(14,107,142,.4),0 0 30px rgba(120,230,255,.55),0 10px 28px rgba(0,0,0,.45);
  animation:lockPulse .6s ease-in-out infinite alternate;cursor:pointer
}
#fire-btn.locking .weapon-icon,#fire-btn.locking #missile-count{display:none}
#fire-btn.locking .lock-label{display:block}
@keyframes lockPulse{from{filter:brightness(.92)}to{filter:brightness(1.18)}}
#bomb-btn{
  position:absolute;right:98px;bottom:4px;
  width:70px;height:70px;border-radius:50%;border:2px solid rgba(255,231,177,.9);
  color:#fff;background:radial-gradient(circle at 35% 25%,#ffc768,#8e4b12 72%);
  font:900 14px Arial;letter-spacing:1px;box-shadow:0 0 0 5px rgba(142,75,18,.24),0 9px 24px rgba(0,0,0,.42);
  cursor:pointer;touch-action:manipulation
}
#bomb-btn:disabled{background:radial-gradient(circle at 35% 25%,#89785e,#49301a 72%)}
#flare-btn{
  position:absolute;left:98px;bottom:4px;
  width:70px;height:70px;border-radius:50%;border:2px solid rgba(210,247,255,.88);
  color:#fff;background:radial-gradient(circle at 35% 25%,#74e9ff,#11608c 72%);
  font:900 14px Arial;letter-spacing:1px;box-shadow:0 0 0 5px rgba(17,96,140,.24),0 9px 24px rgba(0,0,0,.42);
  cursor:pointer;touch-action:manipulation
}
#flare-btn:disabled{background:radial-gradient(circle at 35% 25%,#5c8290,#163b50 72%)}
.weapon-btn:disabled .weapon-icon,.weapon-btn:disabled .ammo-count{opacity:.78;filter:grayscale(.65)}
#toast{
  position:absolute;left:50%;top:max(72px,calc(env(safe-area-inset-top) + 58px));transform:translate(-50%,-8px);opacity:0;
  min-width:270px;max-width:calc(100vw - 32px);padding:10px 15px 10px 17px;border-radius:9px;
  background:rgba(5,17,27,.82);border:1px solid rgba(255,255,255,.13);border-left:3px solid currentColor;
  box-shadow:0 12px 30px rgba(0,0,0,.3);backdrop-filter:blur(9px);
  font-size:12px;font-weight:900;letter-spacing:1.8px;text-align:left;text-shadow:none;transition:.18s
}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast small{display:block;font-size:8px;letter-spacing:1.5px;color:rgba(223,244,250,.62);margin-top:3px}
#danger-vignette{position:absolute;inset:0;opacity:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(255,0,0,.55));transition:.25s}
#danger-vignette.active{opacity:1}

@media(max-width:720px){
  #mission-panel{padding:6px 9px;gap:6px}.compact-readout{font-size:8px}.compact-readout .hud-value{font-size:11px}
  #target-card{top:60px;min-width:178px;padding:8px 12px}
  #lock-panel{width:190px;right:10px;padding:12px}
  #lock-wheel{width:138px;height:138px}#lock-needle{height:58px}
  #fire-btn{width:76px;height:76px;font-size:12px}
  #fire-panel{height:76px}
  #bomb-btn{right:82px;width:58px;height:58px;font-size:12px}
  #flare-btn{left:82px;width:58px;height:58px;font-size:12px}
  .weapon-icon{width:30px;height:30px}.ammo-count{right:3px;bottom:3px;font-size:9px;min-width:21px}.reload-ring{inset:-7px}
}
@media(max-width:600px){
  #lock-panel{left:50%;right:auto;top:auto;bottom:112px;transform:translateX(-50%) scale(.92)}
  #lock-panel.active{transform:translateX(-50%) scale(1)}
  #fire-panel{bottom:18px}
  #mission-panel{top:8px}
}
@media(orientation:portrait){
  #mission-panel{top:max(64px,calc(env(safe-area-inset-top) + 16px))}
  #target-card{top:max(108px,calc(env(safe-area-inset-top) + 60px))}
  #toast{top:max(112px,calc(env(safe-area-inset-top) + 64px))}
  #fire-panel{bottom:max(42px,calc(env(safe-area-inset-bottom) + 26px))}
}
@media(orientation:landscape) and (min-width:721px){
  #fire-panel{height:82px}
  #fire-btn{width:82px;height:82px}
  #fire-btn .weapon-icon{width:33px;height:47px}
  #bomb-btn{right:112px;width:62px;height:62px}
  #flare-btn{left:112px;width:62px;height:62px}
  #bomb-btn .weapon-icon,#flare-btn .weapon-icon{width:33px;height:33px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="combo"></div>
<div id="floats"></div>

<div id="hud" style="display:none">
  <div id="danger-vignette"></div>
  <div id="mission-panel">
    <span class="compact-readout"><span id="time-value" class="hud-value">00:00</span></span>
    <span class="cockpit-divider"></span>
    <span class="compact-readout">DRONES <span id="kills-value" class="hud-value">0</span></span>
    <span class="cockpit-divider"></span>
    <span class="compact-readout">TOWERS <span id="towers-value" class="hud-value">0/0</span></span>
  </div>
  <div id="target-card" class="hud-panel">
    <div class="target-name">TARGET ACQUIRED</div>
    <div class="target-state">ESTABLISH RADAR LOCK</div>
  </div>
  <div id="lock-panel" class="hud-panel">
    <div class="lock-head"><span class="lock-title">RADAR LOCK</span><span id="lock-attempts">ATTEMPT 1</span></div>
    <div id="lock-wheel">
      <div id="lock-needle"></div>
      <div id="lock-center">◎</div>
    </div>
    <div id="lock-feedback">HIT THE GREEN WINDOW — TAP MISSILE TO STOP</div>
  </div>
  <div id="fire-panel">
    <button id="bomb-btn" class="weapon-btn" aria-label="Drop bomb">
      <span class="reload-ring" aria-hidden="true"><svg viewBox="0 0 44 44"><circle class="reload-track" cx="22" cy="22" r="15.9155"/><circle class="reload-progress" cx="22" cy="22" r="15.9155"/></svg></span>
      <svg class="weapon-icon" viewBox="0 0 48 48" aria-hidden="true"><path d="M21 7h6v8l4 4v15c0 5-3 9-7 11-4-2-7-6-7-11V19l4-4V7Z" fill="#202427" stroke="#fff" stroke-width="2"/><path d="m17 16-5-5v10l5 3m14-8 5-5v10l-5 3" fill="#f2b74e" stroke="#fff" stroke-width="2"/><path d="M18 27h12" stroke="#f2b74e" stroke-width="3"/></svg>
      <span id="bomb-count" class="ammo-count">2/2</span>
    </button>
    <button id="fire-btn" class="weapon-btn" disabled aria-label="Fire missile">
      <span class="reload-ring" aria-hidden="true"><svg viewBox="0 0 44 44"><circle class="reload-track" cx="22" cy="22" r="15.9155"/><circle class="reload-progress" cx="22" cy="22" r="15.9155"/></svg></span>
      <svg class="weapon-icon" viewBox="0 0 48 56" aria-hidden="true">
        <path d="M17 37V17C17 11 20 6 24 2c4 4 7 9 7 15v20Z" fill="#fff"/>
        <path d="M17 27c-5 3-8 8-9 14l9-5m14-9c5 3 8 8 9 14l-9-5Z" fill="#dce4e7"/>
        <path d="M20 37h8l-4 16Z" fill="#ff9a2b"/>
        <circle cx="24" cy="17" r="3.5" fill="#d22d2d"/>
      </svg>
      <span id="missile-count" class="ammo-count">6/6</span>
      <span id="fire-lock-label" class="lock-label">STOP</span>
    </button>
    <button id="flare-btn" class="weapon-btn" aria-label="Deploy flares">
      <span class="reload-ring" aria-hidden="true"><svg viewBox="0 0 44 44"><circle class="reload-track" cx="22" cy="22" r="15.9155"/><circle class="reload-progress" cx="22" cy="22" r="15.9155"/></svg></span>
      <svg class="weapon-icon" viewBox="0 0 48 48" aria-hidden="true">
        <path d="M24 3 41 10v12c0 11-7 20-17 24C14 42 7 33 7 22V10l17-7Z" fill="#f4fdff"/>
        <path d="M24 8 36 13v9c0 8-5 15-12 19-7-4-12-11-12-19v-9l12-5Z" fill="#1683ad"/>
        <path d="m24 13 2.6 6.2 6.4.8-4.8 4.2 1.5 6.3-5.7-3.3-5.7 3.3 1.5-6.3L15 20l6.4-.8L24 13Z" fill="#ffe777"/>
      </svg>
      <span id="flare-count" class="ammo-count">3/3</span>
    </button>
  </div>
  <div id="instruction">TAP AN INCOMING DRONE TO ACQUIRE</div>
  <div id="toast"></div>
</div>

<!-- Start overlay -->
<div id="overlay">
  <div class="overlay-card">
    <div class="mission-emblem">
      <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <circle cx="32" cy="32" r="24" stroke="currentColor" stroke-width="1.5" opacity=".36"/>
        <circle cx="32" cy="32" r="15" stroke="currentColor" stroke-width="1.5" opacity=".55"/>
        <path d="M32 8v10M32 46v10M8 32h10M46 32h10" stroke="currentColor" stroke-width="2"/>
        <path d="m32 20 5 9 11 3-11 3-5 9-5-9-11-3 11-3 5-9Z" fill="currentColor"/>
      </svg>
    </div>
    <div class="overlay-kicker">TACTICAL AIR DEFENSE</div>
    <h1>SKY SHIELD</h1>
    <div class="sub">Protect the relay network. Eliminate every launch site.</div>
    <div class="mission-strip">
      <div class="mission-chip"><b>5</b>SITES</div>
      <div class="mission-chip"><b>6</b>MISSILES</div>
      <div class="mission-chip"><b>3</b>FLARES</div>
    </div>
    <button id="play-btn">START MISSION</button>

</script>
<script>(function(){
  var W=window.innerWidth, H=window.innerHeight;

  // ── Renderer ────────────────────────────────────────────────────────────────
  var renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
  renderer.setSize(W,H);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.15;

  // ── Scene ───────────────────────────────────────────────────────────────────
  var scene=new THREE.Scene();
  scene.background=new THREE.Color(0x7EC8E3);
  scene.fog=new THREE.Fog(0xB8DFF0,120,520);
  var skyColorLow=new THREE.Color(0x7EC8E3);
  var skyColorHigh=new THREE.Color(0x071225);
  var fogColorLow=new THREE.Color(0xB8DFF0);
  var fogColorHigh=new THREE.Color(0x08111F);
  var PLANET_RADIUS=1024;
  var GROUND_Y=-10;

  // ── Camera ──────────────────────────────────────────────────────────────────
  // Chase camera with enough horizon in frame to keep the sky visible.
  var camera=new THREE.PerspectiveCamera(60,W/H,0.1,1600);
  camera.position.set(0,13,18);
  camera.lookAt(0,-2,-12);

  // Gradient sky dome and stars. The dome follows the camera so the sky never
  // resolves into a flat single-color backdrop at high altitude.
  var skyUniforms={
    topColor:{value:new THREE.Color(0x5DB8D7)},
    horizonColor:{value:new THREE.Color(0xB8DFF0)},
    spaceColor:{value:new THREE.Color(0x020712)},
    highAlt:{value:0}
  };
  var skyDome=new THREE.Mesh(
    new THREE.SphereGeometry(460,32,18),
    new THREE.ShaderMaterial({
      uniforms:skyUniforms,
      vertexShader:[
        'varying float vY;',
        'void main(){',
        '  vY=normalize(position).y;',
        '  gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);',
        '}'
      ].join('\n'),
      fragmentShader:[
        'uniform vec3 topColor;',
        'uniform vec3 horizonColor;',
        'uniform vec3 spaceColor;',
        'uniform float highAlt;',
        'varying float vY;',
        'void main(){',
        '  float skyMix=smoothstep(-0.42,0.76,vY);',
        '  vec3 lower=mix(horizonColor,topColor,skyMix);',
        '  float upperMix=smoothstep(-0.1,0.92,vY);',
        '  vec3 upper=mix(vec3(0.015,0.04,0.09),spaceColor,upperMix);',
        '  vec3 col=mix(lower,upper,highAlt);',
        '  gl_FragColor=vec4(col,1.0);',
        '}'
      ].join('\n'),
      side:THREE.BackSide,
      depthWrite:false,
      depthTest:false
    }));
  skyDome.renderOrder=-100;
  scene.add(skyDome);

  var starGeo=new THREE.BufferGeometry();
  var starVerts=[];
  for(var stari=0;stari<520;stari++){
    var theta=Math.random()*Math.PI*2;
    var y=-0.95+Math.random()*1.95;
    var r=Math.sqrt(Math.max(0.01,1-y*y))*(330+Math.random()*95);
    starVerts.push(Math.cos(theta)*r,y*(260+Math.random()*120),Math.sin(theta)*r);
  }
  starGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(starVerts),3));
  var starMat=new THREE.PointsMaterial({
    color:0xFFFFFF,
    size:1.35,
    transparent:true,
    opacity:0,
    depthWrite:false,
    depthTest:true,
    sizeAttenuation:false,
    fog:false
  });
  var starField=new THREE.Points(starGeo,starMat);
  starField.renderOrder=-90;
  scene.add(starField);

  // ── Lights ──────────────────────────────────────────────────────────────────
  var sun=new THREE.DirectionalLight(0xFFF5D6,2.8);
  sun.position.set(60,120,40);
  sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048);
  sun.shadow.camera.near=1; sun.shadow.camera.far=300;
  sun.shadow.camera.left=-80; sun.shadow.camera.right=80;
  sun.shadow.camera.top=80;  sun.shadow.camera.bottom=-80;
  sun.shadow.bias=-0.001;
  scene.add(sun);
  scene.add(sun.target);
  var ambientLight=new THREE.AmbientLight(0x88BBFF,1.1);
  var hemiLight=new THREE.HemisphereLight(0x7EC8E3,0x3d7a22,0.7);
  scene.add(ambientLight);
  scene.add(hemiLight);

  // ── Ground / Planet ─────────────────────────────────────────────────────────
  // A large sphere sits tangent to the player at ground level. Near the ground it
  // reads as flat terrain; climbing reveals the curvature.
  var groundGeometry=new THREE.SphereGeometry(PLANET_RADIUS,96,48);
  var groundPositions=groundGeometry.getAttribute('position');
  groundGeometry.setAttribute('color',new THREE.BufferAttribute(new Float32Array(groundPositions.count*3),3));
  var groundMat=new THREE.MeshLambertMaterial({color:0xFFFFFF,vertexColors:true});
  var ground=new THREE.Mesh(groundGeometry,groundMat);
  ground.position.set(0,GROUND_Y-PLANET_RADIUS,0);
  ground.receiveShadow=true;
  scene.add(ground);
  var friendlyGroundColor=new THREE.Color(0x777943);
  var friendlyGroundLight=new THREE.Color(0x8C8751);
  var borderGroundColor=new THREE.Color(0x8A6742);
  var enemyGroundColor=new THREE.Color(0x754333);
  var enemyGroundLight=new THREE.Color(0x90543A);
  var groundPaintColor=new THREE.Color();
  function paintGroundHemispheres(){
    var colors=ground.geometry.getAttribute('color');
    for(var pi=0;pi<groundPositions.count;pi++){
      var worldX=ground.position.x+groundPositions.getX(pi);
      var worldZ=ground.position.z+groundPositions.getZ(pi);
      var friendlyMix=Math.max(0,Math.min(1,(worldZ+90)/180));
      var variation=0.5+0.5*Math.sin(worldX*0.022+Math.sin(worldZ*0.017)*2.1);
      var fineVariation=0.5+0.5*Math.sin(worldX*0.071-worldZ*0.053);
      if(friendlyMix<0.5){
        var enemyBlend=friendlyMix*2;
        groundPaintColor.copy(enemyGroundColor).lerp(enemyGroundLight,variation*0.34);
        groundPaintColor.lerp(borderGroundColor,enemyBlend);
      }else{
        var friendlyBlend=(friendlyMix-0.5)*2;
        groundPaintColor.copy(borderGroundColor).lerp(friendlyGroundColor,friendlyBlend);
        groundPaintColor.lerp(friendlyGroundLight,friendlyBlend*(variation*0.24+fineVariation*0.08));
      }
      colors.setXYZ(pi,groundPaintColor.r,groundPaintColor.g,groundPaintColor.b);
    }
    colors.needsUpdate=true;
  }
  paintGroundHemispheres();

  var stoneGroup=new THREE.Group();
  var stoneMats=[
    new THREE.MeshLambertMaterial({color:0x807568}),
    new THREE.MeshLambertMaterial({color:0x5E5A52}),
    new THREE.MeshLambertMaterial({color:0x9A9184})
  ];
  function makeStone(x,z,s){
    var rock=new THREE.Mesh(
      new THREE.DodecahedronGeometry(s,0),
      stoneMats[Math.floor(Math.random()*stoneMats.length)]);
    rock.scale.set(1.0+Math.random()*0.8,0.35+Math.random()*0.45,0.8+Math.random()*0.6);
    rock.rotation.set(Math.random()*0.5,Math.random()*Math.PI,Math.random()*0.4);
    rock.position.set(x,0,z);
    rock.castShadow=true;
    rock.userData={terrainLift:0.08};
    return rock;
  }
  for(var si=0;si<48;si++){
    var clusterX=(Math.random()-0.5)*320, clusterZ=(Math.random()-0.5)*320;
    var count=1+Math.floor(Math.random()*4);
    for(var sj=0;sj<count;sj++){
      stoneGroup.add(makeStone(clusterX+(Math.random()-0.5)*7,clusterZ+(Math.random()-0.5)*7,0.35+Math.random()*0.55));
    }
  }
  scene.add(stoneGroup);

  // ── Clouds ───────────────────────────────────────────────────────────────────
  var cloudMat=new THREE.MeshLambertMaterial({color:0xFFFFFF,transparent:true,opacity:0.88});
  var cloudGroup=new THREE.Group();
  function makeCloud(x,y,z,scale){
    var cg=new THREE.Group();
    var puffs=[
      [0,0,0,1.0],[1.4,0.3,0.4,0.8],[-1.2,0.2,-0.3,0.75],
      [0.6,0.8,0.2,0.65],[-0.5,0.6,-0.6,0.6],[0,0.5,1.0,0.55]
    ];
    for(var pi=0;pi<puffs.length;pi++){
      var p=puffs[pi];
      var pm=new THREE.Mesh(new THREE.SphereGeometry(p[3]*scale,7,5),cloudMat);
      pm.position.set(p[0]*scale,p[1]*scale,p[2]*scale);
      cg.add(pm);
    }
    cg.position.set(x,y,z);
    return cg;
  }
  var cloudData=[];
  for(var ci=0;ci<22;ci++){
    var cx2=(Math.random()-0.5)*280;
    var cy2=8+Math.random()*18;
    var cz2=(Math.random()-0.5)*280;
    var cs=1.8+Math.random()*2.2;
    var cl=makeCloud(cx2,cy2,cz2,cs);
    cloudGroup.add(cl);
    cloudData.push({mesh:cl,baseX:cx2,baseZ:cz2});
  }
  scene.add(cloudGroup);

  // ── Trees ───────────────────────────────────────────────────────────────────
  // Two kinds: pine and round canopy. Arranged in clusters for natural look.
  var treeMats=[
    new THREE.MeshLambertMaterial({color:0x2d6a1f}),
    new THREE.MeshLambertMaterial({color:0x3a7a28}),
    new THREE.MeshLambertMaterial({color:0x1e5c15}),
    new THREE.MeshLambertMaterial({color:0x4a8c2a}),
  ];
  var trunkMat=new THREE.MeshLambertMaterial({color:0x5c3d1a});

  function makePine(x,z,s){
    var g=new THREE.Group();
    var trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.12*s,0.18*s,1.8*s,6),trunkMat);
    trunk.position.y=-9.1; trunk.castShadow=true; g.add(trunk);
    var tiers=[[0.9*s,2.0*s,0],[0.65*s,1.5*s,1.1*s],[0.4*s,1.1*s,1.95*s]];
    for(var ti=0;ti<tiers.length;ti++){
      var cone=new THREE.Mesh(
        new THREE.ConeGeometry(tiers[ti][0],tiers[ti][1],7),
        treeMats[Math.floor(Math.random()*treeMats.length)]);
      cone.position.y=-9.1+0.9*s+tiers[ti][2]; cone.castShadow=true; g.add(cone);
    }
    g.position.set(x,0,z); return g;
  }

  function makeRound(x,z,s){
    var g=new THREE.Group();
    var trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.14*s,0.2*s,1.6*s,6),trunkMat);
    trunk.position.y=-9.2; trunk.castShadow=true; g.add(trunk);
    var canopy=new THREE.Mesh(
      new THREE.SphereGeometry(1.1*s,8,6),
      treeMats[Math.floor(Math.random()*treeMats.length)]);
    canopy.position.y=-7.6; canopy.castShadow=true; g.add(canopy);
    g.position.set(x,0,z); return g;
  }

  // Trees in varied clusters and scattered groves.
  var treeGroup=new THREE.Group();
  for(var ci=0;ci<30;ci++){
    var cx=(Math.random()-0.5)*330, cz=(Math.random()-0.5)*330;
    var count=5+Math.floor(Math.random()*10);
    for(var ti=0;ti<count;ti++){
      var tx=cx+(Math.random()-0.5)*24, tz=cz+(Math.random()-0.5)*24;
      var s=0.55+Math.random()*0.85;
      var tree=Math.random()<0.6?makePine(tx,tz,s):makeRound(tx,tz,s);
      treeGroup.add(tree);
    }
  }
  for(var ti2=0;ti2<70;ti2++){
    var s2=0.45+Math.random()*0.75;
    treeGroup.add((Math.random()<0.65?makePine:makeRound)((Math.random()-0.5)*360,(Math.random()-0.5)*360,s2));
  }
  scene.add(treeGroup);

  // ── Grass and radio towers for motion/scale ────────────────────────────────
  var grassGroup=new THREE.Group();
  var grassMats=[
    new THREE.MeshLambertMaterial({color:0x5F8F2F}),
    new THREE.MeshLambertMaterial({color:0x3F7A2A}),
    new THREE.MeshLambertMaterial({color:0x87A83A})
  ];
  function makeGrassTuft(x,z,s){
    var g=new THREE.Group();
    for(var bi=0;bi<4;bi++){
      var blade=new THREE.Mesh(
        new THREE.ConeGeometry(0.035*s,0.75*s,3),
        grassMats[Math.floor(Math.random()*grassMats.length)]);
      blade.position.set((Math.random()-0.5)*0.45*s,-9.65+0.08*Math.random(),(Math.random()-0.5)*0.45*s);
      blade.rotation.z=(Math.random()-0.5)*0.45;
      blade.rotation.x=(Math.random()-0.5)*0.3;
      g.add(blade);
    }
    g.position.set(x,0,z);
    return g;
  }
  for(var gi=0;gi<360;gi++){
    grassGroup.add(makeGrassTuft((Math.random()-0.5)*360,(Math.random()-0.5)*360,0.55+Math.random()*0.95));
  }
  scene.add(grassGroup);

  var towerGroup=new THREE.Group();
  var towerRed=new THREE.MeshLambertMaterial({color:0xD63A2F});
  var towerWhite=new THREE.MeshLambertMaterial({color:0xF2F4F6});
  var towerDark=new THREE.MeshLambertMaterial({color:0x404040});
  var beaconMat=new THREE.MeshBasicMaterial({color:0xFF3030});
  var TOWER_MAX_HP=5;
  function roundRectPath(ctx,x,y,w,h,r){
    if(w<=0)return;
    r=Math.min(r,w/2,h/2);
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);

  function makePrism(points,topY,bottomY,mat){
    var verts=[],idx=[],n=points.length;
    for(var i=0;i<n;i++) verts.push(points[i][0],topY,points[i][1]);
    for(var j=0;j<n;j++) verts.push(points[j][0],bottomY,points[j][1]);
    for(var a=1;a<n-1;a++) idx.push(0,a,a+1);
    for(var b=1;b<n-1;b++) idx.push(n,n+b+1,n+b);
    for(var k=0;k<n;k++){
      var kk=(k+1)%n;
      idx.push(k,n+k,kk);
      idx.push(kk,n+k,n+kk);
    }
    var geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(verts),3));
    geo.setIndex(new THREE.BufferAttribute(new Uint16Array(idx),1));
    geo.computeVertexNormals();
    var mesh=new THREE.Mesh(geo,mat);
    mesh.castShadow=true;
    return mesh;
  }

  function tryAcquireTarget(x,y){
    if(!gameActive) return false;
    var rect=canvas.getBoundingClientRect();
    targetPointer.x=((x-rect.left)/rect.width)*2-1;
    targetPointer.y=-((y-rect.top)/rect.height)*2+1;
    targetRaycaster.setFromCamera(targetPointer,camera);
    var meshes=[];
    for(var i=0;i<targets.length;i++){
      if(!targets[i].userData.alive) continue;
      targets[i].traverse(function(part){if(part.isMesh)meshes.push(part);});
    }
    for(var gi=0;gi<enemyLaunchers.length;gi++){
      if(enemyLaunchers[gi].userData.alive)enemyLaunchers[gi].traverse(function(part){if(part.isMesh)meshes.push(part);});
    }
    var hits=targetRaycaster.intersectObjects(meshes,false);
    if(!hits.length) return false;
    var root=hits[0].object.userData.targetRoot;
    if(root){selectTarget(root);return true;}
    return false;
  }

  function estimateBombFlightFrames(originY,verticalVelocity,targetY){
    var predictedY=originY;
    var predictedVerticalVelocity=verticalVelocity;
    for(var predictionFrame=1;predictionFrame<260;predictionFrame++){
      predictedVerticalVelocity-=0.0115;
      predictedY+=predictedVerticalVelocity;
      if(predictedY<=targetY)return predictionFrame;
    }
    return 259;
  }

  function updateBombAim(){

    var source=jet.localToWorld(new THREE.Vector3(0,-0.72,0.45));
    var jetForward=new THREE.Vector3(0,0,-1).applyQuaternion(jet.quaternion);
    jetForward.y=0;
    jetForward.normalize();
    var altitudeAboveTerrain=Math.max(0,source.y-planetSurfaceY(source.x,source.z));
    var sightDistance=Math.max(18,Math.min(34,18+altitudeAboveTerrain*0.72));
    var impact=new THREE.Vector3(
      source.x-jetForward.x*sightDistance,
      0,
      source.z-jetForward.z*sightDistance);
    impact.y=planetSurfaceY(impact.x,impact.z)+0.16;
    bombAimMarker.visible=true;
    bombAimMarker.position.copy(impact);
    var aimPulse=1+Math.sin(Date.now()*0.012)*0.08;

    bombAimMarker.rotation.y+=0.015;

  function makeWindLine(start,end,intensity,forwardX,forwardZ){
    var rightX=Math.cos(heading), rightZ=-Math.sin(heading);

    var lift=(Math.random()-0.5)*0.08;
    var p0=new THREE.Vector3(
      start.x+rightX*jitter,
      start.y+lift,
      start.z+rightZ*jitter);
    var p1=new THREE.Vector3(
      end.x+rightX*jitter*1.4-forwardX*(0.3+intensity*0.75),
      end.y+lift+(Math.random()-0.5)*0.06,
      end.z+rightZ*jitter*1.4-forwardZ*(0.3+intensity*0.75));
    var line=new THREE.Line(
      new THREE.BufferGeometry().setFromPoints([p0,p1]),
      windLineMat.clone());
    line.userData={
      life:18+Math.floor(intensity*12),
      maxLife:18+Math.floor(intensity*12),
      vx:-forwardX*(0.02+speed*0.035),
      vy:0.002,
      vz:-forwardZ*(0.02+speed*0.035)
    };
    scene.add(line);
    vaporTrails.push(line);

  function spawnWingtipVapor(intensity,forwardX,forwardZ){
    if(intensity<0.14||py<1) return;
    var back=0.28+speed*0.8;
    var leftNow=wingtipWorldPoint(-1);
    var rightNow=wingtipWorldPoint(1);
    leftNow.y-=0.03;
    rightNow.y-=0.03;
    var leftPrev=vaporPrevLeft||{x:leftNow.x-forwardX*back,y:leftNow.y,z:leftNow.z-forwardZ*back};
    var rightPrev=vaporPrevRight||{x:rightNow.x-forwardX*back,y:rightNow.y,z:rightNow.z-forwardZ*back};
    makeWindLine(leftNow,leftPrev,intensity,forwardX,forwardZ);
    makeWindLine(rightNow,rightPrev,intensity,forwardX,forwardZ);
    if(intensity>0.55){
      makeWindLine(leftNow,leftPrev,intensity*0.75,forwardX,forwardZ);
      makeWindLine(rightNow,rightPrev,intensity*0.75,forwardX,forwardZ);
    }
    vaporPrevLeft=leftNow;
    vaporPrevRight=rightNow;
  }

  function updateWingtipVaporTrigger(forwardX,forwardZ){
    var turn=Math.abs(steerDX);
    var vertical=Math.abs(steerDY);
    var inputChange=Math.abs(steerDX-vaporPrevDX)+Math.abs(steerDY-vaporPrevDY);
    var speedChange=Math.abs(speed-vaporPrevSpeed)*3.5;
    var active=turn*0.65+vertical*0.55+inputChange*1.25+speedChange;
    if(inputChange<0.025&&speedChange<0.025){
      vaporHold=Math.min(1,vaporHold+0.025);
    }else{
      vaporHold=0;
    }
    var intensity=Math.max(0,active-vaporHold*0.8);
    if(intensity>0.14) spawnWingtipVapor(Math.min(1,intensity),forwardX,forwardZ);
    vaporPrevDX=steerDX;
    vaporPrevDY=steerDY;
    vaporPrevSpeed=speed;
  }

  function igniteDestroyedLauncher(site){

  function updateDestroyedLauncher(site){
    var siteData=site.userData;
    siteData.destroyTimer++;
    for(var partIndex=0;partIndex<siteData.destructionParts.length;partIndex++){
      var part=siteData.destructionParts[partIndex];
      var start=siteData.intactTransforms[partIndex];
      var target=siteData.collapseTargets[partIndex];
      var collapseTime=Math.max(0,Math.min(1,(siteData.destroyTimer-target.delay)/target.duration));
      var collapseEase=1-Math.pow(1-collapseTime,3);
      part.position.lerpVectors(start.position,target.position,collapseEase);
      part.scale.lerpVectors(start.scale,target.scale,collapseEase);
      part.rotation.set(
        start.rotation.x+(target.rotation.x-start.rotation.x)*collapseEase,
        start.rotation.y+(target.rotation.y-start.rotation.y)*collapseEase,
        start.rotation.z+(target.rotation.z-start.rotation.z)*collapseEase);
      if(collapseTime>0&&collapseTime<1){
        var blastJolt=Math.sin(collapseTime*Math.PI*8)*(1-collapseTime)*0.055;
        part.rotation.z+=blastJolt*(partIndex%2?1:-1);
      }
    }
    for(var fireIndex=0;fireIndex<siteData.wreckFires.length;fireIndex++){
      var fire=siteData.wreckFires[fireIndex];
      var fireData=fire.userData;
      var flicker=0.5+0.5*Math.sin(siteData.destroyTimer*0.31+fireData.phase);
      fireData.outer.scale.set(0.82+flicker*0.28,0.8+flicker*0.38,0.82+flicker*0.28);
      fireData.core.scale.set(0.74+(1-flicker)*0.24,0.88+flicker*0.28,0.74+(1-flicker)*0.24);
      fireData.glow.scale.setScalar(0.86+flicker*0.34);
      fireData.outer.material.opacity=0.58+flicker*0.25;
      fireData.core.material.opacity=0.78+flicker*0.18;
      if(siteData.destroyTimer%24===fireIndex*5){
        var smokeWorld=new THREE.Vector3();
        fire.getWorldPosition(smokeWorld);
        smokeWorld.y+=0.9;
        var persistentSmoke=new THREE.Mesh(
          new THREE.SphereGeometry(0.3+Math.random()*0.38,7,5),
          new THREE.MeshBasicMaterial({color:0x282522,transparent:true,opacity:0.38,depthWrite:false}));
        persistentSmoke.position.copy(smokeWorld);
        addCrashPiece(persistentSmoke,new THREE.Vector3((Math.random()-0.5)*0.025,0.035+Math.random()*0.035,(Math.random()-0.5)*0.025),new THREE.Vector3(),90+Math.random()*45,'smoke');
      }
    }
  }

  function impactTower(target,tower){
    if(!target||!tower||!tower.userData.alive)return;
    removeThreat(target);
    tower.userData.hp=Math.max(0,tower.userData.hp-1);
    setTowerHealthBar(tower,tower.userData.hp/tower.userData.maxHp);

    if(tower.userData.hp>0){
      // Non-fatal strike: shake + smoke, same treatment used for damaged launch sites
      tower.userData.damageTimer=95;
      var hitPoint=tower.position.clone().add(new THREE.Vector3(0,-10+tower.userData.towerHeight*0.42,0));
      spawnBoom(hitPoint,0xFF7A18,0.85);
      for(var sp=0;sp<7;sp++){
        var spark=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.1,0.6+Math.random()*1.4),sp%2?towerDark:towerRed);
        spark.position.copy(hitPoint).add(new THREE.Vector3((Math.random()-0.5)*2.4,Math.random()*2,(Math.random()-0.5)*2.4));
        addCrashPiece(spark,new THREE.Vector3((Math.random()-0.5)*0.14,0.03+Math.random()*0.1,(Math.random()-0.5)*0.14),new THREE.Vector3(Math.random()*0.1,Math.random()*0.1,Math.random()*0.1),55+Math.random()*30,'metal');
      }
      showCombatToast('RELAY HIT','STRUCTURAL DAMAGE '+(tower.userData.maxHp-tower.userData.hp)+'/'+tower.userData.maxHp,'#ffcf57');
      updateHUD();
      return;
    }

    tower.userData.alive=false;
    tower.userData.falling=true;
    tower.userData.fallTimer=0;
    tower.userData.fallDirection=target.position.x<tower.position.x?-1:1;
    if(tower.userData.healthBarSprite)tower.userData.healthBarSprite.visible=false;
    var baseWorld=tower.position.clone().add(new THREE.Vector3(0,-10,0));
    spawnBoom(baseWorld.clone().add(new THREE.Vector3(0,tower.userData.towerHeight*0.28,0)),0xFF3E16,1.8);
    spawnBoom(baseWorld.clone().add(new THREE.Vector3(0,tower.userData.towerHeight*0.64,0)),0xFF7A18,1.25);
    for(var td=0;td<18;td++){
      var beam=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.12,1.2+Math.random()*2.6),td%3?towerDark:towerRed);
      beam.position.copy(baseWorld).add(new THREE.Vector3((Math.random()-0.5)*3,2+Math.random()*tower.userData.towerHeight*0.65,(Math.random()-0.5)*3));
      addCrashPiece(beam,new THREE.Vector3((Math.random()-0.5)*0.2,0.04+Math.random()*0.19,(Math.random()-0.5)*0.2),new THREE.Vector3(Math.random()*0.16,Math.random()*0.16,Math.random()*0.16),100+Math.random()*55,'metal');
    }
    showCombatToast('RELAY DESTROYED',aliveTowers().length+' FRIENDLY RELAYS REMAIN','#ff554b');
    updateHUD();
    if(!aliveTowers().length)setTimeout(endGame,1500);
  }

  function addCrashPiece(mesh,v,spin,life,kind){
    mesh.userData={v:v,spin:spin,life:life,maxLife:life,kind:kind};
    scene.add(mesh);
    crashPieces.push(mesh);
  }

  function updateCrashPieces(){
    for(var i=crashPieces.length-1;i>=0;i--){
      var p=crashPieces[i];
      var ud=p.userData;
      ud.life--;
      p.position.add(ud.v);
      if(ud.kind==='metal'){
        ud.v.y-=0.012;
        var debrisGround=planetSurfaceY(p.position.x,p.position.z)+0.15;
        if(p.position.y<debrisGround){
          p.position.y=debrisGround;
          ud.v.y=Math.abs(ud.v.y)*0.28;ud.v.x*=0.8;ud.v.z*=0.8;
        }
        p.rotation.x+=ud.spin.x;p.rotation.y+=ud.spin.y;p.rotation.z+=ud.spin.z;
      }else if(ud.kind==='fire'){
        ud.v.y+=0.002;p.scale.multiplyScalar(1.02);
      }else if(ud.kind==='smoke'){
        p.scale.multiplyScalar(1.025);
      }else if(ud.kind==='ring'){
        p.scale.multiplyScalar(1.14);
      }else if(ud.kind==='flareTrail'){
        ud.v.y+=0.0008;
        p.scale.multiplyScalar(1.045);
      }
      var frac=Math.max(0,ud.life/ud.maxLife);
      if(p.material&&p.material.opacity!==undefined)p.material.opacity=frac*(ud.kind==='smoke'?0.45:ud.kind==='flareTrail'?0.62:0.9);
      if(ud.life<=0){
        scene.remove(p);
        crashPieces.splice(i,1);
      }
    }
  }

  function clearAll(){
    for(var bombShadowIndex=0;bombShadowIndex<bombs.length;bombShadowIndex++){
      if(bombs[bombShadowIndex].userData.shadow)scene.remove(bombs[bombShadowIndex].userData.shadow);
    }
    var all=targets.concat(bullets).concat(bombs).concat(coinMeshes).concat(explosions).concat(crashPieces).concat(vaporTrails).concat(missileTrails).concat(samMissiles).concat(flares);
    for(var i=0;i<all.length;i++) scene.remove(all[i]);
    targets=[];bullets=[];bombs=[];coinMeshes=[];explosions=[];crashPieces=[];vaporTrails=[];missileTrails=[];samMissiles=[];flares=[];
    bombAimActive=false;bombViewPhase='idle';bombViewTimer=0;bombCameraCut=false;
    if(bombAimMarker)bombAimMarker.visible=false;
    bombBtn.classList.remove('armed');

      if(previewBomb){
        previewBomb.position.set(bombSite.position.x,planetSurfaceY(bombSite.position.x,bombSite.position.z)+0.24,bombSite.position.z);
        previewBomb.userData.velocity.set(0,-0.2,0);
        update(16);
      }
    },900);
  }

  // ── Main update ───────────────────────────────────────────────────────────────
  var lastTs=0, timerAcc=0;
  var camTarget=new THREE.Vector3();
  var atmosphereSky=new THREE.Color();
  var atmosphereFog=new THREE.Color();
  var abFlicker=0;
  var tacticalZoom=0;
  var vaporPrevLeft=null,vaporPrevRight=null,vaporPrevDX=0,vaporPrevDY=0,vaporPrevSpeed=0,vaporHold=0;

  function planetSurfaceY(x,z){
    var dx=x-ground.position.x;
    var dz=z-ground.position.z;
    var r2=dx*dx+dz*dz;
    if(r2>=PLANET_RADIUS*PLANET_RADIUS*0.92) return GROUND_Y-18;
    return ground.position.y+Math.sqrt(PLANET_RADIUS*PLANET_RADIUS-r2);
  }

  function placeGroundProp(obj,hasInternalGroundY,lift){
    var surfaceY=planetSurfaceY(obj.position.x,obj.position.z);
    obj.position.y=(hasInternalGroundY?surfaceY-GROUND_Y:surfaceY)+(lift||0);
  }

  function checkTowerCollision(tower){
    if(!tower.userData.alive)return false;
    var dx=px-tower.position.x;
    var dz=pz-tower.position.z;
    var horizontalDist=Math.sqrt(dx*dx+dz*dz);
    var baseY=planetSurfaceY(tower.position.x,tower.position.z);
    var relY=py-baseY;
    var hitRadius=(tower.userData.hitRadius||1.2)+1.55;
    var hitHeight=(tower.userData.towerHeight||12)+0.65;
    if(horizontalDist<hitRadius&&relY>-0.25&&relY<hitHeight){
      var contactY=baseY+Math.max(0,Math.min(relY,hitHeight));
      crashJet(new THREE.Vector3(
        tower.position.x+dx*0.45,
        contactY,
        tower.position.z+dz*0.45),'RELAY COLLISION');
      return true;
    }
    return false;
  }

  function wrapProp(obj,ahead,behind,halfWidth){
    var span=ahead+behind;
    while(obj.position.z>pz+behind) obj.position.z-=span;
    while(obj.position.z<pz-ahead) obj.position.z+=span;
    var width=halfWidth*2;
    while(obj.position.x>px+halfWidth) obj.position.x-=width;
    while(obj.position.x<px-halfWidth) obj.position.x+=width;
  }

  function update(dt){
    if(crashActive){
      updateCrashScene();
      return;
    }

    // Fighter jet physics — heading-based flight, no fixed forward rail.
    var steerEase=steerActive?0.18:0.035;
    steerDX+=(steerTargetDX-steerDX)*steerEase;
    steerDY+=(steerTargetDY-steerDY)*steerEase;
    if(!steerActive&&Math.abs(steerDX)<0.003) steerDX=0;
    if(!steerActive&&Math.abs(steerDY)<0.003) steerDY=0;
    var ACCEL=0.022, DRAG=0.90, MAXUD=0.24;
    var boost=steerActive&&fuel>0?1:0;
    var targetSpeed=boost?0.80:0.32;
    speed+=(targetSpeed-speed)*0.07;
    heading-=steerDX*0.035;
    var targetAssistBank=0;
    if(selectedTarget&&selectedTarget.userData.alive){
      var assistAim=getTargetAim(selectedTarget);
      var assistDX=assistAim.x-px,assistDZ=assistAim.z-pz;
      var assistDistance=Math.sqrt(assistDX*assistDX+assistDZ*assistDZ);
      if(assistDistance>8){
        var assistHeading=Math.atan2(-assistDX,-assistDZ);
        var assistDelta=Math.atan2(Math.sin(assistHeading-heading),Math.cos(assistHeading-heading));
        var assistAuthority=steerActive?0.00135:0.0048;
        heading+=Math.max(-0.72,Math.min(0.72,assistDelta))*assistAuthority;
        targetAssistBank=Math.max(-0.12,Math.min(0.12,assistDelta*0.075))*(steerActive?0.3:1);
      }
    }
    var forwardX=-Math.sin(heading);
    var forwardZ=-Math.cos(heading);
    vx=forwardX*speed;
    vz=forwardZ*speed;
    vy+=(-steerDY)*ACCEL;        // up on screen = up in air
    // Neutral controls carry level-flight lift. The player can still climb or
    // descend deliberately, but the fighter no longer sinks into the planet
    // merely because they are surveying targets.
    if(Math.abs(steerDY)<0.08)vy+=0.0022;
    vy-=0.0022;
    vy*=DRAG;
    vy=Math.max(-MAXUD,Math.min(MAXUD,vy));

    px+=vx; py+=vy; pz+=vz;
    var groundAtJet=planetSurfaceY(px,pz);
    var jetBellyClearance=0.55;
    if(py-jetBellyClearance<=groundAtJet){
      py=groundAtJet+jetBellyClearance;
      crashJet(null,'GROUND IMPACT');
      return;
    }

    // Jet pose
    jet.position.set(px,py,pz);
    jet.rotation.y=heading;
    jet.rotation.z=Math.max(-0.68,Math.min(0.68,-steerDX*0.74+targetAssistBank)); // manual bank plus subtle target-assist lean
    jet.rotation.x=vy*2.8;      // pitch follows vertical movement
    var maneuverLoad=Math.abs(steerDX)*0.85+Math.abs(steerDY)*0.95+Math.abs(vy)*1.8;
    if(maneuverLoad<0.2)straightFlightTick=Math.min(600,straightFlightTick+1);
    else straightFlightTick=Math.max(0,straightFlightTick-7);

    // Afterburner: static when cruising, blue shock diamonds only while boosting.
    if(boost){
      abFlicker+=0.28;
      afterburner.visible=true;
      afterburner.scale.set(
        1+Math.sin(abFlicker)*0.08,
        1+Math.cos(abFlicker*1.17)*0.06,
        1.08+Math.sin(abFlicker*0.72)*0.18);
      afterburner.traverse(function(part){
        if(!part.isMesh||!part.material) return;
        var pulse=0.5+0.5*Math.sin(abFlicker*1.8+(part.userData.phase||0));
        if(part.userData.kind==='core'){
          part.material.opacity=0.42+0.16*pulse;
          part.scale.set(0.8+0.1*pulse,0.8+0.1*pulse,0.95+0.12*pulse);
        }else if(part.userData.kind==='heat'){
          part.material.opacity=0.16+0.12*pulse;
          part.scale.set(0.9+0.12*pulse,0.9+0.12*pulse,1.0+0.18*pulse);
        }else if(part.userData.kind==='haze'){
          part.material.opacity=0.08+0.1*pulse;
          part.scale.set(0.72+0.16*pulse,0.72+0.16*pulse,2.35+0.36*pulse);
          part.rotation.z+=0.025;
        }
      });
    }else{
      afterburner.visible=false;
      afterburner.scale.set(1,1,1);
    }
    updateWingtipVaporTrigger(forwardX,forwardZ);

    updateTargeting(dt);
    updateBombAim();

    // Planet follows the local play area so flight can continue indefinitely.
    ground.position.set(px,GROUND_Y-PLANET_RADIUS,pz);
    paintGroundHemispheres();
    sun.position.set(px+60,py+120,pz+40);
    sun.target.position.set(px,py,pz-20);
    sun.target.updateMatrixWorld();
    var highAlt=Math.max(0,Math.min(1,(py-18)/82));
    atmosphereSky.copy(skyColorLow).lerp(skyColorHigh,highAlt);
    atmosphereFog.copy(fogColorLow).lerp(fogColorHigh,highAlt);
    scene.background.copy(atmosphereSky);
    scene.fog.color.copy(atmosphereFog);
    scene.fog.near=120-highAlt*35;
    scene.fog.far=520-highAlt*80;
    skyUniforms.highAlt.value=highAlt;
    skyDome.position.copy(camera.position);
    starField.position.copy(camera.position);
    starMat.opacity=Math.max(0,Math.min(0.95,highAlt*1.35));
    ambientLight.intensity=1.1-highAlt*0.55;
    hemiLight.intensity=0.7-highAlt*0.35;
    sun.intensity=2.8-highAlt*0.7;
    var bombTacticalZoom=bombViewPhase==='aim'?1.08:(bombViewPhase==='tracking'?1.34:(bombViewPhase==='aftermath'?1.46:0));
    var tacticalZoomTarget=bombTacticalZoom||(samMissiles.length>0?1:0);
    var tacticalZoomEase=tacticalZoomTarget>tacticalZoom?0.028:0.065;
    tacticalZoom+=(tacticalZoomTarget-tacticalZoom)*tacticalZoomEase;
    if(Math.abs(tacticalZoomTarget-tacticalZoom)<0.002)tacticalZoom=tacticalZoomTarget;
    var tacticalWide=tacticalZoom;
    var targetFov=Math.min(108,60+highAlt*24+boost*4+tacticalWide*29);
    if(Math.abs(camera.fov-targetFov)>0.05){
      camera.fov+=(targetFov-camera.fov)*(tacticalZoomTarget>0?0.045:0.04);
      camera.updateProjectionMatrix();
    }
    for(var stw=0;stw<stoneGroup.children.length;stw++){
      wrapProp(stoneGroup.children[stw],210,100,175);
      placeGroundProp(stoneGroup.children[stw],false,stoneGroup.children[stw].userData.terrainLift||0.08);
    }
    for(var tiw=0;tiw<treeGroup.children.length;tiw++){
      wrapProp(treeGroup.children[tiw],230,110,170);
      placeGroundProp(treeGroup.children[tiw],true);
    }
    for(var grw=0;grw<grassGroup.children.length;grw++){
      wrapProp(grassGroup.children[grw],170,80,145);
      placeGroundProp(grassGroup.children[grw],true);
    }
    for(var tow=0;tow<towerGroup.children.length;tow++){
      var twr=towerGroup.children[tow];
      placeGroundProp(twr,true);
      if(twr.userData.falling){
        twr.userData.fallTimer++;
        var fallT=Math.min(1,twr.userData.fallTimer/105);
        var fallEase=fallT*fallT*(3-2*fallT);
        twr.userData.structure.rotation.z=twr.userData.fallDirection*fallEase*1.48;
        twr.userData.structure.rotation.x=Math.sin(fallT*Math.PI)*0.08;
        if(fallT>0.72&&!twr.userData.debrisSpawned){
          twr.userData.debrisSpawned=true;
          var topImpact=twr.position.clone().add(new THREE.Vector3(twr.userData.fallDirection*twr.userData.towerHeight*0.78,-8.6,0));
          spawnBoom(topImpact,0x9B7650,1.25);
          for(var ds=0;ds<12;ds++){
            var dust=new THREE.Mesh(new THREE.SphereGeometry(0.35+Math.random()*0.5,7,5),new THREE.MeshBasicMaterial({color:0x6E5B48,transparent:true,opacity:0.45}));
            dust.position.copy(topImpact).add(new THREE.Vector3((Math.random()-0.5)*6,Math.random()*1.8,(Math.random()-0.5)*5));
            addCrashPiece(dust,new THREE.Vector3((Math.random()-0.5)*0.05,0.025+Math.random()*0.05,(Math.random()-0.5)*0.05),new THREE.Vector3(),65+Math.random()*40,'smoke');
          }
        }
        if(fallT>=1){
          twr.userData.falling=false;
          twr.userData.structure.visible=false;
          for(var fs=0;fs<twr.userData.supportStructures.length;fs++)twr.userData.supportStructures[fs].visible=false;
          twr.userData.rubble.visible=true;
        }
      }else{
        if(twr.userData.damageTimer>0){
          twr.userData.damageTimer--;
          var towerDamageStrength=twr.userData.damageTimer/95;
          twr.userData.structure.rotation.z=Math.sin(twr.userData.damageTimer*1.4)*0.03*towerDamageStrength;
          twr.userData.structure.rotation.x=Math.cos(twr.userData.damageTimer*1.05)*0.018*towerDamageStrength;
          if(twr.userData.damageTimer%20===0){
            spawnBoom(twr.position.clone().add(new THREE.Vector3((Math.random()-0.5)*3,-9+twr.userData.towerHeight*0.4,(Math.random()-0.5)*3)),0xFF7B22,0.4);
          }
          if(twr.userData.damageTimer===0)twr.userData.structure.rotation.set(0,0,0);
        }
        if(twr.userData.alive&&checkTowerCollision(twr)) return;
      }
    }

    droneEscalationTick++;
    if(droneEscalationTick>=1100){
      droneEscalationTick=0;
      droneCapacity=Math.min(14,droneCapacity+1);
    }
    for(var esu=0;esu<enemyLaunchers.length;esu++){
      var siteU=enemyLaunchers[esu],siteData=siteU.userData;
      placeGroundProp(siteU,true);
      if(!siteData.alive){updateDestroyedLauncher(siteU);continue;}
      if(siteData.damageTimer>0){
        siteData.damageTimer--;
        var damageStrength=siteData.damageTimer/105;
        siteU.rotation.z=Math.sin(siteData.damageTimer*1.55)*0.035*damageStrength;
        siteU.rotation.x=Math.cos(siteData.damageTimer*1.1)*0.012*damageStrength;
        if(siteData.damageTimer%22===0){
          spawnBoom(siteU.position.clone().add(new THREE.Vector3((Math.random()-0.5)*8,-5.5+Math.random()*3,(Math.random()-0.5)*7)),0xFF7B22,0.42);
        }
        if(siteData.damageTimer===0)siteU.rotation.set(0,0,0);
      }
      if(siteData.suppressedTimer>0)siteData.suppressedTimer--;
      if(siteData.stock<9){
        siteData.reload++;
        if(siteData.reload>=180){
          siteData.reload=0;
          if(siteData.storedDrones[siteData.stock])siteData.storedDrones[siteData.stock].visible=true;
          siteData.stock++;
        }
      }
      siteData.launchTick--;
      if(siteData.launchTick<=0&&siteData.stock>0&&targets.length<droneCapacity){
        spawnTarget(siteU);
        siteData.launchTick=220+Math.floor(Math.random()*140);
      }
      siteData.samTick--;
      var samDistance=Math.sqrt((siteU.position.x-px)*(siteU.position.x-px)+(siteU.position.z-pz)*(siteU.position.z-pz));
      if(siteData.samTick<=0&&siteData.suppressedTimer<=0&&straightFlightTick>80&&samDistance<220&&samMissiles.length<4){
        launchSAM(siteU);
        siteData.samTick=440+Math.floor(Math.random()*320);
      }
    }

    // Clouds drift slowly; wrap around when they pass the jet
    for(var ci2=0;ci2<cloudData.length;ci2++){
      var cd=cloudData[ci2];
      cd.mesh.position.x+=0.012;
      if(cd.mesh.position.x>px+160) cd.mesh.position.x=px-160;
      // Wrap clouds in Z relative to jet
      if(cd.mesh.position.z>pz+160) cd.mesh.position.z=pz-160;
    }

    // Fuel — burns faster when boosting (afterburner), slower at higher altitude (thinner air = more efficient cruise)
    var altFactor=Math.max(0.35,1.0-(py/80)*0.65); // 0.35 at high alt, 1.0 at ground
    var boostBurn=steerActive?0.045:-0.012;
    fuel=Math.max(0,Math.min(100,fuel-boostBurn*altFactor));

    // Guided missiles climb away from the fighter, then home on the locked drone.
    for(var i=bullets.length-1;i>=0;i--){
      var bl=bullets[i];
      bl.userData.life--;
      if(bl.userData.life<=0){scene.remove(bl);bullets.splice(i,1);continue;}
      var missileTarget=bl.userData.target;
      if(missileTarget&&missileTarget.userData.alive){
        var targetAim=getTargetAim(missileTarget);
        var desired=targetAim.clone().sub(bl.position).normalize();
        bl.userData.speed=Math.min(1.9,bl.userData.speed+0.022);
        desired.multiplyScalar(bl.userData.speed);
        bl.userData.velocity.lerp(desired,0.075);
        bl.userData.velocity.setLength(bl.userData.speed);
        bl.position.add(bl.userData.velocity);
        bl.lookAt(bl.position.clone().add(bl.userData.velocity));
        bl.userData.flame.scale.y=0.75+Math.random()*0.55;
        bl.userData.trailTick++;
        if(bl.userData.trailTick%2===0)addMissileTrail(bl.position.clone().addScaledVector(bl.userData.velocity.clone().normalize(),-1.15));
        var hitRadius=missileTarget.userData.type==='launcher'?missileTarget.userData.hitRadius:(missileTarget.userData.sz+1.3);
        if(bl.position.distanceTo(targetAim)<hitRadius){
          if(missileTarget.userData.type==='launcher')destroyLauncher(missileTarget,bl.position.clone(),'missile');
          else destroyThreat(missileTarget,bl.position.clone());
          scene.remove(bl);bullets.splice(i,1);
        }
      }else{
        bl.userData.velocity.y-=0.015;
        bl.position.add(bl.userData.velocity);
      }
    }

    for(var bombIndex=bombs.length-1;bombIndex>=0;bombIndex--){
      var fallingBomb=bombs[bombIndex];
      fallingBomb.userData.life--;
      fallingBomb.userData.velocity.y-=0.0115;
      fallingBomb.position.add(fallingBomb.userData.velocity);
      fallingBomb.rotation.z+=fallingBomb.userData.spin;
      fallingBomb.rotation.x+=0.018;
      var bombGround=planetSurfaceY(fallingBomb.position.x,fallingBomb.position.z);
      var bombAltitude=Math.max(0,fallingBomb.position.y-bombGround);
      if(fallingBomb.userData.shadow){
        fallingBomb.userData.shadow.position.set(fallingBomb.position.x,bombGround+0.08,fallingBomb.position.z);
        var shadowScale=0.7+Math.min(2.4,bombAltitude*0.055);
        fallingBomb.userData.shadow.scale.set(shadowScale,shadowScale,shadowScale);
        fallingBomb.userData.shadow.material.opacity=0.25*Math.max(0.18,1-bombAltitude/58);
      }
      if(fallingBomb.position.y<=bombGround+0.2||fallingBomb.userData.life<=0){
        fallingBomb.position.y=bombGround+0.2;
        bombViewPoint.copy(fallingBomb.position);
        bombViewPhase='aftermath';
        bombViewTimer=60;
        var bombTarget=null,bombDistance=Infinity;
        var bombSites=liveLaunchers();
        for(var bombSiteIndex=0;bombSiteIndex<bombSites.length;bombSiteIndex++){
          var candidateSite=bombSites[bombSiteIndex];
          var bombDX=fallingBomb.position.x-candidateSite.position.x;
          var bombDZ=fallingBomb.position.z-candidateSite.position.z;
          var candidateDistance=Math.sqrt(bombDX*bombDX+bombDZ*bombDZ);
          if(candidateDistance<bombDistance){bombDistance=candidateDistance;bombTarget=candidateSite;}
        }
        if(bombTarget&&bombDistance<(bombTarget.userData.hitRadius||8)+3.5){
          destroyLauncher(bombTarget,fallingBomb.position.clone(),'bomb');
        }else{
          spawnBoom(fallingBomb.position.clone(),0x8A5A32,1.15);
          showCombatToast('BOMB MISSED','IMPACT OUTSIDE SITE PERIMETER','#ffcf57');
        }
        if(fallingBomb.userData.shadow)scene.remove(fallingBomb.userData.shadow);
        scene.remove(fallingBomb);bombs.splice(bombIndex,1);
      }
    }
    if(bombViewPhase==='aftermath'){
      bombViewTimer--;
      if(bombViewTimer<=0){
        bombViewPhase='idle';
        bombCameraCut=true;
        tacticalZoom=0;
        tacticalWide=0;
        tacticalZoomTarget=0;
      }
    }

    for(var fi=flares.length-1;fi>=0;fi--){
      var flare=flares[fi];
      flare.userData.life--;
      flare.position.add(flare.userData.velocity);
      flare.userData.velocity.y-=0.0015;
      var flareFrac=Math.max(0,flare.userData.life/flare.userData.maxLife);
      var flarePulse=0.5+0.5*Math.sin((flare.userData.maxLife-flare.userData.life)*0.62+flare.userData.phase);
      flare.userData.core.material.opacity=Math.min(1,flareFrac*1.7);
      flare.userData.flame.material.opacity=flareFrac*(0.65+flarePulse*0.35);
      flare.userData.halo.material.opacity=flareFrac*(0.18+flarePulse*0.22);
      flare.userData.halo.scale.setScalar(0.85+flarePulse*0.5+(1-flareFrac)*1.2);
      flare.userData.flame.scale.y=0.72+flarePulse*0.65;
      flare.userData.trailTick++;
      if(flare.userData.trailTick%4===0&&flareFrac>0.12){
        var flareTrail=new THREE.Mesh(
          new THREE.SphereGeometry(0.08+Math.random()*0.07,7,5),
          new THREE.MeshBasicMaterial({color:Math.random()<0.42?0xFFF3B0:0xFF6A18,transparent:true,opacity:0.62,blending:THREE.AdditiveBlending,depthWrite:false}));
        flareTrail.position.copy(flare.position);
        addCrashPiece(flareTrail,flare.userData.velocity.clone().multiplyScalar(0.08),new THREE.Vector3(),22+Math.random()*10,'flareTrail');
      }
      if(flare.userData.life<=0){
        scene.remove(flare);flares.splice(fi,1);
      }
    }

    for(var smi=samMissiles.length-1;smi>=0;smi--){
      var sam=samMissiles[smi],sud=sam.userData;
      sud.life--;
      if(sud.life<=0){scene.remove(sam);samMissiles.splice(smi,1);continue;}
      var flareTarget=sud.targetFlare&&sud.targetFlare.userData.life>0?sud.targetFlare:null;
      if(!flareTarget&&maneuverLoad>0.86)sud.lockQuality-=0.007+maneuverLoad*0.004;
      else if(!flareTarget)sud.lockQuality=Math.min(1,sud.lockQuality+0.012);
      if(sud.lockQuality<=0){
        spawnBoom(sam.position.clone(),0xFFAA33,0.75);scene.remove(sam);samMissiles.splice(smi,1);
        showCombatToast('SAM DEFEATED','MANEUVER BROKE RADAR LOCK','#4dffa4');
        continue;
      }
      var samAim=(flareTarget?flareTarget.position:jet.position).clone();
      if(!flareTarget){
        var samRange=sam.position.distanceTo(jet.position);
        var leadFrames=Math.max(4,Math.min(14,samRange/18));
        samAim.add(new THREE.Vector3(vx,vy,vz).multiplyScalar(leadFrames));
      }
      var samDesired=samAim.sub(sam.position).normalize();
      sud.speed=Math.min(1.72,sud.speed+0.016);
      samDesired.multiplyScalar(sud.speed);
      var guidanceStrength=flareTarget?0.13:(sam.position.distanceTo(jet.position)<58?0.15:0.105);
      sud.velocity.lerp(samDesired,guidanceStrength);
      sud.velocity.setLength(sud.speed);
      sam.position.add(sud.velocity);
      sam.lookAt(sam.position.clone().add(sud.velocity));
      sud.plume.scale.y=0.7+Math.random()*0.6;
      sud.trailTick++;
      if(sud.trailTick%3===0)addMissileTrail(sam.position.clone().addScaledVector(sud.velocity.clone().normalize(),-1));
      if(flareTarget&&sam.position.distanceTo(flareTarget.position)<1.4){
        spawnBoom(sam.position.clone(),0xFFB13B,0.9);
        scene.remove(sam);samMissiles.splice(smi,1);
        scene.remove(flareTarget);var flareIndex=flares.indexOf(flareTarget);if(flareIndex>=0)flares.splice(flareIndex,1);
        continue;
      }
      if(!flareTarget&&sam.position.distanceTo(jet.position)<3.35){
        health=Math.max(0,health-42);
        spawnBoom(jet.position.clone(),0xFF421A,1.15);
        scene.remove(sam);samMissiles.splice(smi,1);
        if(health<=0){crashJet(null,'SAM IMPACT');return;}
        showCombatToast('AIRFRAME HIT',health+'% INTEGRITY REMAINS','#ff554b');
      }
    }
    document.getElementById('danger-vignette').classList.toggle('active',samMissiles.length>0&&Math.floor(Date.now()/220)%2===0);

    // Attack drones track a live radio tower and commit to a terminal dive.
    spawnTick++;
    var rate=Math.max(150,255-kills*7);
    if(spawnTick>=rate&&targets.length<droneCapacity){
      spawnTick=0;
      spawnTarget();
    }
    for(var i=targets.length-1;i>=0;i--){
      var b=targets[i];
      if(!b.userData.targetTower||!b.userData.targetTower.userData.alive){
        var remaining=aliveTowers();
        if(!remaining.length)continue;
        if(b.userData.targetTower)b.userData.targetTower.userData.incomingCount=Math.max(0,b.userData.targetTower.userData.incomingCount-1);
        b.userData.targetTower=remaining[Math.floor(Math.random()*remaining.length)];
        b.userData.targetTower.userData.incomingCount++;
      }
      b.userData.wob+=0.05;
      b.userData.propeller.rotation.z+=0.48;
      var towerTarget=b.userData.targetTower;
      var towerSurface=planetSurfaceY(towerTarget.position.x,towerTarget.position.z);
      var cruiseAltitude=b.userData.cruiseAltitude;
      if(b.userData.state==='launching'){
        b.userData.launchFrames++;
        if(b.userData.launchFrames>120)b.userData.state='approach';
      }
      var aimY=b.userData.state==='dive'?towerSurface+1.8:towerSurface+cruiseAltitude;
      var aim=new THREE.Vector3(towerTarget.position.x,aimY,towerTarget.position.z);
      var toTower=aim.sub(b.position);
      var horizontal=Math.sqrt(toTower.x*toTower.x+toTower.z*toTower.z);
      if(b.userData.state==='approach'&&horizontal<55){
        b.userData.state='dive';b.userData.speed*=1.75;
      }
      var previousDronePosition=b.position.clone();
      var dir=toTower.normalize();
      b.position.addScaledVector(dir,b.userData.speed);
      if(b.userData.state==='approach')b.position.y+=Math.sin(b.userData.wob)*0.018;

      // Follow the globe instead of flying a straight chord through it. Launch
      // lanes rise smoothly, cruise lanes vary per aircraft, and only the final
      // attack run is allowed to descend toward tower height.
      var surfaceBelowDrone=planetSurfaceY(b.position.x,b.position.z);
      var requiredClearance=cruiseAltitude;
      if(b.userData.state==='launching'){
        requiredClearance=4+(cruiseAltitude-4)*Math.min(1,b.userData.launchFrames/120);
      }else if(b.userData.state==='dive'){
        requiredClearance=Math.max(1.8,Math.min(cruiseAltitude,horizontal*0.34));
      }
      b.position.y=Math.max(b.position.y,surfaceBelowDrone+requiredClearance);
      var actualDirection=b.position.clone().sub(previousDronePosition).normalize();
      var droneHeading=Math.atan2(-actualDirection.x,-actualDirection.z);
      b.rotation.y=droneHeading;
      b.rotation.x=Math.asin(Math.max(-0.8,Math.min(0.8,actualDirection.y)));
      b.rotation.z=Math.sin(b.userData.wob)*0.05;
      if(b.userData.state==='dive'&&b.position.distanceTo(new THREE.Vector3(towerTarget.position.x,towerSurface+1.8,towerTarget.position.z))<2.8){
        impactTower(b,towerTarget);
      }
    }

    // Coins
    for(var i=coinMeshes.length-1;i>=0;i--){
      var c=coinMeshes[i];
      c.userData.vy-=0.004;
      c.position.y+=c.userData.vy;
      c.rotation.y+=c.userData.spinY;
      c.userData.life--;
      if(c.userData.life<=0||c.position.y<planetSurfaceY(c.position.x,c.position.z)+0.15){scene.remove(c);coinMeshes.splice(i,1);continue;}
      if(!c.userData.done&&c.position.distanceTo(jet.position)<1.8){
        c.userData.done=true;coins++;score+=5;scene.remove(c);coinMeshes.splice(i,1);
      }
    }

    // Explosions
    for(var i=explosions.length-1;i>=0;i--){
      var ex=explosions[i];
      ex.userData.life--;
      var frac=Math.max(0,ex.userData.life/32);
      for(var k=0;k<ex.children.length;k++){
        var p=ex.children[k];
        if(p.userData.v){p.position.add(p.userData.v);p.userData.v.y-=0.006;}
        p.scale.setScalar(frac);
        if(p.material&&p.material.opacity!==undefined) p.material.opacity=frac;
      }
      if(ex.userData.life<=0){scene.remove(ex);explosions.splice(i,1);}
    }

    updateCrashPieces();

    // Wingtip vapor trails
    for(var i=vaporTrails.length-1;i>=0;i--){
      var vt=vaporTrails[i];
      vt.userData.life--;
      vt.position.x+=vt.userData.vx;
      vt.position.y+=vt.userData.vy;
      vt.position.z+=vt.userData.vz;
      vt.material.opacity=0.55*Math.max(0,vt.userData.life/vt.userData.maxLife);
      if(vt.userData.life<=0){
        scene.remove(vt);
        vaporTrails.splice(i,1);
      }
    }

    for(var mti=missileTrails.length-1;mti>=0;mti--){
      var mtp=missileTrails[mti];
      mtp.userData.life--;
      mtp.scale.multiplyScalar(1.035);
      mtp.position.y+=0.012;
      mtp.material.opacity=0.42*Math.max(0,mtp.userData.life/mtp.userData.maxLife);
      if(mtp.userData.life<=0){scene.remove(mtp);missileTrails.splice(mti,1);}
    }

    if(missilesReady<MISSILE_CAPACITY){
      reloadTick++;
      if(reloadTick>=MISSILE_RELOAD_FRAMES){
        reloadTick=0;missilesReady++;
        if(selectedTarget&&selectedTarget.userData.locked)fireBtn.disabled=false;
      }
    }else reloadTick=0;
    if(bombsReady<BOMB_CAPACITY){
      bombReloadTick++;
      if(bombReloadTick>=BOMB_RELOAD_FRAMES){bombReloadTick=0;bombsReady++;}
    }else bombReloadTick=0;
    if(flaresReady<FLARE_CAPACITY){
      flareReloadTick++;
      if(flareReloadTick>=FLARE_RELOAD_FRAMES){flareReloadTick=0;flaresReady++;}
    }else flareReloadTick=0;

    // Camera — chase normally; frame the sight, falling bomb, and one second of
    // aftermath without snapping back to the jet before the player sees impact.
    var camForwardX=-Math.sin(heading), camForwardZ=-Math.cos(heading);
    var camGoal;
    if(bombViewPhase==='aim'&&bombAimActive){
      camTarget.set(
        px+(bombViewPoint.x-px)*0.42,
        py+(bombViewPoint.y-py)*0.42,
        pz+(bombViewPoint.z-pz)*0.42);
      camGoal=new THREE.Vector3(
        px-camForwardX*30,
        py+24,
        pz-camForwardZ*30);
    }else if(bombViewPhase==='tracking'&&bombs.length){
      var trackedBomb=bombs[0];
      camTarget.copy(trackedBomb.position).lerp(trackedBomb.userData.targetPoint,0.58);
      var fallSpan=trackedBomb.position.distanceTo(trackedBomb.userData.targetPoint);
      camGoal=new THREE.Vector3(
        camTarget.x-camForwardX*(26+fallSpan*0.22),
        camTarget.y+20+fallSpan*0.28,
        camTarget.z-camForwardZ*(26+fallSpan*0.22));
    }else if(bombViewPhase==='aftermath'){
      camTarget.copy(bombViewPoint);
      camGoal=new THREE.Vector3(
        bombViewPoint.x-camForwardX*25,
        bombViewPoint.y+21,
        bombViewPoint.z-camForwardZ*25);
    }else{
      var tacticalChaseDistance=18+tacticalWide*17;
      var tacticalChaseHeight=13+tacticalWide*5;
      camGoal=new THREE.Vector3(
        px-camForwardX*tacticalChaseDistance,
        py+tacticalChaseHeight,
        pz-camForwardZ*tacticalChaseDistance);
      camTarget.set(px+camForwardX*15,py-2,pz+camForwardZ*15);
    }
    var cameraFollowEase=bombViewPhase==='aim'?0.1:(bombViewPhase==='tracking'||bombViewPhase==='aftermath'?0.09:(tacticalZoomTarget>0?0.07:0.06));
    if(bombCameraCut){
      camera.position.copy(camGoal);
      camera.fov=Math.min(102,60+highAlt*24+boost*4);
      camera.updateProjectionMatrix();
      bombCameraCut=false;
    }else{
      camera.position.lerp(camGoal,cameraFollowEase);
    }
    camera.lookAt(camTarget);
    skyDome.position.copy(camera.position);
    starField.position.copy(camera.position);

    // Flight clock: the mission ends only through victory, tower loss, or a
    // confirmed aircraft loss—never because an arbitrary countdown expired.
    timerAcc+=dt;
    if(timerAcc>=1000){timerAcc-=1000;timeLeft++;}

    refuelTick++;

    statsTick++;
    if(statsTick>=30){statsTick=0;postStats();}

    updateHUD();
  }

  // ── Render loop ───────────────────────────────────────────────────────────────
  var FIXED_STEP_MS=1000/60;
  var simAccumulator=0;
  function animate(ts){
    requestAnimationFrame(animate);
    if(!lastTs)lastTs=ts;
    var dt=Math.min(100,Math.max(0,ts-lastTs));lastTs=ts;
    if(gameActive||crashActive){
      simAccumulator+=dt;
      var fixedUpdates=0;
      while(simAccumulator>=FIXED_STEP_MS&&fixedUpdates<6){
        update(FIXED_STEP_MS);
        simAccumulator-=FIXED_STEP_MS;
        fixedUpdates++;
      }
      if(fixedUpdates===6)simAccumulator=0;
    }else simAccumulator=0;
    renderer.render(scene,camera);
  }
  requestAnimationFrame(animate);

  window.addEventListener('resize',function(){
    var w=window.innerWidth, h=window.innerHeight;
    renderer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix();
  });

  var st=document.createElement('style');
  st.textContent='@keyframes floatUp{from{transform:translateY(0);opacity:1;}to{transform:translateY(-100px);opacity:0;}}';
  document.head.appendChild(st);
})();
</script>
</body>
</html>
