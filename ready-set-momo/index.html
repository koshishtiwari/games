:root{--ink:#2a1730;--o:2px 0 0 var(--ink),-2px 0 0 var(--ink),0 2px 0 var(--ink),0 -2px 0 var(--ink),1.5px 1.5px 0 var(--ink),-1.5px 1.5px 0 var(--ink),1.5px -1.5px 0 var(--ink),-1.5px -1.5px 0 var(--ink),0 3.5px 0 var(--ink),1.5px 3.5px 0 var(--ink),-1.5px 3.5px 0 var(--ink)}
html,body{font-family:"Lilita One","Avenir Next","Trebuchet MS",Arial,sans-serif;letter-spacing:.015em}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 90% 80% at 50% 45%,rgba(255,235,190,0) 58%,rgba(28,8,44,.42) 100%)}
#rb button,#snd,#drop,.sr button,.tr button,.act button,.up,.more,.tb,.seg button,#rmbar button,.tile,#title .cta,#title .kick{position:relative;isolation:isolate;border:3.5px solid var(--ink);box-shadow:inset 0 3px 0 rgba(255,255,255,.48),inset 0 -5px 0 rgba(0,0,0,.22),0 5px 0 var(--ink),0 9px 14px rgba(20,8,30,.36);transition:transform .07s cubic-bezier(.2,1.5,.4,1),box-shadow .07s ease,filter .15s}
#rb button::before,#snd::before,#drop::before,.sr button::before,.tr button::before,.act button::before,.up::before,.more::before,.tb::before,.seg button::before,#rmbar button::before,.tile::before,#title .cta::before,#title .kick::before{content:'';position:absolute;left:8%;right:8%;top:3px;height:42%;border-radius:999px 999px 45% 45%/90% 90% 30% 30%;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,.04));z-index:-1;pointer-events:none}
#rb button:not(:disabled):active,#snd:active,#drop:active,.sr button:not(:disabled):active,.tr button:not(:disabled):active,.act button:not(:disabled):active,.up:not(:disabled):active,.more:active,.tb:active,.seg button:active,#rmbar button:active,.tile:not(:disabled):active{transform:translateY(3.5px);box-shadow:inset 0 2px 0 rgba(255,255,255,.32),inset 0 -2px 0 rgba(0,0,0,.22),0 1.5px 0 var(--ink),0 2px 4px rgba(20,8,30,.3)}
button:disabled{opacity:.62!important;filter:saturate(.25) brightness(.82)}
#rb button,#snd{width:48px;height:48px;border-radius:16px;font-size:21px;background:linear-gradient(180deg,#ffca5c 0%,#ff982e 55%,#e06814 100%)}
#drop{width:70px;height:70px;font-size:13px;line-height:1.1}
#money,#rev{background:linear-gradient(180deg,#44306b 0%,#281945 100%);border:3.5px solid var(--ink);border-radius:999px;box-shadow:inset 0 3px 0 rgba(255,255,255,.22),inset 0 -4px 0 rgba(0,0,0,.32),0 5px 0 var(--ink),0 8px 14px rgba(20,8,30,.4)}
#money{position:relative;padding:4px 18px 4px 40px;margin-left:16px;font-size:23px;min-width:112px}
#mt{color:#ffe678;text-shadow:var(--o)}
#money.bump{animation:mbump .34s cubic-bezier(.2,1.8,.4,1)}
@keyframes mbump{40%{transform:scale(1.16)}}
#money i{position:absolute;left:-18px;top:50%;margin-top:-20px;width:40px;height:40px;border-radius:50%;border:3.5px solid var(--ink);background:radial-gradient(circle at 34% 28%,#fff6b8 0,#ffd23a 38%,#f0a014 78%,#c97a08 100%);box-shadow:inset 0 -3px 0 rgba(160,80,0,.45),0 3px 0 var(--ink)}
#money i::after{content:'';position:absolute;left:6px;top:6px;right:6px;bottom:6px;width:auto;height:auto;margin:0;border-radius:50%;background:none;border:2.5px solid rgba(190,100,6,.55)}
#rev{padding:3px 16px 3px 10px}
#clock{font-size:13.5px;opacity:.98;background:rgba(24,14,42,.58);border:2.5px solid var(--ink);border-radius:999px;padding:2px 11px;box-shadow:0 3px 0 var(--ink),inset 0 1.5px 0 rgba(255,255,255,.22)}
.cfly{position:fixed;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;z-index:8;pointer-events:none;border:3px solid var(--ink);background:radial-gradient(circle at 34% 28%,#fff6b8 0,#ffd23a 42%,#f0a014 85%);box-shadow:0 2px 0 var(--ink);will-change:transform,opacity}
.ft{font-size:27px;letter-spacing:.02em;animation:up 1.2s cubic-bezier(.2,.8,.3,1) forwards;will-change:transform,opacity}
@keyframes up{0%{transform:translate(-50%,8px) scale(.3);opacity:0}10%{transform:translate(-50%,-6px) scale(1.4);opacity:1}22%{transform:translate(-50%,-10px) scale(1)}78%{opacity:1}100%{transform:translate(-50%,-82px) scale(.95);opacity:0}}
#staff{background:repeating-linear-gradient(135deg,rgba(255,255,255,.04) 0 14px,rgba(255,255,255,0) 14px 28px),linear-gradient(180deg,#3b64b8 0,#284888 38%,#1d3468 100%);border-radius:28px 28px 0 0;box-shadow:inset 0 3px 0 rgba(255,255,255,.35),inset 0 0 0 3px rgba(130,175,255,.2),0 -12px 34px rgba(10,4,24,.6);animation:sheet .34s cubic-bezier(.2,1.15,.3,1)}
@keyframes sheet{from{transform:translateY(55%);opacity:0}}
